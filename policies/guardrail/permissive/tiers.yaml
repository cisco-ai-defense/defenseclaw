      floor: alert
      levels: false
    managed:
      floor: alert
      levels: false
  - id: state-write
    source: rel-1-0-10:GAP-0747
    per_user:
      floor: alert
    managed:
      floor: alert
  - id: shell-protected-file
    source: rel-1-0-6:GAP-0675
