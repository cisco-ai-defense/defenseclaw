version: 1
category: cognitive-file
rules:
  - id: COG-SOUL
    tool_call_only: true
    expression: >-
      f.paths.exists(p,
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: '(?i)SOUL\.md'
    title: "SOUL.md active-file mutation"
    severity: CRITICAL
    confidence: 0.95
    tags: [cognitive-tampering]
  - id: COG-IDENTITY
    tool_call_only: true
    expression: >-
      f.paths.exists(p,
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: '(?i)IDENTITY\.md'
    title: "IDENTITY.md active-file mutation"
    severity: CRITICAL
    confidence: 0.95
    tags: [cognitive-tampering]
  - id: COG-MEMORY
    expression: >-
      f.paths.exists(p,
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: '(?i)MEMORY\.md'
    title: "MEMORY.md mutation or reference"
    severity: HIGH
    confidence: 0.85
    tags: [cognitive-tampering]
  - id: COG-CLAUDE-MD
    tool_call_only: true
    expression: >-
      f.paths.exists(p,
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: '(?i)CLAUDE\.md'
    title: "CLAUDE.md active-file mutation"
    severity: HIGH
    confidence: 0.85
    tags: [cognitive-tampering]
  - id: COG-TOOLS-MD
    tool_call_only: true
    expression: >-
      f.paths.exists(p,
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: '(?i)TOOLS\.md'
    title: "TOOLS.md active-file mutation"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering]
  - id: COG-AGENTS-MD
    tool_call_only: true
    expression: >-
      f.paths.exists(p,
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: 'a^'
    title: "AGENTS.md active-file mutation"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering]
  - id: COG-OPENCLAW-JSON
    expression: >-
      f.paths.exists(p,
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: '(?i)openclaw\.json'
    title: "openclaw.json config access"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering]
  - id: COG-GATEWAY-JSON
    tool_call_only: true
    expression: >-
      f.paths.exists(p,
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: '(?i)gateway\.json'
    title: "gateway.json active-file mutation"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering]
  - id: tamper.detector_state_write
    tool_call_only: true
    expression: >-
      f.commands.exists(c,
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_METADATA]))
    pattern: '(?i)(?:~|\$HOME|\$\{HOME\}|/root|/(?:home|Users)/[^/\\"'']+|[a-z]:[/\\]Users[/\\][^/\\"'']+)[/\\]\.defenseclaw[/\\](?:\.env|config\.yaml|confidence_policy\.yaml|guardrail_runtime\.json|device\.key|picked_connector|custom-providers\.json|(?:audit|judge|judge_bodies)\.db(?:-(?:wal|shm))?|(?:cache|hooks|installer|policies|previous[/\\]installer|quarantine|receipts|registries)[/\\][^;\s]+)\b'
    title: "DefenseClaw security state mutation"
    severity: HIGH
    confidence: 0.98
    tags: [cognitive-tampering, tampering, security-state]
  - id: tamper.agent_hook_config_disable
    tool_call_only: true
    # Code-owned (agentHookConfigFindings, GAP-0048): a native file tool
    # call (Write, Edit, MultiEdit, apply_patch) on an agent hook file whose
    # resulting document turns DefenseClaw off: disableAllHooks or
    # allowManagedHooksOnly set, a DefenseClaw hook entry removed or changed,
    # Codex [features] hooks = false, the OpenCode bridge dropped, removed or
    # rewritten. Every other edit of these files stays allowed. The inert
    # regex cannot match alone.
    pattern: 'a^'
    title: "Turn off the agent's DefenseClaw hooks"
    severity: CRITICAL
    confidence: 0.98
    tags: [cognitive-tampering, tampering, security-state]
  - id: tamper.agent_hook_config_write
    tool_call_only: true
    # Code-owned (agentHookConfigFindings, GAP-0048): a shell write to an
    # agent hook file, whose content the gateway does not read. HIGH: an
    # alert in the default pack, a block in strict.
    pattern: 'a^'
    title: "Shell write to an agent hook config"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering, tampering]
  - id: tamper.defenseclaw_control_disable
    tool_call_only: true
    # Code-owned (defenseClawControlFindings, GAP-0596): a tool call that
    # stops, disables, uninstalls or weakens DefenseClaw itself: the
    # defenseclaw or defenseclaw-gateway program with a stop, disable,
    # uninstall, reset, observe-mode, fail-open or config set/unset verb, a
    # service manager (systemctl, launchctl, sc, net, schtasks, Stop-Service)
    # stopping a DefenseClaw unit, label or service, or kill/pkill/taskkill of
    # a DefenseClaw process. Read-only commands, restarts and enables stay
    # allowed. The inert regex cannot match alone. Same decision as
    # tamper.detector_state_write: the effect is the same as writing the state.
    pattern: 'a^'
    title: "Stop or disable DefenseClaw"
    severity: CRITICAL
    confidence: 0.98
    tags: [cognitive-tampering, tampering, security-state]
  - id: tamper.defenseclaw_control_unproven
    tool_call_only: true
    # Code-owned (defenseClawControlFindings, GAP-0596): a DefenseClaw command
    # that changes something the rules cannot name (a verb that is not a known
    # read, stop or disable), a dynamic DefenseClaw target of a kill or service
    # manager, or an unopened inline script that names DefenseClaw with a
    # stopping word. HIGH: an alert in the default and permissive packs, a
    # block in strict.
    pattern: 'a^'
    title: "Change or stop DefenseClaw (unproven)"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering, tampering]
