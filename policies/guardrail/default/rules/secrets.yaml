version: 1
category: secret
rules:
  - id: SEC-AWS-KEY
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    title: "AWS access key"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-AWS-SECRET
    pattern: '(?i:(?:aws[ _-]?)?secret[ _-]?access[ _-]?key|aws[ _-]?secret[ _-]?key)\\?["'']?\s*[=:]\s*\\?["'']?[A-Za-z0-9/+=]{30,}|\b(?:AKIA|ASIA)[0-9A-Z]{16}\b[^\n]{0,100}?[^A-Za-z0-9/+=\n][A-Za-z0-9/+]{40}(?:[^A-Za-z0-9/+=]|$)'
    title: "AWS secret access key"
    severity: CRITICAL
    confidence: 0.90
    tags: [credential]
  - id: SEC-ANTHROPIC
    pattern: 'sk-ant-[a-zA-Z0-9\-_]{20,}'
    title: "Anthropic API key"
    severity: CRITICAL
    confidence: 0.98
    tags: [credential]
  - id: SEC-OPENAI
    pattern: 'sk-proj-[a-zA-Z0-9]{20,}'
    title: "OpenAI project key"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-OPENAI-V2
    pattern: 'sk-[a-zA-Z0-9]{40,}'
    title: "OpenAI API key (long form)"
    severity: CRITICAL
    confidence: 0.85
    tags: [credential]
  - id: SEC-STRIPE
    pattern: '(?:sk_live_|sk_test_|rk_live_|rk_test_)[a-zA-Z0-9]{20,}'
    title: "Stripe secret/restricted key"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-GITHUB-TOKEN
    pattern: '(?:ghp_|gho_|ghu_|ghs_|ghr_)[a-zA-Z0-9]{36,}'
    title: "GitHub token"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-GITHUB-PAT
    pattern: 'github_pat_[a-zA-Z0-9_]{22,}'
    title: "GitHub fine-grained PAT"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-GITLAB
    pattern: 'glpat-[a-zA-Z0-9\-_]{20,}'
    title: "GitLab personal access token"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-GOOGLE
    pattern: 'AIza[0-9A-Za-z\-_]{35}'
    title: "Google API key"
    severity: CRITICAL
    confidence: 0.90
    tags: [credential]
  - id: SEC-HF-TOKEN
    pattern: '\bhf_[A-Za-z0-9]{34,}\b'
    title: "Hugging Face access token"
    severity: CRITICAL
    confidence: 0.9
    tags: [credential]
  - id: SEC-SLACK-TOKEN
    pattern: 'xox[bpors]-[0-9a-zA-Z\-]{10,}'
    title: "Slack token"
    severity: CRITICAL
    confidence: 0.90
    tags: [credential]
  - id: SEC-SLACK-WEBHOOK
    pattern: 'https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[a-zA-Z0-9]+'
    title: "Slack webhook URL"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-DISCORD-WEBHOOK
    pattern: 'https://discord(?:app)?\.com/api/webhooks/\d+/[a-zA-Z0-9_\-]+'
    title: "Discord webhook URL"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-PRIVKEY
    pattern: '-----BEGIN (?:RSA |EC |OPENSSH |PGP |DSA )?PRIVATE KEY-----'
    title: "Private key"
    severity: CRITICAL
    confidence: 0.98
    tags: [credential]
  - id: SEC-JWT
    pattern: 'eyJ[A-Za-z0-9\-_]{10,}\.eyJ[A-Za-z0-9\-_]{10,}\.[A-Za-z0-9\-_.+/=]+'
    title: "JWT token"
    severity: MEDIUM
    confidence: 0.70
    tags: [credential]
  - id: SEC-CONNSTR
    pattern: '(?:mongodb|postgres|mysql|redis|amqp)://[^:\s]+:[^@\s]+@'
    title: "Connection string with credentials"
    severity: CRITICAL
    confidence: 0.90
    tags: [credential]
  - id: SEC-BEARER
    pattern: '(?i)(?:authorization|bearer)\s*[:=]\s*Bearer\s+[A-Za-z0-9\-_.~+/]{16,}=*'
    title: "Bearer token in header"
    severity: HIGH
    confidence: 0.80
    tags: [credential]
  - id: SEC-BEARER-BARE
    pattern: '(?i)\bbearer\s+[A-Za-z0-9\-_.~+/]{20,}=*'
    title: "Bearer credential"
    severity: MEDIUM
    confidence: 0.60
    tags: [credential]
  - id: SEC-PASSWORD-ASSIGN
    pattern: '(?i)\b[a-z0-9_]{0,48}?(?:password|passwd|pwd|passphrase)[0-9]{0,3}\\*["'']?[ \t]*(?:=>|:=|==|=|:)[ \t]*(?:\r?\n[ \t]*)?\\*["''`]?[^\s"''`\\,;][^\s"''`\\;]{6,126}[^\s"''`\\,;]'
    title: "Password assigned to a password-named key"
    severity: MEDIUM
    confidence: 0.60
    tags: [credential]
  - id: SEC-SENDGRID
    pattern: 'SG\.[a-zA-Z0-9\-_]{10,}\.[a-zA-Z0-9\-_]{10,}'
    title: "SendGrid API key"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-TWILIO
    pattern: 'SK[0-9a-fA-F]{32}'
    title: "Twilio API key"
    severity: HIGH
    confidence: 0.80
    tags: [credential]
  - id: SEC-NPM-TOKEN
    pattern: 'npm_[a-zA-Z0-9]{36,}'
    title: "npm access token"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-PYPI-TOKEN
    pattern: 'pypi-[A-Za-z0-9\-_]{50,}'
    title: "PyPI API token"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential]
  - id: SEC-HEX-SECRET
    pattern: '(?i)(?:secret(?:_key)?|api[_-]?key|[a-z0-9]{0,24}[_-]?token)\s*[=:]\s*["'']?[a-f0-9]{32,}\b'
    title: "Hex-encoded secret in assignment"
    severity: HIGH
    confidence: 0.72
    tags: [credential]
  - id: SEC-SECRET-ASSIGN
    pattern: '(?i)\b[a-z0-9_-]{0,48}?(?:password|passwd|pwd|passphrase|secret|token|api[_-]?key|private[_-]?key|encryption[_-]?key|signing[_-]?key|credential)s?[a-z0-9_-]{0,48}\\*["'']?\s*(?:[:=,(]|\s+is\s+|=>)\s*\\*["'']?[A-Za-z0-9_\-+/=.!@#$%^&*~()]{12,128}'
    title: "Credential-named assignment with a random-looking value"
    severity: MEDIUM
    confidence: 0.6
    tags: [credential]
    # The key vocabulary (GAP-0433): a key is cut into words (_ - case changes,
    # acronyms); one word, or two or three joined, must be in words, with no
    # prefix word before it (max_tokens) and no suffix word after it
    # (token_count). The pattern above only finds the assignment; a word added
    # here needs the pattern to find it too.
    keys:
      words: [password, passwd, pwd, passphrase, secret, token, apikey, privatekey, encryptionkey, signingkey,
        credential]
      prefixes: [max, min, num, total, prompt, completion, input, output, is, has, use, enable, disable, require,
        show, hide, get, set, confirm, reset, forgot, change, update, invalid, wrong, bad, missing, empty,
        "no", next, page]
      suffixes: [count, type, types, length, len, min, max, field, fields, name, names, header, headers, ttl, expiry,
        expires, expiration, policy, file, path, id, label, prefix, suffix, endpoint, url, uri, ref, regex,
        pattern, env, var, variable, param, params, arn, version, rotation, required, enabled, disabled,
        hint, help, placeholder, format, mask, masked, input, prompt, manager, store, provider, source,
        location, dir, directory, hash, hashed, salt, rules, strength, reset]
  - id: chain.sensitive_sql_value_then_cross_resource_literal_persistence
    tool_call_only: true
    expression: "f.tool in ['write_file', 'create_entities']"
    # Catalog anchor only. The code-owned bounded matcher requires two exact,
    # successful, cross-resource events joined by a process-keyed value HMAC.
    pattern: 'a^'
    title: "Sensitive SQL value persisted literally to a distinct MCP resource"
    severity: HIGH
    confidence: 0.98
    tags: [credential, database, persistence, bounded-lineage, detection-only]
