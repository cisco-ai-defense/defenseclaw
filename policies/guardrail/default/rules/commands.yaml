  - id: CMD-SYSTEMCTL
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      (defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_SCHEDULE in c.operations ||
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CONFIG_CHANGE in c.operations ||
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
