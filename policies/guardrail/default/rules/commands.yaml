    confidence: 0.85
    tags: [network, reverse-shell]
  - id: CMD-CURL-UPLOAD
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_UPLOAD in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ) &&
      f.network.exists(n, n.command_id == c.id &&
