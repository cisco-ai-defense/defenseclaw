version: 1
category: sensitive-path
rules:
  - id: PATH-SSH-DIR
    tool_call_only: true
    expression: 'true'
    # The semantic owner requires an active-home authorized_keys target and a
    # proven write, append, or delete. Path mentions and reads stay quiet.
    pattern: 'a^'
    title: "SSH authorized_keys mutation"
    severity: HIGH
    confidence: 0.95
    tags: [credential, file-sensitive]
  - id: PATH-SSH-KEY
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '(?im)(?:(?:^|[;&|]\s*)\s*(?:cat|base64|head|tail|less|more|sed|awk|grep|rg|strings|xxd|hexdump|read|open|show|paste|print|display)\b[^;\n]*(?:^|[\\/])id_(?:rsa|ed25519|ecdsa|dsa)(?:$|[^A-Za-z0-9_.-])|(?:^|[\\/])id_(?:rsa|ed25519|ecdsa|dsa)(?:$|[^A-Za-z0-9_.-])[^;\n]{0,120}\b(?:cat|base64|read|open|show|paste|print|display)\b)'
    title: "SSH private key file path"
    severity: CRITICAL
    confidence: 0.90
    tags: [credential, file-sensitive]
  - id: PATH-AWS-CREDS
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.aws/credentials'
    title: "AWS credentials file"
    severity: CRITICAL
    confidence: 0.98
    tags: [credential, file-sensitive]
  - id: PATH-AWS-CONFIG
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.aws/config'
    title: "AWS config file"
    severity: HIGH
    confidence: 0.85
    tags: [credential, file-sensitive]
  - id: PATH-KUBE
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.kube/config'
    title: "Kubernetes config"
    severity: HIGH
    confidence: 0.90
    tags: [credential, file-sensitive]
  - id: PATH-DOCKER
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.docker/config\.json'
    title: "Docker config"
    severity: HIGH
    confidence: 0.90
    tags: [credential, file-sensitive]
  - id: PATH-GNUPG
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.gnupg/'
    title: "GPG keyring access"
    severity: HIGH
    confidence: 0.95
    tags: [credential, file-sensitive]
  - id: PATH-NPMRC
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.npmrc'
    title: "npm config (may contain tokens)"
    severity: MEDIUM
    confidence: 0.80
    tags: [credential, file-sensitive]
  - id: PATH-PYPIRC
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.pypirc'
    title: "PyPI config (may contain tokens)"
    severity: MEDIUM
    confidence: 0.80
    tags: [credential, file-sensitive]
  - id: PATH-GIT-CREDS
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.git-credentials'
    title: "Git credentials file"
    severity: CRITICAL
    confidence: 0.95
    tags: [credential, file-sensitive]
  - id: PATH-NETRC
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.netrc'
    title: "netrc credentials file"
    severity: CRITICAL
    confidence: 0.90
    tags: [credential, file-sensitive]
  - id: PATH-ENV-FILE
    tool_call_only: true
    expression: 'true'
    # Semantic-only even in strict mode. A path-shaped fallback cannot
    # distinguish reading credentials from creating, emptying, or mentioning a
    # project-local .env file; real benign MCPHunt coding traces exercised all
    # three forms. The ActionFacts owner above retains proven reads and uploads.
    pattern: 'a^'
    title: "Environment file"
    severity: HIGH
    confidence: 0.85
    tags: [credential, file-sensitive]
  - id: PATH-ETC-PASSWD
    tool_call_only: true
    expression: >-
      f.paths.exists(p, p.normalized == '/etc/passwd' &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE])
    pattern: 'a^'
    title: "/etc/passwd mutation"
    severity: HIGH
    confidence: 0.90
    tags: [system-file]
  - id: PATH-ETC-SHADOW
    tool_call_only: true
    expression: >-
      f.paths.exists(p, p.normalized == '/etc/shadow' &&
      (p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE] ||
      (p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ &&
      f.commands.exists(c, c.id == p.command_id &&
      c.program in ['cat', 'base64', 'head', 'tail', 'less', 'more', 'strings',
      'xxd', 'hexdump', 'cp', 'read', 'readfile', 'read_file', 'read-file',
      'fsread', 'fs_read', 'fs-read', 'fs.read', 'fs.read_file', 'fileread',
      'file_read', 'file-read', 'catfile', 'cat_file', 'cat-file', 'openfile',
      'open_file', 'open-file', 'viewfile', 'view_file', 'view-file', 'getfile',
      'get_file', 'get-file']))))
    pattern: 'a^'
    title: "/etc/shadow credential read or mutation"
    severity: CRITICAL
    confidence: 0.95
    tags: [system-file, credential]
  - id: PATH-ETC-SUDOERS
    tool_call_only: true
    expression: 'true'
    # Exact active sudoers mutations are owned by ActionFacts. Generic reads,
    # policy prose, and unresolved path-shaped text do not fall back to regex.
    pattern: 'a^'
    title: "/etc/sudoers mutation"
    severity: HIGH
    confidence: 0.90
    tags: [system-file, privilege]
  - id: PATH-PROC-ENVIRON
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '/proc/(?:\d+|self)/environ'
    title: "/proc environ access"
    severity: CRITICAL
    confidence: 0.90
    tags: [credential]
  - id: secrets.cloud_credential_read
    tool_call_only: true
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '(?i)(?:~|\$HOME|\$\{HOME\}|/root|/(?:home|Users)/[^/\\"'']+|[a-z]:[/\\]Users[/\\][^/\\"'']+)[/\\](?:\.config[/\\](?:gcloud[/\\](?:application_default_credentials\.json|(?:access_tokens|credentials)\.db)|gh[/\\]hosts\.yml|anthropic[/\\]keys\.json)|AppData[/\\]Roaming[/\\](?:gcloud[/\\](?:application_default_credentials\.json|(?:access_tokens|credentials)\.db)|GitHub CLI[/\\]hosts\.yml)|\.azure[/\\](?:azureProfile\.json|TokenCache\.dat|msal_token_cache[^/\\]*\.(?:json|bin)))(?:$|["''\s])'
    title: "Cloud credential material read"
    severity: CRITICAL
    confidence: 0.92
    tags: [credential, cloud, file-sensitive]
  - id: secrets.cloud_metadata_credential_read
    tool_call_only: true
    expression: "f.tool == 'cloud_metadata'"
    pattern: 'a^'
    title: "Cloud instance-metadata credential token read"
    severity: HIGH
    confidence: 0.99
    tags: [credential, cloud, metadata, bounded-lineage]
  - id: secrets.structured_credential_extract
    tool_call_only: true
    expression: "f.tool == 'credential_extract'"
    pattern: 'a^'
    title: "Structured credential-store extraction"
    severity: HIGH
    confidence: 0.99
    tags: [credential, extraction, structured-tool, bounded-lineage]
  - id: secrets.browser_session_store_read
    tool_call_only: true
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '(?i)(?:~|\$HOME|\$\{HOME\}|/root|/(?:home|Users)/[^/\\"'']+|[a-z]:[/\\]Users[/\\][^/\\"'']+)[/\\](?:\.config[/\\](?:google-chrome|chromium|microsoft-edge)|\.mozilla[/\\]firefox|Library[/\\]Application Support[/\\](?:google[/\\]chrome|chromium|microsoft edge|firefox[/\\]profiles)|AppData[/\\]Local[/\\](?:google[/\\]chrome|chromium|microsoft[/\\]edge)[/\\]User Data|AppData[/\\]Roaming[/\\]mozilla[/\\]firefox[/\\]profiles)[/\\](?:[^/\\"'']+[/\\])*(?:Login Data|Cookies|logins\.json|cookies\.sqlite|key4\.db)(?:$|["''\s])'
    title: "Browser credential or session store read"
    severity: CRITICAL
    confidence: 0.90
    tags: [credential, browser, file-sensitive]
  - id: secrets.workload_identity_token_read
    tool_call_only: true
    expression: >-
      f.commands.exists(c, defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_READ in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_READ))
    pattern: '/var/run/secrets/(?:(?:kubernetes\.io|eks\.amazonaws\.com)/serviceaccount/token|azure/tokens/azure-identity-token)(?:$|["''\s])'
    title: "Workload identity token read"
    severity: CRITICAL
    confidence: 0.96
    tags: [credential, workload-identity, file-sensitive]
  - id: PATH-HISTORY
    expression: >-
      f.commands.exists(c,
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE]))
    pattern: '(?:~|\$\{?HOME\}?|/home/\w+|/root|/Users/\w+)/\.(?:bash_history|zsh_history|python_history)'
    title: "Shell history file"
    severity: MEDIUM
    confidence: 0.80
    tags: [credential, file-sensitive]
  - id: privilege.container_runtime_socket_access
    tool_call_only: true
    expression: >-
      f.commands.exists(c,
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_CONNECT in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_CONNECT))
    pattern: '(?i)(?:unix://)?/(?:var/)?run/(?:docker\.sock|containerd/containerd\.sock|crio/crio\.sock|podman/podman\.sock)\b'
    title: "Container runtime socket access"
    severity: HIGH
    confidence: 0.95
    tags: [privilege, container, socket]
  - id: persistence.shell_profile_write
    tool_call_only: true
    expression: >-
      f.commands.exists(c,
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE]))
    # Strict retains unresolved lexical visibility, but the leading boundary
    # prevents a home-shaped suffix inside a dotfile staging tree from matching.
    pattern: '(?i)(?:^|[^-:A-Za-z0-9_./~\\])(?:(?:~|\$HOME|\$\{HOME\}|/root|/(?:home|Users)/[^/\\"'']+|[a-z]:[/\\]Users[/\\][^/\\"'']+)[/\\](?:\.(?:profile|bash_profile|bashrc|zprofile|zshrc)|\.config[/\\](?:fish[/\\]config\.fish|powershell[/\\](?:profile|microsoft\.powershell_profile)\.ps1)|Documents[/\\](?:Windows)?PowerShell[/\\](?:profile|Microsoft\.PowerShell_profile)\.ps1)\b|/etc/profile(?:$|["''\s]))'
    title: "Shell startup profile mutation"
    severity: MEDIUM
    confidence: 0.92
    tags: [persistence, shell, file-sensitive]
  - id: persistence.git_hook_write
    tool_call_only: true
    expression: >-
      f.commands.exists(c,
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE]))
    # Candidate discovery also recognizes git read-command --output targets;
    # the exact fallback contract proves the active hook write.
    pattern: '(?i)(?:(?:^|[/\\])\.git[/\\]hooks[/\\]|--output(?:=|\s+)[^;\r\n]*\.git[/\\]hooks[/\\])(?:applypatch-msg|commit-msg|fsmonitor-watchman|post-checkout|post-commit|post-merge|post-receive|post-rewrite|pre-applypatch|pre-commit|pre-push|pre-rebase|pre-receive|prepare-commit-msg|push-to-checkout|update)(?:$|["''\s])'
    title: "Active Git hook mutation"
    severity: MEDIUM
    confidence: 0.92
    tags: [persistence, source-control, file-sensitive]
