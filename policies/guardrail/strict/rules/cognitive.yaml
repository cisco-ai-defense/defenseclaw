version: 1
category: cognitive-file
rules:
  - id: COG-SOUL
    pattern: '(?i)SOUL\.md'
    title: "SOUL.md access (agent identity)"
    severity: CRITICAL
    confidence: 0.95
    tags: [cognitive-tampering]
  - id: COG-IDENTITY
    pattern: '(?i)IDENTITY\.md'
    title: "IDENTITY.md access"
    severity: CRITICAL
    confidence: 0.95
    tags: [cognitive-tampering]
  - id: COG-MEMORY
    expression: >-
      f.commands.exists(c,
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE] &&
      (p.normalized == 'MEMORY.md' || p.normalized.endsWith('/MEMORY.md'))))
    pattern: '(?i)MEMORY\.md'
    title: "MEMORY.md mutation or reference"
    severity: HIGH
    confidence: 0.85
    tags: [cognitive-tampering]
  - id: COG-CLAUDE-MD
    pattern: '(?i)CLAUDE\.md'
    title: "CLAUDE.md access"
    severity: HIGH
    confidence: 0.85
    tags: [cognitive-tampering]
  - id: COG-TOOLS-MD
    pattern: '(?i)TOOLS\.md'
    title: "TOOLS.md access"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering]
  - id: COG-AGENTS-MD
    expression: >-
      f.commands.exists(c,
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE] &&
      (p.normalized == 'AGENTS.md' || p.normalized.endsWith('/AGENTS.md'))))
    pattern: '(?i)AGENTS\.md'
    title: "AGENTS.md mutation or reference"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering]
  - id: COG-OPENCLAW-JSON
    expression: >-
      f.commands.exists(c,
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE]))
    pattern: '(?i)openclaw\.json'
    title: "openclaw.json config access"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering]
  - id: COG-GATEWAY-JSON
    pattern: '(?i)gateway\.json'
    title: "gateway.json config access"
    severity: HIGH
    confidence: 0.80
    tags: [cognitive-tampering]
  - id: tamper.detector_state_write
    tool_call_only: true
    expression: >-
      f.commands.exists(c,
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_DELETE]))
    pattern: '(?i)(?:~|\$HOME|\$\{HOME\}|/root|/(?:home|Users)/[^/\\"'']+|[a-z]:[/\\]Users[/\\][^/\\"'']+)[/\\]\.defenseclaw[/\\](?:\.env|config\.yaml|confidence_policy\.yaml|guardrail_runtime\.json|device\.key|picked_connector|custom-providers\.json|(?:audit|judge|judge_bodies)\.db(?:-(?:wal|shm))?|(?:cache|policies|quarantine|receipts|registries)[/\\][^;\s]+)\b'
    title: "DefenseClaw security state mutation"
    severity: HIGH
    confidence: 0.98
    tags: [cognitive-tampering, tampering, security-state]
