version: 1
category: enterprise-data
rules:
  - id: ENT-BULK-SSN
    pattern: '\b(?:(?:00[1-9]|0[1-9][0-9]|[1-5][0-9]{2}|6[0-5][0-9]|66[0-5]|66[7-9]|6[7-9][0-9]|[78][0-9]{2})-(?:0[1-9]|[1-9][0-9])-(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})|(?:00[1-9]|0[1-9][0-9]|[1-5][0-9]{2}|6[0-5][0-9]|66[0-5]|66[7-9]|6[7-9][0-9]|[78][0-9]{2}) (?:0[1-9]|[1-9][0-9]) (?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3}))\b'
    title: "US Social Security Number"
    severity: CRITICAL
    confidence: 0.90
    tags: [pii, regulated, privacy-high-assurance]

  - id: ENT-CC-VISA
    pattern: '\b4\d{3}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'
    title: "Visa credit card number"
    severity: CRITICAL
    confidence: 0.85
    tags: [pii, pci, privacy-high-assurance]

  - id: ENT-CC-MC
    pattern: '\b5[1-5]\d{2}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'
    title: "Mastercard credit card number"
    severity: CRITICAL
    confidence: 0.85
    tags: [pii, pci, privacy-high-assurance]

  - id: ENT-CC-AMEX
    pattern: '\b3[47]\d{2}[\s-]?\d{6}[\s-]?\d{5}\b'
    title: "American Express card number"
    severity: CRITICAL
    confidence: 0.85
    tags: [pii, pci, privacy-high-assurance]

  - id: ENT-CC-DISCOVER
    pattern: '\b6(?:011|5\d{2})[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'
    title: "Discover card number"
    severity: CRITICAL
    confidence: 0.85
    tags: [pii, pci, privacy-high-assurance]

  - id: PII-CARD-LABELED
    pattern: '(?i)\b(?:credit[\s/-]*debit|credit|debit)[\s-]*card(?:[\s_-]*(?:number|no\.?))?(?:[\s*_:=-]{0,12}|\s+(?:on\s+file|with\s+the\s+number|used)\s+(?:is\s+|of\s+)?)(?:\d[\s-]?){12,18}\d\b'
    title: "Explicitly labeled payment card number"
    severity: CRITICAL
    confidence: 0.80
    tags: [pii, pci, structured, privacy-high-assurance]

  - id: ENT-IBAN
    pattern: '\b[A-Z]{2}\d{2}[\s]?[\dA-Z]{4}[\s]?(?:[\dA-Z]{4}[\s]?){1,7}[\dA-Z]{1,4}\b'
    title: "International Bank Account Number (IBAN)"
    severity: CRITICAL
    confidence: 0.80
    tags: [pii, financial, privacy-high-assurance]

  - id: ENT-EMAIL-BULK
    pattern: '(?i)\b(?:e-?mail)(?:[\s_-]+address)?[\s*_:#=-]{1,12}[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}\b'
    title: "Email address in a labeled field"
    severity: CRITICAL
    confidence: 0.80
    tags: [pii, structured, privacy-high-assurance]

  - id: ENT-US-PHONE
    pattern: '(?i)\b(?:phone|telephone|mobile|contact)(?:[\s_-]+(?:number|no\.?))?[\s*_:#=-]{1,12}(?:\+\d{1,3}(?:[\s.-]?\d){7,14}|(?:\+1[\s.-]?)?\d{3}[\s.-]\d{3}[\s.-]\d{4}|\(\d{3}\)[\s.-]?\d{3}[\s.-]\d{4})\b'
    title: "Formatted phone number in a labeled field"
    severity: CRITICAL
    confidence: 0.80
    tags: [pii, structured, privacy-high-assurance]

  - id: ENT-MEDICAL-RECORD
    pattern: '(?i)\b(?:mrn|medical[\s_-]*record(?:[\s_-]*number)?|patient[\s_-]*id)s?[\s*_:#=-]{0,12}(?:\d{6,12}|(?:mrn|med)[- ]?[a-z0-9]{5,12}|[a-z]\d{5,11})\b'
    title: "Medical record number"
    severity: CRITICAL
    confidence: 0.75
    tags: [pii, hipaa, privacy-high-assurance]

  - id: ENT-DOB-PATTERN
    pattern: '(?i)\b(?:dob|date[\s_-]*of[\s_-]*birth|birth[\s_-]*date|born(?:\s+on)?)[\s*_:#=-]{0,12}(?:\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}|\d{4}-\d{1,2}-\d{1,2})\b'
    title: "Date of birth with label"
    severity: CRITICAL
    confidence: 0.80
    tags: [pii, hipaa, privacy-high-assurance]

  - id: ENT-BULK-CSV-PII
    pattern: '(?im)(?:^|\n)[^\r\n]*(?:first[\s_]?name|last[\s_]?name|ssn|social[\s_]?security|credit[\s_]?card|card[\s_]?number|account[\s_]?number)[^\r\n]*[,\t][^\r\n]*(?:first[\s_]?name|last[\s_]?name|ssn|social[\s_]?security|credit[\s_]?card|card[\s_]?number|account[\s_]?number)[^\r\n]*\r?\n[^\r\n]*[0-9][^\r\n]*'
    title: "CSV/TSV records with multiple PII columns"
    severity: CRITICAL
    confidence: 0.85
    tags: [pii, bulk-data, privacy-high-assurance]

  - id: ENT-BULK-JSON-PII
    pattern: '(?i)\{[^{}]{0,512}"(?:ssn|social_security|credit_card|card_number|account_number|routing_number)"\s*:\s*(?:"(?:\d[\s-]?){6,19}"|\d{6,19}\b)\s*,[^{}]{0,512}"(?:ssn|social_security|credit_card|card_number|account_number|routing_number)"\s*:\s*(?:"(?:\d[\s-]?){6,19}"|\d{6,19}\b)[^{}]{0,512}\}'
    title: "JSON record with multiple PII values"
    severity: CRITICAL
    confidence: 0.80
    tags: [pii, bulk-data, privacy-high-assurance]
