version: 1
category: infrastructure-destruction-protection
rules:
  - id: impact.protected_filesystem_format
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['mkfs', 'mkfs.ext2', 'mkfs.ext3', 'mkfs.ext4', 'mke2fs', 'mkfs.xfs', 'mkfs.btrfs', 'mkfs.f2fs', 'mkfs.vfat', 'mkdosfs', 'mkfs.ntfs', 'mkntfs', 'mkfs.minix', 'mkswap', 'mkfs.exfat', 'mkexfatfs'] &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_DISK_WRITE in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND] &&
      p.flavor == defenseclaw.guardrail.semantic.v1.PathFlavor.PATH_FLAVOR_DEVICE))
    pattern: 'a^'
    tool_call_only: true
    title: "Protected device filesystem format"
    severity: CRITICAL
    confidence: 0.99
    tags: [destructive, storage, production-safety]
  - id: impact.protected_device_wipe
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_DISK_WRITE in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access in [defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_WRITE,
      defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_APPEND] &&
      p.flavor == defenseclaw.guardrail.semantic.v1.PathFlavor.PATH_FLAVOR_DEVICE))
    pattern: 'a^'
    tool_call_only: true
    title: "Protected device destructive write"
    severity: CRITICAL
    confidence: 0.99
    tags: [destructive, storage, production-safety]
  - id: impact.protected_access_control_change
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      defenseclaw.guardrail.semantic.v1.OperationKind.OPERATION_KIND_PERMISSION_CHANGE in c.operations &&
      f.paths.exists(p, p.command_id == c.id &&
      p.access == defenseclaw.guardrail.semantic.v1.PathAccess.PATH_ACCESS_METADATA))
    pattern: 'a^'
    tool_call_only: true
    title: "Protected security material access-control weakening"
    severity: CRITICAL
    confidence: 0.99
    tags: [privilege, destructive, production-safety]
  - id: impact.protected_kernel_control_bind_override
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.argv_complete && c.program == 'mount' &&
      '--bind' in c.argv)
    # The pack may enforce only after ActionFacts validates both literal
    # operands and the protected kernel-control target.
    pattern: 'a^'
    title: "Protected kernel control bind override"
    severity: CRITICAL
    confidence: 0.99
    tags: [destructive, integrity, kernel, procfs, production-safety, bounded-grammar]
  - id: impact.iac_full_destroy
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['terraform', 'tofu', 'pulumi'] &&
      (('destroy' in c.argv) || ('-destroy' in c.argv)))
    pattern: 'a^'
    tool_call_only: true
    title: "Full infrastructure-as-code destruction"
    severity: CRITICAL
    confidence: 0.99
    tags: [destructive, infrastructure-as-code, production-safety]
