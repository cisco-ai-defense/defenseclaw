version: 1
category: kubernetes-production-protection
rules:
  - id: credential.protected_kubernetes_named_secret_content_read
    expression: 'false'
    # Code-owned ActionFacts prove a direct, exact named Secret content read;
    # assigning this pack is the operator's protected-cluster authorization.
    pattern: 'a^'
    tool_call_only: true
    title: "Read a named Secret in a protected Kubernetes cluster"
    severity: CRITICAL
    confidence: 0.99
    tags: [credential, kubernetes, secret, protected-cluster, exact-actionfacts]

  - id: impact.kubernetes_namespace_delete
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['kubectl', 'oc'] && 'delete' in c.argv &&
      (('namespace' in c.argv) || ('namespaces' in c.argv) ||
      ('ns' in c.argv)))
    pattern: 'a^'
    tool_call_only: true
    title: "Deletion of a Kubernetes namespace"
    severity: CRITICAL
    confidence: 0.99
    tags: [destructive, kubernetes, production-safety]

  - id: impact.kubernetes_bulk_delete
    expression: >-
      f.commands.exists(c, c.argv_complete &&
      c.program in ['kubectl', 'oc'] && 'delete' in c.argv &&
      '--all' in c.argv)
    pattern: 'a^'
    tool_call_only: true
    title: "Bulk deletion of Kubernetes workloads"
    severity: CRITICAL
    confidence: 0.99
    tags: [destructive, kubernetes, production-safety]
