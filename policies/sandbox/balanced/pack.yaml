# DefenseClaw sandbox policy pack: balanced
#
# Default-deny web: the DefenseClaw egress proxy only reaches the curated
# developer allowlist below (package registries, source hosts, toolchains,
# common docs) plus openshell.egress.allow. Anything else is triaged:
# known-good destinations are approved automatically and the rest ask. The
# project folder is still mounted live and the harness runs in
# skip-permissions mode.
#
# The proxy sees HTTPS traffic only as encrypted CONNECT tunnels, so it
# cannot tell a download from an upload: every host listed here can receive
# data as well as serve it (see the source hosts below).
version: 1
name: balanced
description: Default-deny web limited to a curated developer allowlist; triaged approvals; live project mount.

network:
  mode: allowlist

approvals:
  mode: triage

# The process tree samples the sandbox's processes every 5 s (`sandbox ps`);
# `sandbox run --process-tree` turns it on for one run.
observe:
  process_tree: false

egress:
  feeds: [builtin]
  block: []
  allow:
    # This list is the egress proxy's allowlist feed
    # (policies/sandbox/egress/allowlist.yaml), host for host; a test keeps
    # the two identical, so change both together.
    # Package registries
    - registry.npmjs.org
    - registry.yarnpkg.com
    - repo.yarnpkg.com
    - pypi.org
    - files.pythonhosted.org
    - proxy.golang.org
    - sum.golang.org
    - index.golang.org
    - crates.io
    - index.crates.io
    - static.crates.io
    - rubygems.org
    - index.rubygems.org
    - repo.maven.apache.org
    - repo1.maven.org
    - plugins.gradle.org
    - services.gradle.org
    - downloads.gradle.org
    - api.nuget.org
    - packagist.org
    - repo.packagist.org
    - hex.pm
    - repo.hex.pm
    - builds.hex.pm
    - pub.dev
    - conda.anaconda.org
    # Source hosts. Listed for clones and downloads, but CONNECT tunnels are
    # opaque, so pushes and uploads to them pass the proxy too. A push still
    # needs a credential for the host inside the sandbox (for GitHub,
    # --github-write).
    - github.com
    - api.github.com
    - codeload.github.com
    - "*.githubusercontent.com"
    - ghcr.io
    - gitlab.com
    - bitbucket.org
    # Toolchains
    - nodejs.org
    - static.rust-lang.org
    - sh.rustup.rs
    - www.python.org
    - astral.sh
    - releases.astral.sh
    # Documentation
    - docs.python.org
    - developer.mozilla.org
    - go.dev
    - pkg.go.dev
    - docs.rs
    - doc.rust-lang.org
    - docs.github.com
    - docs.npmjs.com
    - www.typescriptlang.org
    - learn.microsoft.com
    - stackoverflow.com
  ports: [80, 443]
  large_upload_mb: 10

workspace:
  mode: mount
  # Secret files appear empty inside the sandbox (--unmask PATH shares one).
  masks:
    - .env
    - .env.*
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"
    - "*.jks"
    - "*.keystore"
    - id_rsa*
    - id_dsa*
    - id_ecdsa*
    - id_ed25519*
    - .netrc
    - .npmrc
    - .pypirc
    - .git-credentials
    - .pgpass
    - .vault-token
    - .aws/credentials
    - .kube/config
    - .docker/config.json
    - credentials.json
    - service-account*.json
    - "*.tfvars"
  # Committed templates of masked files stay visible.
  unmask:
    - .env.example
    - .env.sample
    - .env.template
    - .env.dist
  # Changed files that can run code on your machine; the end-of-session
  # review lists them before you run anything.
  review:
    - package.json
    - Makefile
    - GNUmakefile
    - makefile
    - Justfile
    - Taskfile.yml
    - .envrc
    - .vscode/**
    - .idea/**
    - .devcontainer/**
    - .github/workflows/**
    - .gitlab-ci.yml
    - .gitattributes
    - .gitmodules
    - .husky/**
    - .pre-commit-config.yaml
    - setup.py
    - pyproject.toml
    - docker-compose*.yml
    - compose*.yaml
  max_upload_mb: 500

harness:
  yolo: true
  allowed: []

mcp:
  import: true
  host_ports: true
  blocked_tools: []
  # MCP servers a repository defines (.mcp.json, .codex/config.toml) start
  # without a tool call, unseen by DefenseClaw hooks: keep them stopped.
  project_servers: block

hooks:
  fail_mode: closed
  on_tamper: stop
  # A user-tier harness (its hook registration is the agent's to edit) that
  # works for silence_after without one hook reaching DefenseClaw: stop the
  # sandbox.
  on_silence: stop
  silence_after: 10m
