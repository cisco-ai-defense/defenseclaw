name: Set up Go with the shared cache
description: >-
  actions/setup-go without its own cache, then a restore-only Go module and
  build cache shared by every job of one OS and architecture. Only main
  writes that cache (./.github/actions/go-cache-save in one job per OS), so
  pull requests and other branches restore main's entry and never add their
  own 1 GB copy.
inputs:
  cache-name:
    description: >-
      A job whose build shares little with the test jobs (a release
      cross-compile) keeps its own entry under this name, saved by that job.
      The test jobs share "shared".
    default: shared
  cache-files:
    description: Files besides go.sum whose content is part of the key.
    default: ""
  go-version-file:
    description: The go.mod that names the Go version.
    default: go.mod
outputs:
  cache-hit:
    description: "'true' when the exact key (this go.sum) was restored."
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false
    - id: paths
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.cache-name }}
        CACHE_FILES: ${{ inputs.cache-files }}
      run: |
        # One key per OS, architecture, Go release and go.sum: never per job,
        # shard, run or commit.
        prefix="go-$RUNNER_OS-$RUNNER_ARCH-$(go env GOVERSION)-$CACHE_NAME-"
        # shellcheck disable=SC2086 # cache-files is a space-separated list
        hash=$(cat go.sum $CACHE_FILES | sha256sum | cut -c1-64)
        {
          echo "prefix=$prefix"
          echo "key=$prefix$hash"
          echo "modcache=$(go env GOMODCACHE)"
          echo "buildcache=$(go env GOCACHE)"
        } >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ${{ steps.paths.outputs.modcache }}
          ${{ steps.paths.outputs.buildcache }}
        key: ${{ steps.paths.outputs.key }}
        restore-keys: ${{ steps.paths.outputs.prefix }}
