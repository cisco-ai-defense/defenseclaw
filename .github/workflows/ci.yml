name: CI

on:
  push:
    branches: [main]
  # Run CI on every pull request regardless of base branch so PRs that
  # target an integration branch (not just main) are gated too — otherwise
  # their checks (incl. the Windows hook path) never execute until the
  # change reaches a main-targeting PR.
  pull_request:
  # Runs every suite on one commit. A busy PR branch supersedes its
  # pull_request run on each push, so its longest jobs never finish there.
  workflow_dispatch:

# Top-level permissions are intentionally read-only. Per-job
# permissions overrides (none required at the moment) must remain
# minimum-privilege; opening up `contents: write`, `id-token: write`,
# or `packages: write` here would let a future build step that
# accidentally executed PR-supplied code escalate into the repo.
permissions:
  contents: read

concurrency:
  # Supersede old commits within one PR, but never cancel a previous main
  # merge's exact-SHA release canary when another merge lands. A dispatched
  # run is keyed by its commit, so later pushes to the branch do not cancel it.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    # Pick the suites a pull request needs from the files it changes
    # (scripts/ci_changes.py, contract: cli/tests/test_ci_changes.py). Every
    # other event runs everything. Required checks still report: a gated job
    # is skipped, which passes; Go Build gates its steps so each matrix name
    # reports; and the Go Test, Python Lint & Test and Enterprise Required
    # aggregates accept a skipped partition only when this job selected it
    # away. Gated jobs use `!= 'false'`, so a failed classifier runs everything.
    name: Select CI suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      go_pinned: ${{ steps.classify.outputs.go_pinned }}
      go_tests: ${{ steps.classify.outputs.go_tests }}
      python: ${{ steps.classify.outputs.python }}
      python_tests: ${{ steps.classify.outputs.python_tests }}
      py_select: ${{ steps.classify.outputs.py_select }}
      python_lint: ${{ steps.classify.outputs.python_lint }}
      wheel: ${{ steps.classify.outputs.wheel }}
      ts: ${{ steps.classify.outputs.ts }}
      rego: ${{ steps.classify.outputs.rego }}
      checks: ${{ steps.classify.outputs.checks }}
      core: ${{ steps.classify.outputs.core }}
      install: ${{ steps.classify.outputs.install }}
      enterprise: ${{ steps.classify.outputs.enterprise }}
      workflows: ${{ steps.classify.outputs.workflows }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # The pull_request merge commit and its base parent.
          fetch-depth: 2
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_changes.py --event "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # Syntax, expressions, job graph and runner labels (.github/actionlint.yaml).
      # Embedded scripts are not linted here.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # CI action / tool version pinning: drop the GitHub
          # credential after fetch so downstream `make` steps cannot
          # push or fetch on our behalf if a transient compromise
          # injects shell.
          persist-credentials: false
      # Keep local-development package metadata internally consistent. The
      # release workflow dynamically stamps its dispatch version, so this
      # check does not pin or preselect the next release number.
      - run: make check-version-sync

  go-lint:
    name: Go Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            extensions/defenseclaw/package-lock.json
            scripts/amp-plugin-typecheck/package-lock.json
      - run: make plugin
      - name: Type-check Amp policy plugin against official API
        run: make amp-plugin-typecheck
      - run: make go-lint

  go-test-gateway:
    name: Go Gateway Test (shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - run: make plugin
      - name: Run gateway race/coverage shard
        env:
          GO_TEST_SHARD: ${{ matrix.shard }}
          GO_TEST_SHARDS: 8
        run: |
          set -euo pipefail
          test_regex="$(python3 scripts/go_test_shards.py \
            --package-dir internal/gateway \
            --shard-count "$GO_TEST_SHARDS" \
            --shard-index "$GO_TEST_SHARD")"
          # -race also turns on checkptr in every package. In the transpiled
          # SQLite (modernc.org) that every audit store runs, checkptr alone
          # doubles the cost of a race shard; race detection stays on everywhere.
          go test -race -gcflags=modernc.org/...=-d=checkptr=0 -count=1 -timeout 45m \
            -coverprofile="coverage-go-gateway-$GO_TEST_SHARD.out" \
            -run "$test_regex" \
            ./internal/gateway
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: go-coverage-gateway-${{ matrix.shard }}
          path: coverage-go-gateway-${{ matrix.shard }}.out
          retention-days: 1

  go-test-audit:
    name: Go Audit Test (shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - run: make plugin
      - name: Run audit race/coverage shard
        env:
          GO_TEST_SHARD: ${{ matrix.shard }}
          GO_TEST_SHARDS: 8
        run: |
          set -euo pipefail
          test_regex="$(python3 scripts/go_test_shards.py \
            --package-dir internal/audit \
            --shard-count "$GO_TEST_SHARDS" \
            --shard-index "$GO_TEST_SHARD")"
          # checkptr is off only in modernc.org: see Go Gateway Test.
          go test -race -gcflags=modernc.org/...=-d=checkptr=0 -count=1 -timeout 45m \
            -coverprofile="coverage-go-audit-$GO_TEST_SHARD.out" \
            -run "$test_regex" \
            ./internal/audit
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: go-coverage-audit-${{ matrix.shard }}
          path: coverage-go-audit-${{ matrix.shard }}.out
          retention-days: 1

  go-test-other:
    name: Go Test (remaining packages / shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - run: make plugin
      - name: Run remaining Go race/coverage shard
        env:
          GO_PACKAGE_SHARD: ${{ matrix.shard }}
          GO_PACKAGE_SHARDS: 8
        run: |
          set -euo pipefail
          mapfile -t all_packages < <(
            go list ./... |
              grep -Ev '^github.com/defenseclaw/defenseclaw/internal/(audit|gateway)$' |
              sort
          )
          test "${#all_packages[@]}" -gt 0
          packages=()
          for index in "${!all_packages[@]}"; do
            if (( index % GO_PACKAGE_SHARDS == GO_PACKAGE_SHARD )); then
              packages+=("${all_packages[index]}")
            fi
          done
          test "${#packages[@]}" -gt 0
          # checkptr is off only in modernc.org: see Go Gateway Test.
          go test -race -gcflags=modernc.org/...=-d=checkptr=0 -count=1 -timeout 45m \
            -coverprofile="coverage-go-other-$GO_PACKAGE_SHARD.out" \
            "${packages[@]}"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: go-coverage-other-${{ matrix.shard }}
          path: coverage-go-other-${{ matrix.shard }}.out
          retention-days: 1

  go-pinned:
    # A pull request with no Go change still runs the Go tests that name a
    # file it changes, such as a docs page a test reads.
    name: Go Pinned Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go_pinned == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - run: make plugin
      - name: Run the Go tests that name a changed file
        env:
          GO_TESTS: ${{ needs.changes.outputs.go_tests }}
        run: |
          set -euo pipefail
          status=0
          while IFS=$'\t' read -r package pattern; do
            echo "::group::go test -run '$pattern' $package"
            go test -count=1 -timeout 25m -run "$pattern" "$package" || status=1
            echo "::endgroup::"
          done < <(python3 -c 'import json, os; [print(t["package"] + "\t" + t["run"]) for t in json.loads(os.environ["GO_TESTS"])]')
          exit "$status"

  go-test:
    # Preserve the existing required-check name while combining the complete
    # race/coverage suite from the gateway and audit shards plus all remaining
    # packages. A pull request without Go changes skips the shards and runs
    # only Go Pinned Tests, if any.
    name: Go Test
    needs: [changes, go-test-gateway, go-test-audit, go-test-other, go-pinned]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go test partition
        env:
          GO_SUITE: ${{ needs.changes.outputs.go }}
          GATEWAY_RESULT: ${{ needs.go-test-gateway.result }}
          AUDIT_RESULT: ${{ needs.go-test-audit.result }}
          OTHER_RESULT: ${{ needs.go-test-other.result }}
          PINNED_RESULT: ${{ needs.go-pinned.result }}
        run: |
          set -euo pipefail
          if [ "$GO_SUITE" = false ]; then
            echo "No Go change in this pull request: the Go suite was skipped."
            case "$PINNED_RESULT" in success|skipped) ;; *) echo "Go Pinned Tests: $PINNED_RESULT"; exit 1 ;; esac
            exit 0
          fi
          test "$GATEWAY_RESULT" = success
          test "$AUDIT_RESULT" = success
          test "$OTHER_RESULT" = success
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.changes.outputs.go != 'false' }}
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: ${{ needs.changes.outputs.go != 'false' }}
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.changes.outputs.go != 'false' }}
        with:
          pattern: go-coverage-*
          path: coverage-parts
          merge-multiple: true
      - name: Combine Go coverage
        if: ${{ needs.changes.outputs.go != 'false' }}
        run: |
          set -euo pipefail
          mapfile -t coverage_parts < <(
            find coverage-parts -type f -name 'coverage-go-*.out' -print | sort
          )
          test "${#coverage_parts[@]}" -eq 24
          python3 scripts/merge_go_coverage.py \
            --output coverage.out \
            "${coverage_parts[@]}"
          go tool cover -func=coverage.out >/dev/null
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ needs.changes.outputs.go != 'false' }}
        with:
          name: go-coverage
          path: coverage.out

  go-build:
    # The three matrix names are required checks, so the job always starts
    # and gates its steps instead: a skipped matrix job would never report
    # the expanded names.
    name: Go Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - if: ${{ needs.changes.outputs.go == 'false' }}
        run: echo "No Go change in this pull request; the cross build is skipped."
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.changes.outputs.go != 'false' }}
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: ${{ needs.changes.outputs.go != 'false' }}
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: ${{ needs.changes.outputs.go != 'false' }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - if: ${{ needs.changes.outputs.go != 'false' }}
        run: make plugin
      - if: ${{ needs.changes.outputs.go != 'false' }}
        run: make gateway-cross GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ needs.changes.outputs.go != 'false' }}
        with:
          name: defenseclaw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: defenseclaw-${{ matrix.goos }}-${{ matrix.goarch }}

  python-test:
    name: Python Test (shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python_tests != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync
      - run: make _bundle-data
      - name: Run Python coverage shard
        env:
          PYTHON_TEST_SHARD: ${{ matrix.shard }}
          PYTHON_TEST_SHARDS: 4
          # Empty for the full suite. Otherwise the only modules to run: the
          # TUI tests and the tests that name a changed file.
          PY_SELECT: ${{ needs.changes.outputs.py_select }}
        run: |
          set -euo pipefail
          mapfile -t test_files < <(
            python3 scripts/python_test_shards.py \
              --shard-count "$PYTHON_TEST_SHARDS" \
              --shard-index "$PYTHON_TEST_SHARD" \
              --exclude cli/tests/test_telemetry_registry_generator.py \
              --exclude cli/tests/test_telemetry_registry_candidate_renderer.py
          )
          test "${#test_files[@]}" -gt 0
          if [ -n "$PY_SELECT" ]; then
            mapfile -t test_files < <(
              printf '%s\n' "${test_files[@]}" | grep -Fx -f <(tr ' ' '\n' <<<"$PY_SELECT") || true
            )
            echo "Selected ${#test_files[@]} test modules in this shard."
            [ "${#test_files[@]}" -gt 0 ] || exit 0
          fi
          COVERAGE_FILE="coverage-py-shard-$PYTHON_TEST_SHARD" \
            .venv/bin/python -m pytest "${test_files[@]}" \
              -q --tb=short \
              --durations=25 \
              --cov=defenseclaw \
              --cov-report=
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: python-coverage-part-regular-${{ matrix.shard }}
          path: coverage-py-shard-${{ matrix.shard }}
          retention-days: 1

  python-lint:
    name: Python Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python_lint != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync
      - run: make py-lint

  python-lint-test:
    # Preserve the existing required-check name while making it the single
    # authority over lint, every isolated test partition, and combined
    # coverage.
    # A pull request without Python changes runs only the selected modules
    # (or nothing), and skips lint, the judge corpus and the coverage merge.
    name: Python Lint & Test
    needs: [changes, python-test, python-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and every Python test partition
        env:
          PYTHON_SUITE: ${{ needs.changes.outputs.python }}
          PYTHON_REGULAR_RESULT: ${{ needs.python-test.result }}
          PYTHON_LINT_RESULT: ${{ needs.python-lint.result }}
        run: |
          set -euo pipefail
          if [ "$PYTHON_SUITE" = false ]; then
            echo "No Python change in this pull request: only selected modules ran."
            for result in "$PYTHON_REGULAR_RESULT" "$PYTHON_LINT_RESULT"; do
              case "$result" in success|skipped) ;; *) echo "partition result: $result"; exit 1 ;; esac
            done
            exit 0
          fi
          test "$PYTHON_REGULAR_RESULT" = success
          test "$PYTHON_LINT_RESULT" = success
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.changes.outputs.python != 'false' }}
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: ${{ needs.changes.outputs.python != 'false' }}
      - if: ${{ needs.changes.outputs.python != 'false' }}
        run: uv sync
      - if: ${{ needs.changes.outputs.python != 'false' }}
        run: make contextual-judge-test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.changes.outputs.python != 'false' }}
        with:
          pattern: python-coverage-part-*
          path: coverage-parts
          merge-multiple: true
      - name: Combine Python coverage
        if: ${{ needs.changes.outputs.python != 'false' }}
        run: |
          set -euo pipefail
          mapfile -t coverage_parts < <(
            find coverage-parts -type f -name 'coverage-py-*' -print | sort
          )
          test "${#coverage_parts[@]}" -eq 4
          .venv/bin/coverage combine "${coverage_parts[@]}"
          .venv/bin/coverage xml -o coverage-py.xml
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ needs.changes.outputs.python != 'false' }}
        with:
          name: python-coverage
          path: coverage-py.xml

  make-test:
    # Preserve the legacy required-check context without rerunning the corpus.
    # The Go and Python aggregate jobs already require every underlying shard.
    name: make test (unified)
    needs: [go-test, python-lint-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require unified Go and Python test gates
        env:
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          PYTHON_TEST_RESULT: ${{ needs.python-lint-test.result }}
        run: |
          set -euo pipefail
          test "$GO_TEST_RESULT" = success
          test "$PYTHON_TEST_RESULT" = success

  python-wheel-install:
    name: Python Wheel Security Contract (${{ matrix.python-version }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.wheel != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: make dist-cli
      - shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          whl="$(find dist -maxdepth 1 -name 'defenseclaw-*.whl' -print -quit)"
          test -n "$whl"
          python3 - "$whl" "$tmp/telemetry-resource-digests.json" <<'PY'
          import email
          import gzip
          import hashlib
          import json
          import re
          import sys
          import zipfile
          from pathlib import Path

          wheel = Path(sys.argv[1])
          digest_path = Path(sys.argv[2])
          sources = {
              "defenseclaw/_data/telemetry/v8/telemetry.schema.json": Path(
                  "schemas/telemetry/runtime/telemetry.schema.json.gz"
              ),
              "defenseclaw/_data/telemetry/v8/catalog.json": Path(
                  "schemas/telemetry/runtime/catalog.json.gz"
              ),
              "defenseclaw/_data/telemetry/v8/v7-exporter-selection.json": Path(
                  "schemas/telemetry/runtime/compatibility/v7-exporter-selection.json.gz"
              ),
              "defenseclaw/_data/telemetry/v8/galileo-rich-v2.json": Path(
                  "schemas/telemetry/runtime/compatibility/galileo-rich-v2.json.gz"
              ),
              "defenseclaw/_data/telemetry/v8/local-observability-v1.json": Path(
                  "schemas/telemetry/runtime/compatibility/local-observability-v1.json.gz"
              ),
              "defenseclaw/_data/telemetry/v8/openinference-v1.json": Path(
                  "schemas/telemetry/runtime/compatibility/openinference-v1.json.gz"
              ),
          }
          security_floors = {
              "cryptography": ">=50.0.0,<51",
              "python-dotenv": ">=1.2.2",
              "python-multipart": ">=0.0.31",
              "urllib3": ">=2.8.0",
              "idna": ">=3.15",
              "pydantic-settings": ">=2.14.2",
              "aiohttp": ">=3.14.3,<4",
              "multidict": ">=6.9.1,<7",
              "pyjwt": ">=2.15.0",
              "starlette": ">=1.3.1,<1.4",
              "fastapi": ">=0.137.1,<0.138",
              # Keep the portable LiteLLM line in wheel metadata. A tool.uv
              # override is not shipped and cannot protect installers.
              "litellm": ">=1.91.5,<1.92.0",
          }
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))
              packaged = {
                  name for name in archive.namelist()
                  if name.startswith("defenseclaw/_data/telemetry/v8/") and not name.endswith("/")
              }
              if packaged != set(sources):
                  raise SystemExit(f"unexpected telemetry wheel resources: {sorted(packaged)}")
              digests = {}
              for member, source_path in sources.items():
                  source = gzip.decompress(source_path.read_bytes())
                  bundled = archive.read(member)
                  if bundled != source:
                      raise SystemExit(f"wheel resource drift: {member}")
                  json.loads(bundled)
                  digests[Path(member).name] = hashlib.sha256(source).hexdigest()
          requirements = {}
          for value in metadata.get_all("Requires-Dist", []):
              match = re.match(r"^([A-Za-z0-9][A-Za-z0-9._-]*)", value)
              if match is None:
                  raise SystemExit(f"invalid Requires-Dist value: {value}")
              name = re.sub(r"[-_.]+", "-", match.group(1)).lower()
              requirements[name] = value[match.end():]
          for name, expected in security_floors.items():
              value = requirements.get(name)
              if value is None:
                  raise SystemExit(f"wheel metadata omits security floor: {name}")
              specifier, separator, marker = value.partition(";")
              if separator:
                  raise SystemExit(f"wheel security floor is marked: {name}; {marker.strip()}")
              actual_clauses = {
                  clause.strip()
                  for clause in specifier.strip().strip("()").split(",")
                  if clause.strip()
              }
              expected_clauses = {clause.strip() for clause in expected.split(",")}
              if actual_clauses != expected_clauses:
                  raise SystemExit(
                      f"wheel security floor drift for {name}: "
                      f"expected {expected}, found {specifier.strip()}"
                  )
          scanner = requirements.get("cisco-ai-mcp-scanner")
          if scanner is None:
              raise SystemExit("wheel metadata omits cisco-ai-mcp-scanner")
          scanner_requirement = scanner.partition(";")[0].strip()
          if re.fullmatch(
              r"@\s+https://files[.]pythonhosted[.]org/[A-Za-z0-9_./-]+[.]whl"
              r"#sha256=[0-9a-f]{64}",
              scanner_requirement,
          ) is None:
              raise SystemExit(
                  "wheel metadata leaves cisco-ai-mcp-scanner floating instead of binding a hashed wheel"
              )
          digest_path.write_text(json.dumps(digests), encoding="utf-8")
          PY
          uv --no-config venv "$tmp/venv" --python "${{ matrix.python-version }}"
          # Use pip's foreign-interpreter mode so this is an ordinary pip
          # resolution without adding packaging tools to the runtime graph.
          uvx --from pip pip --isolated --python "$tmp/venv/bin/python" \
            install --disable-pip-version-check "$whl"
          uvx --from pip pip --isolated --python "$tmp/venv/bin/python" check
          "$tmp/venv/bin/defenseclaw" --help >/dev/null
          HOME="$tmp/home" DEFENSECLAW_HOME="$tmp/home/.defenseclaw" \
            PYTHONNOUSERSITE=1 PYTHONPATH='' "$tmp/venv/bin/python" - <<'PY'
          import asyncio
          import sys
          from pathlib import Path

          import textual
          import defenseclaw.tui.app as tui_app

          module_path = Path(tui_app.__file__).resolve()
          if not module_path.is_relative_to(Path(sys.prefix).resolve()):
              raise SystemExit(f"TUI imported outside wheel environment: {module_path}")
          DefenseClawTUI = tui_app.DefenseClawTUI

          async def main() -> None:
              app = DefenseClawTUI()
              async with app.run_test(size=(120, 40)) as pilot:
                  await pilot.pause()

          asyncio.run(main())
          print("installed_wheel_tui_origin=venv")
          print("installed_wheel_tui_mount=ok textual=" + getattr(textual, "__version__", "unknown"))
          PY
          (
            cd "$tmp"
            PYTHONNOUSERSITE=1 PYTHONPATH='' "$tmp/venv/bin/python" - "$tmp/telemetry-resource-digests.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          import defenseclaw.observability.schema_resources as resource_module

          expected = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          module_path = Path(resource_module.__file__).resolve()
          if not module_path.is_relative_to(Path(sys.prefix).resolve()):
              raise SystemExit(f"telemetry resource API was not imported from the installed wheel: {module_path}")
          resources = {
              "telemetry.schema.json": resource_module.telemetry_v8_schema_bytes(),
              "catalog.json": resource_module.telemetry_v8_catalog_bytes(),
          }
          for name, payload in resources.items():
              if hashlib.sha256(payload).hexdigest() != expected[name]:
                  raise SystemExit(f"installed telemetry resource drift: {name}")
              json.loads(payload)
          PY
          )
          "$tmp/venv/bin/python" -c 'from defenseclaw.envvars import load_registry; assert load_registry().entries'
          uvx --from pip-audit pip-audit \
            --vulnerability-service osv \
            --path "$tmp/venv/lib/python${{ matrix.python-version }}/site-packages"

  install-smoke:
    # Builds release-shaped assets from this commit and runs the real
    # installer through a fresh install, a 0.8.10 upgrade with rollback, the
    # 0.8.x handoff, and the failure drills, each in a throwaway HOME.
    name: Install and Upgrade Smoke
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.install != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # "|" falls back to direct on any proxy error; the default "," only
      # falls back on 404/410, so a proxy.golang.org stream reset
      # (INTERNAL_ERROR) failed the release build.
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # Every job shares the go.sum-only key, and the first job to save it
          # stored a ~9 MB module cache, so this build downloaded most modules
          # on every run. Adding this job's build script to the key gives it a
          # cache with the full release module set.
          cache-dependency-path: |
            go.sum
            scripts/build-release-assets.sh
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "::warning::go mod download failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: scripts/build-release-assets.sh 9.9.9 "$RUNNER_TEMP/assets" linux/amd64 windows/amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-smoke-assets
          path: ${{ runner.temp }}/assets/
          retention-days: 3
      - run: scripts/test-install-lifecycle.sh --assets "$RUNNER_TEMP/assets" --lanes "fresh upgrade-0.8.10 handoff drills"

  install-smoke-windows:
    name: Install and Upgrade Smoke (Windows)
    needs: install-smoke
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-smoke-assets
          path: assets
      - shell: pwsh
        run: |
          & scripts/test-install-lifecycle.ps1 -Assets assets -Lanes 'fresh setup-import files-in-use failure-drill policy'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  connector-matrix:
    name: Connector Matrix
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: make plugin
      - run: make dev-pycli
      - run: make connector-matrix-test

  # The Secure Client profile hook hardening flow (a synthetic target home and
  # a TCP fake gateway) runs only on macOS. Linux has only the standalone
  # profile (real account homes and the peer-authorized hook socket), which the
  # Unix Standalone Lifecycle job and the deb and rpm install lanes cover.
  # macOS runners bill at ~10x Linux, so the macOS hook hardening cells and the
  # enterprise packaging smoke share one runner and one gateway build instead
  # of four separate jobs.
  macos-enterprise-packaging:
    name: macOS Enterprise Hook Hardening + Packaging
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.enterprise != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build enterprise gateway and ACP CLIs
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/defenseclaw-gateway" ./cmd/defenseclaw
          go build -o "$RUNNER_TEMP/defenseclaw-acp" ./cmd/defenseclaw-acp
      - name: Test root boundary and connector repair (codex)
        if: ${{ !cancelled() }}
        shell: bash
        run: ./scripts/test-enterprise-hook-hardening.sh "$RUNNER_TEMP/defenseclaw-gateway" codex
      - name: Test root boundary and connector repair (claudecode)
        if: ${{ !cancelled() }}
        shell: bash
        run: ./scripts/test-enterprise-hook-hardening.sh "$RUNNER_TEMP/defenseclaw-gateway" claudecode
      - name: Test root boundary and connector repair (amp)
        if: ${{ !cancelled() }}
        shell: bash
        run: ./scripts/test-enterprise-hook-hardening.sh "$RUNNER_TEMP/defenseclaw-gateway" amp
      - name: Test managed package ownership enforcement
        if: ${{ !cancelled() }}
        shell: bash
        env:
          MACOS_ENTERPRISE_PACKAGING_SMOKE: "1"
        run: |
          ./scripts/test-macos-enterprise-packaging.sh \
            "$RUNNER_TEMP/defenseclaw-gateway" \
            "$RUNNER_TEMP/defenseclaw-acp"

  unix-standalone-lifecycle:
    # The standalone Linux and macOS lifecycle engine, its units and the
    # Unix peer-identity code. The go-test jobs run on Linux and go-build
    # only cross-compiles darwin, so the macOS-only code (LOCAL_PEERCRED,
    # dscl identity, launchd layout, the kern.proc agent-process lookup and
    # the linux||darwin hook-socket, peer-home and trusted-state code) runs
    # here on its own OS, and the systemd units get a static systemd-analyze
    # check on Linux.
    name: Unix Standalone Lifecycle (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.enterprise != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Go tests of the standalone lifecycle packages
        shell: bash
        run: >-
          go test -count=1 -timeout 20m
          ./internal/enterpriseunix/...
          ./internal/unixidentity/...
          ./internal/peercred/...
          ./internal/managed/...
          ./internal/enterprisehooks/...
          ./internal/enterprisepolicy/...
          ./internal/ipc/...
      - name: Go tests of the darwin paths in the agent-process, connector, gateway and CLI packages
        # The go-test jobs run these packages on Linux only. On macOS this runs
        # the kern.proc agent-process lookup, the gethostuuid machine id behind
        # agt- IDs, every connector package
        # (hookexec and the /etc/codex requirements path included) and, in
        # internal/gateway and internal/cli, the tests of their darwin, unix,
        # linux||darwin and !windows test files plus the foreign-hook guard,
        # which keys sessions by the agent process.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # The runner's default TMPDIR is under /var, a symbolic link to
          # /private/var, and the Claude Code settings reader refuses a file
          # under a linked parent. Test fixtures go in a link-free folder.
          mkdir -p "$RUNNER_TEMP/go-tmp"
          TMPDIR="$(cd "$RUNNER_TEMP/go-tmp" && pwd -P)"
          export TMPDIR
          go test -count=1 -timeout 20m ./internal/agentprocess/... ./internal/agentidentity/... ./internal/gateway/connector/...
          unix_tests() { # unix_tests <test files...>: a -run pattern for their Test functions
            local file names=()
            for file in "$@"; do
              case "$file" in
                *_windows_test.go | *_linux_test.go) continue ;;
                *_darwin_test.go | *_unix_test.go | */hook_foreign_guard*_test.go) ;;
                *) grep -Eq '^//go:build .*(darwin|unix|!windows|!linux)' "$file" || continue ;;
              esac
              names+=($(sed -n 's/^func \(Test[A-Za-z0-9_]*\)(t \*testing\.T).*/\1/p' "$file"))
            done
            [ "${#names[@]}" -gt 0 ] || { echo "no unix or darwin tests in $*" >&2; return 1; }
            local IFS='|'
            echo "^(${names[*]})\$"
          }
          for pkg in internal/gateway internal/cli; do
            pattern=$(unix_tests "$pkg"/*_test.go)
            echo "$pkg: $(tr '|' '\n' <<<"$pattern" | wc -l | tr -d ' ') unix and darwin tests"
            go test -count=1 -timeout 20m -run "$pattern" "./$pkg"
          done
      - name: The shipped binaries start without stderr output
        # A dependency's start-up warning (for example sonic's Go-version
        # notice) would reach admin and MDM output and agent hook errors.
        shell: bash
        run: make check-quiet-startup
      - name: systemd-analyze verify the packaged units
        # systemd-analyze exits 0 on unknown keys and bad values, so the
        # script fails on any diagnostic it prints.
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/test-systemd-units.sh

  # Standalone managed-enterprise install lanes: each one installs the real
  # package on a disposable host with the real service manager, converges,
  # verifies, runs the MDM detection script, uninstalls and checks what is
  # left (scripts/test-enterprise-unix-install.sh and
  # scripts/test-enterprise-windows-install.ps1).
  enterprise-install-assets:
    # The deb and rpm come from the release's own GoReleaser config (a
    # snapshot of `make packaging-linux-enterprise`, unsigned) and the Windows
    # Setup from the release's builder without a signing certificate, which
    # is the hash-pinned standalone-unsigned flavor.
    name: Enterprise Install Lane Assets
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.enterprise != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      linux-version: ${{ steps.linux.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build the Linux packages with the release GoReleaser config
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: "v2.15.4"
          args: release --snapshot --clean --skip=sbom,sign,publish,validate
        env:
          # A snapshot needs no tag history; the version is 9.9.9-SNAPSHOT-<commit>.
          GORELEASER_CURRENT_TAG: v9.9.9
      - name: Collect the linux/amd64 packages
        id: linux
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          mkdir -p "$RUNNER_TEMP/enterprise-install-linux"
          cp "dist/defenseclaw-enterprise-${version}-linux-amd64.deb" \
            "dist/defenseclaw-enterprise-${version}-linux-amd64.rpm" "$RUNNER_TEMP/enterprise-install-linux/"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # build-setup.sh builds the Python scanner runtime with uv.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Build the hash-pinned unsigned Windows standalone Setup
        shell: bash
        run: packaging/windows/standalone/build-setup.sh --version 9.9.9 --out-dir "$RUNNER_TEMP/enterprise-install-windows"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-install-linux
          path: ${{ runner.temp }}/enterprise-install-linux/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-install-windows
          path: ${{ runner.temp }}/enterprise-install-windows/
          if-no-files-found: error
          retention-days: 3

  enterprise-linux-install:
    # The deb installs on the Ubuntu 24.04 runner itself (systemd 255 is PID
    # 1); the rpm installs in Red Hat UBI containers that boot systemd: RHEL 9
    # (systemd 252) and RHEL 8 (systemd 239, the package's minimum). Each lane
    # also runs systemd-analyze verify on the installed units with that
    # systemd and fails on any diagnostic outside the lane script's
    # per-release allow list (directive_minimum), so a directive RHEL 8
    # silently ignores is either listed there or fails the rpm-el8 lane.
    name: Enterprise Install Lane (${{ matrix.lane }})
    needs: enterprise-install-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: deb
            package: deb
          - lane: rpm-el9
            package: rpm
            image: registry.access.redhat.com/ubi9/ubi-init@sha256:762319bbd0b15a4eff9078eb373b1f426de3e8b5560cf314715c62844b7b0fc8
          - lane: rpm-el8
            package: rpm
            image: registry.access.redhat.com/ubi8/ubi-init@sha256:96fe60da3105dbd9a74cc6fbf3a17741e98fd96a572b22256644e93f0f6ba6a6
    env:
      LANE_VERSION: ${{ needs.enterprise-install-assets.outputs.linux-version }}
      LANE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: enterprise-install-linux
          path: ${{ runner.temp }}/enterprise-install
      - name: Remove group and other write access from the runner /opt
        # Hosted Ubuntu runners ship /opt world-writable, and the standalone
        # profile refuses policy under a folder other accounts can write.
        if: matrix.package == 'deb'
        shell: bash
        run: sudo chmod go-w /opt
      - name: Install, converge, verify and remove the deb on the runner
        if: matrix.package == 'deb'
        shell: bash
        run: >-
          sudo bash scripts/test-enterprise-unix-install.sh
          --package "$RUNNER_TEMP/enterprise-install/defenseclaw-enterprise-${LANE_VERSION}-linux-amd64.deb"
          --version "$LANE_VERSION" --results "$RUNNER_TEMP/lane-results"
      - name: Install, converge, verify and remove the rpm in a UBI systemd container
        if: matrix.package == 'rpm'
        shell: bash
        run: >-
          bash scripts/test-enterprise-linux-container.sh --image "$LANE_IMAGE"
          --package "$RUNNER_TEMP/enterprise-install/defenseclaw-enterprise-${LANE_VERSION}-linux-amd64.rpm"
          --version "$LANE_VERSION" --results "$RUNNER_TEMP/lane-results"
      - name: Make the lifecycle results readable
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/lane-results" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-install-results-${{ matrix.lane }}
          path: ${{ runner.temp }}/lane-results/
          if-no-files-found: ignore
          retention-days: 5

  enterprise-macos-install:
    name: Enterprise Install Lane (pkg)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.enterprise != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build the unsigned standalone pkg
        shell: bash
        run: scripts/build-macos-enterprise-pkg.sh --version 9.9.9 --dist-dir "$RUNNER_TEMP/enterprise-install"
      - name: Install, converge, verify and remove the pkg
        shell: bash
        run: >-
          sudo bash scripts/test-enterprise-unix-install.sh
          --package "$RUNNER_TEMP/enterprise-install/defenseclaw-enterprise-9.9.9-darwin-arm64.pkg"
          --version 9.9.9 --results "$RUNNER_TEMP/lane-results"
      - name: Make the lifecycle results readable
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/lane-results" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-install-results-pkg
          path: ${{ runner.temp }}/lane-results/
          if-no-files-found: ignore
          retention-days: 5

  enterprise-windows-install:
    # Setup /ensure, /ensure (no-op), verify, status, detect.ps1, the
    # installed CLI's ensure and /uninstall with the four Windows services.
    name: Enterprise Install Lane (Windows services)
    needs: enterprise-install-assets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: enterprise-install-windows
          path: ${{ runner.temp }}/enterprise-install
      - name: Give the runner Windows log folder its usual owner and access
        # Hosted Windows runner images leave C:\Windows\Logs owned by, and
        # writable for, the built-in Administrator account. The lifecycle log
        # refuses a parent folder another account owns or can write.
        shell: pwsh
        run: |
          $logs = Join-Path $env:windir 'Logs'
          $account = (Get-LocalUser | Where-Object { $_.SID.Value -like 'S-1-5-21-*-500' }).SID.Value
          icacls $logs /setowner '*S-1-5-32-544' | Out-Null
          if ($account) {
            icacls $logs /inheritance:d | Out-Null
            icacls $logs /remove:g "*$account" | Out-Null
          }
          icacls $logs
      - name: Install, converge, verify and remove the standalone services
        shell: pwsh
        run: >-
          ./scripts/test-enterprise-windows-install.ps1
          -Setup (Join-Path $env:RUNNER_TEMP 'enterprise-install\DefenseClawSetup-Enterprise-Standalone-x64.exe')
          -Version 9.9.9 -ResultsRoot (Join-Path $env:RUNNER_TEMP 'lane-results')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-install-results-windows
          path: ${{ runner.temp }}/lane-results/
          if-no-files-found: ignore
          retention-days: 5

  enterprise-upgrade:
    # Upgrades the latest published release's standalone enterprise package
    # to this pull request's 9.9.9 snapshot on each platform, through the
    # lane scripts' --upgrade-from mode: the upgrade keeps the administrator
    # config intent, secrets and guardian ledger and reports the applied
    # policy, and on Linux and macOS a failed upgrade rolls back (the root-only
    # lifecycle test fault). release.yaml runs the same lanes before publish.
    name: Enterprise Upgrade Lane (${{ matrix.lane }})
    needs: [changes, enterprise-install-assets]
    if: ${{ !cancelled() && needs.changes.outputs.enterprise != 'false' && needs.enterprise-install-assets.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: deb
            runner: ubuntu-24.04
            asset: linux-amd64.deb
          - lane: rpm-el9
            runner: ubuntu-24.04
            asset: linux-amd64.rpm
            image: registry.access.redhat.com/ubi9/ubi-init@sha256:762319bbd0b15a4eff9078eb373b1f426de3e8b5560cf314715c62844b7b0fc8
          - lane: pkg
            runner: macos-latest
            asset: darwin-arm64.pkg
          - lane: Windows
            runner: windows-latest
            asset: setup
    env:
      GH_TOKEN: ${{ github.token }}
      LANE: ${{ matrix.lane }}
      LANE_ASSET: ${{ matrix.asset }}
      LANE_IMAGE: ${{ matrix.image }}
      LINUX_VERSION: ${{ needs.enterprise-install-assets.outputs.linux-version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: "v2.6.3"
      - name: Fetch and verify the latest release's enterprise package
        id: previous
        shell: bash
        run: bash scripts/fetch-previous-enterprise-package.sh --asset "$LANE_ASSET" --dir "$RUNNER_TEMP/previous" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.previous.outputs.version != '' && runner.os == 'Linux'
        with:
          name: enterprise-install-linux
          path: ${{ runner.temp }}/enterprise-install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.previous.outputs.version != '' && runner.os == 'Windows'
        with:
          name: enterprise-install-windows
          path: ${{ runner.temp }}/enterprise-install
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.previous.outputs.version != '' && runner.os == 'macOS'
        with:
          go-version-file: go.mod
      - name: Build the unsigned standalone pkg
        if: steps.previous.outputs.version != '' && runner.os == 'macOS'
        shell: bash
        run: scripts/build-macos-enterprise-pkg.sh --version 9.9.9 --dist-dir "$RUNNER_TEMP/enterprise-install"
      - name: Remove group and other write access from the runner /opt
        if: steps.previous.outputs.version != '' && matrix.lane == 'deb'
        shell: bash
        run: sudo chmod go-w /opt
      - name: Give the runner Windows log folder its usual owner and access
        if: steps.previous.outputs.version != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $logs = Join-Path $env:windir 'Logs'
          $account = (Get-LocalUser | Where-Object { $_.SID.Value -like 'S-1-5-21-*-500' }).SID.Value
          icacls $logs /setowner '*S-1-5-32-544' | Out-Null
          if ($account) {
            icacls $logs /inheritance:d | Out-Null
            icacls $logs /remove:g "*$account" | Out-Null
          }
      - name: Upgrade, drill the rollback, converge, verify and remove
        if: steps.previous.outputs.version != '' && runner.os != 'Windows'
        shell: bash
        env:
          PREVIOUS_PACKAGE: ${{ steps.previous.outputs.package }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          set -euo pipefail
          case "$LANE" in
            pkg) version=9.9.9 ;;
            *) version=$LINUX_VERSION ;;
          esac
          args=(--package "$RUNNER_TEMP/enterprise-install/defenseclaw-enterprise-${version}-${LANE_ASSET}" --version "$version"
            --upgrade-from "$PREVIOUS_PACKAGE" --previous-version "$PREVIOUS_VERSION" --results "$RUNNER_TEMP/lane-results")
          if [ "$LANE" = rpm-el9 ]; then
            bash scripts/test-enterprise-linux-container.sh --image "$LANE_IMAGE" "${args[@]}"
          else
            sudo bash scripts/test-enterprise-unix-install.sh "${args[@]}"
          fi
      - name: Upgrade, converge, verify and remove the standalone services
        if: steps.previous.outputs.version != '' && runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/test-enterprise-windows-install.ps1
          -Setup (Join-Path $env:RUNNER_TEMP 'enterprise-install\DefenseClawSetup-Enterprise-Standalone-x64.exe')
          -Version 9.9.9 -ResultsRoot (Join-Path $env:RUNNER_TEMP 'lane-results')
          -UpgradeFrom '${{ steps.previous.outputs.package }}' -PreviousVersion '${{ steps.previous.outputs.version }}'
      - name: Make the lifecycle results readable
        if: always() && runner.os != 'Windows'
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/lane-results" 2>/dev/null || true
      - name: The upgrade kept the administrator config intent
        if: steps.previous.outputs.version != ''
        shell: bash
        run: |
          args=(--before "$RUNNER_TEMP/lane-results/config-before.yaml"
            --after "$RUNNER_TEMP/lane-results/config-upgraded.yaml")
          if [ -f "$RUNNER_TEMP/lane-results/migration-v9.json" ]; then
            args+=(--record "$RUNNER_TEMP/lane-results/migration-v9.json")
          fi
          uv run --no-project --with pyyaml==6.0.3 python scripts/check_enterprise_upgrade_config.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-upgrade-results-${{ matrix.lane }}
          path: ${{ runner.temp }}/lane-results/
          if-no-files-found: ignore
          retention-days: 5

  enterprise-required:
    # One required check for the standalone managed-enterprise gates, in the
    # same pattern as Go Test and Python Lint & Test: it runs even when a gate
    # fails or is skipped, and passes only when every gate succeeded. The main
    # branch ruleset requires this name, so a red install lane or lifecycle
    # job blocks the merge.
    name: Enterprise Required
    needs:
      - changes
      - enterprise-install-assets
      - enterprise-linux-install
      - enterprise-macos-install
      - enterprise-windows-install
      - enterprise-upgrade
      - unix-standalone-lifecycle
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every enterprise gate
        env:
          INSTALL_ASSETS: ${{ needs.enterprise-install-assets.result }}
          LINUX_INSTALL: ${{ needs.enterprise-linux-install.result }}
          MACOS_INSTALL: ${{ needs.enterprise-macos-install.result }}
          WINDOWS_INSTALL: ${{ needs.enterprise-windows-install.result }}
          UPGRADE: ${{ needs.enterprise-upgrade.result }}
          UNIX_LIFECYCLE: ${{ needs.unix-standalone-lifecycle.result }}
          # false when the pull request changes nothing these gates consume.
          ENTERPRISE: ${{ needs.changes.outputs.enterprise }}
        shell: bash
        run: |
          status=0
          for gate in INSTALL_ASSETS LINUX_INSTALL MACOS_INSTALL WINDOWS_INSTALL UPGRADE UNIX_LIFECYCLE; do
            result=${!gate}
            echo "$gate: $result"
            if [ "$ENTERPRISE" = false ] && [ "$result" = skipped ]; then
              continue
            fi
            [ "$result" = success ] || status=1
          done
          exit "$status"

  quiet-startup-latest-go:
    # Advisory: the gates above build with go.mod's Go, which a dependency's
    # start-up warning about a newer toolchain never reaches. This job builds
    # with the newest stable Go, the way a release host that upgraded its Go
    # would, and reports such a warning without gating merges.
    name: Quiet Start-up (latest Go, advisory)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      - name: The shipped binaries start without stderr output on the latest Go
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: make check-quiet-startup

  python-audit:
    name: Python Dependency Audit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync
      - run: uv pip install pip pip-audit
      # Use OSV for the vulnerability database so an outage in PyPI's
      # package-metadata JSON API does not turn the audit red before
      # pip-audit can evaluate the installed environment. Fix advisories by
      # raising the floor in pyproject.toml (dependencies and tool.uv
      # override-dependencies) instead of ignoring them here.
      - run: uv run pip-audit --vulnerability-service osv

  ts-build-test:
    name: TypeScript Build & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ts != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - run: make plugin
      - run: make ts-test

  ts-audit:
    name: npm Dependency Audit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ts != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/defenseclaw
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - run: npm ci
      # Production-only audit (--omit=dev excludes vitest/vite dev vulns).
      # --audit-level=high: moderate-severity js-yaml ReDoS is a devDependency
      # transitive, not shipped in the extension bundle, so it is excluded.
      - run: npm audit --omit=dev --audit-level=high

  rego-test:
    name: Rego Policy Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rego != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          # CI action / tool version pinning: a `version: latest`
          # value let a malicious OPA release run inside CI and tamper
          # with policy test results. Pin to a known-good release and
          # refresh through reviewed dependency updates (Dependabot).
          version: 0.70.0
      - run: make rego-test

  schema-parity:
    name: Schema & Parity Checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.checks != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # This one gate explicitly proves the PR #403/#412 compatibility
          # commits remain ancestors. Portable unit/source-archive validation
          # checks their documented SHAs without requiring Git history.
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: make plugin
      - run: make dev-pycli
      # Keep the ordinary gate small: compile the real registry once and prove
      # that every checked-in runtime/Go output is current. Exhaustive mutation
      # coverage runs only when its inputs change, plus nightly/manual.
      - name: Verify canonical telemetry registry outputs
        run: make telemetry-check
      - run: make check VERIFY_OBSERVABILITY_BASELINE_ANCESTRY=1

  local-observability-golden:
    name: Local Observability Golden
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: make dev-pycli
      - name: Start the local observability stack
        run: bundles/local_observability_stack/bin/openclaw-observability-bridge up --timeout 180
      - name: Emit and verify native v8 telemetry
        env:
          DEFENSECLAW_LOCAL_OBSERVABILITY_OTLP_ENDPOINT: http://127.0.0.1:4318
        run: |
          go test ./internal/gateway -run TestLocalObservabilityGoldenProducerScenario -count=1
          .venv/bin/python scripts/check_grafana_dashboards.py \
            --require-packaged \
            --live \
            --inventory \
            --inventory-hours 1 \
            --live-golden \
            --golden-lookback-minutes 15 \
            --grafana-password-file bundles/local_observability_stack/.grafana-admin-password \
            --golden-wait-seconds 60
      - name: Stop the local observability stack
        if: ${{ always() }}
        run: bundles/local_observability_stack/bin/openclaw-observability-bridge reset
