name: CI g88 diag
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select CI suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      go_pinned: ${{ steps.classify.outputs.go_pinned }}
      go_tests: ${{ steps.classify.outputs.go_tests }}
      python: ${{ steps.classify.outputs.python }}
      python_tests: ${{ steps.classify.outputs.python_tests }}
      py_select: ${{ steps.classify.outputs.py_select }}
      python_lint: ${{ steps.classify.outputs.python_lint }}
      wheel: ${{ steps.classify.outputs.wheel }}
      ts: ${{ steps.classify.outputs.ts }}
      rego: ${{ steps.classify.outputs.rego }}
      checks: ${{ steps.classify.outputs.checks }}
      core: ${{ steps.classify.outputs.core }}
      install: ${{ steps.classify.outputs.install }}
      cowork_vm: ${{ steps.classify.outputs.cowork_vm }}
      enterprise: ${{ steps.classify.outputs.enterprise }}
      workflows: ${{ steps.classify.outputs.workflows }}
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        persist-credentials: false
        fetch-depth: 2
    - id: classify
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: python3 scripts/ci_changes.py --event "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"
  install-smoke-assets:
    name: Install and Upgrade Smoke Assets
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.install != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPROXY: https://proxy.golang.org|direct
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-go
      id: go
      with:
        cache-name: release-assets
        cache-files: scripts/build-release-assets.sh
    - name: Download Go modules
      run: "for attempt in 1 2 3; do\n  if go mod download; then\n    exit 0\n  fi\n  echo \"::warning::go mod download failed (attempt $attempt of 3)\"\n  sleep $((attempt * 15))\ndone\nexit 1\n"
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: extensions/defenseclaw/package-lock.json
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        enable-cache: true
        save-cache: ${{ github.ref == 'refs/heads/main' }}
    - run: scripts/build-release-assets.sh 9.9.9 "$RUNNER_TEMP/assets" linux/amd64 windows/amd64
    - run: test -s "$RUNNER_TEMP/assets/defenseclaw-fleet-assets.tar.gz"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: install-smoke-assets
        path: ${{ runner.temp }}/assets/
        if-no-files-found: error
        retention-days: 3
    - uses: ./.github/actions/go-cache-save
      with:
        cache-name: release-assets
        cache-files: scripts/build-release-assets.sh
        cache-hit: ${{ steps.go.outputs.cache-hit }}
  perf-budget:
    name: g88 ${{ matrix.mode }} ${{ matrix.rep }}
    needs: install-smoke-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        enable-cache: true
        save-cache: ${{ github.ref == 'refs/heads/main' }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: install-smoke-assets
        path: ${{ runner.temp }}/assets
    - name: Install into a throwaway HOME
      run: python3 scripts/perf/dcperf.py provision --assets "$RUNNER_TEMP/assets" --home "$RUNNER_TEMP/perf-home"
    - name: g88 diag
      run: python3 scripts/perf/g88diag2.py "$RUNNER_TEMP/perf-home" "$RUNNER_TEMP/g88diag.json" ${{ matrix.mode }}
    - name: Stop the gateway
      if: ${{ always() }}
      env:
        HOME: ${{ runner.temp }}/perf-home
      run: if [ -x "$HOME/.local/bin/defenseclaw-gateway" ]; then "$HOME/.local/bin/defenseclaw-gateway" stop; fi
    - if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: g88-${{ matrix.mode }}-${{ matrix.rep }}
        path: ${{ runner.temp }}/g88diag.json
        if-no-files-found: warn
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        mode:
        - now
        - sync
        - wait20
        rep:
        - 1
        - 2
        - 3
        - 4
'on':
  workflow_dispatch: null
