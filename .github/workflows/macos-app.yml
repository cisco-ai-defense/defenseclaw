name: macOS App

on:
  push:
    branches: [main]
  # Always start on pull requests so the stable aggregate below can be made
  # required without leaving unrelated changes permanently pending. The
  # changes job keeps the expensive macOS work selective.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect macOS app changes
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.detect.outputs.macos }}
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select macOS app validation
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push|workflow_dispatch)
              echo "macos=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request)
              ;;
            *)
              echo "::error::unexpected macOS app workflow event: $EVENT_NAME"
              exit 1
              ;;
          esac

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pull request base SHA is not an exact commit ID"
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pull request head SHA is not an exact commit ID"
            exit 1
          fi
          if [[ "$BASE_SHA" == "$HEAD_SHA" ]]; then
            echo "::error::pull request base and head SHAs must differ"
            exit 1
          fi

          macos_paths=(
            ':(glob)macos/**'
            'scripts/build-macos-app-release.sh'
            'scripts/check-macos-upstream.py'
            'scripts/export-uv-overrides.py'
            'scripts/generate-upgrade-manifest.py'
            'scripts/macos_license_headers.py'
            'scripts/release_candidate.py'
            'scripts/source_release_identity.py'
            'scripts/stamp-version.sh'
            'scripts/test-upgrade-protocol-release.sh'
            'scripts/test-upgrade-release.sh'
            'scripts/update-macos-app.sh'
            'scripts/verify-macos-app-release.sh'
            'release/source-install-identity.json'
            'release/upgrade-baselines.json'
            'Makefile'
            'pyproject.toml'
            ':(glob)cli/**'
            'go.mod'
            'go.sum'
            ':(glob)cmd/**'
            ':(glob)internal/**'
            ':(glob)extensions/defenseclaw/**'
            '.github/workflows/macos-app.yml'
            '.github/workflows/release-candidate-smoke.yml'
          )

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          set +e
          git diff --quiet --no-renames "$BASE_SHA" "$HEAD_SHA" -- "${macos_paths[@]}"
          diff_status=$?
          set -e

          case "$diff_status" in
            0) echo "macos=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "macos=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::macOS app path detection failed (git diff exit $diff_status)"
              exit "$diff_status"
              ;;
          esac

  license-headers:
    name: Cisco License Headers
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: make macos-app-license-check

  build-and-test:
    name: Build and Test (arm64)
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Exercise release wrappers with system Bash
        env:
          DEFENSECLAW_TEST_BASH: /bin/bash
        run: |
          /bin/bash --version
          uv run --frozen python -m pytest -q \
            cli/tests/test_release_workflow_staged.py \
            -k "certification_upgrade_wrapper_is_nounset_safe_with_optional_arguments or protocol_argument_parser_accepts_no_shared_arguments_under_nounset"
      - name: Test connector onboarding
        run: macos/DefenseClawMac/script/test_connector_onboarding.sh
      - name: Prepare reviewed runtime candidate fixture
        env:
          GOCACHE: ${{ runner.temp }}/defenseclaw-macos-app-go-build-cache
          GOMODCACHE: ${{ runner.temp }}/defenseclaw-macos-app-go-module-cache
          UV_CACHE_DIR: ${{ runner.temp }}/defenseclaw-macos-app-uv-cache
        run: |
          set -euo pipefail
          version="$(python3 scripts/source_release_identity.py check --machine | cut -f1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          prepare_log="$RUNNER_TEMP/defenseclaw-macos-runtime-fixture.log"
          scripts/test-upgrade-release.sh \
            --target-version "$version" \
            --prepare-only \
            --platform darwin/arm64 \
            | tee "$prepare_log"
          candidate_root="$(
            sed -n 's/^OK: Prepared candidate release root: //p' "$prepare_log"
          )"
          [[ -n "$candidate_root" && -d "$candidate_root/$version" ]]
          [[ "$(grep -c '^OK: Prepared candidate release root: ' "$prepare_log")" == "1" ]]
          [[ ! -e dist ]]
          ditto "$candidate_root/$version" dist
          python3 scripts/release_candidate.py verify-runtime \
            --release-dir dist \
            --version "$version"
          python3 scripts/release_candidate.py extract-gateway \
            --release-dir dist \
            --output build/macos-app/runtime-input/defenseclaw \
            --version "$version" \
            --os darwin \
            --arch arm64
          python3 - "$candidate_root" <<'PY'
          import os
          from pathlib import Path
          import shutil
          import sys

          candidate_root_input = Path(sys.argv[1])
          workdir_input = candidate_root_input.parent
          if not candidate_root_input.is_absolute():
              raise SystemExit("candidate release root must be absolute")
          if candidate_root_input.is_symlink() or workdir_input.is_symlink():
              raise SystemExit("candidate release root and workdir must not be symlinks")
          try:
              candidate_root = candidate_root_input.resolve(strict=True)
          except OSError as exc:
              raise SystemExit(f"candidate release root cannot be resolved: {exc}") from exc
          if candidate_root_input != candidate_root or not candidate_root.is_dir():
              raise SystemExit("candidate release root must be a canonical directory")

          workdir = candidate_root.parent
          if candidate_root != workdir / "candidate-release":
              raise SystemExit("candidate release root has an unexpected shape")
          workdir_prefix = "defenseclaw-upgrade-smoke."
          workdir_suffix = workdir.name.removeprefix(workdir_prefix)
          if (
              not workdir.name.startswith(workdir_prefix)
              or not workdir_suffix
              or not workdir_suffix.isalnum()
          ):
              raise SystemExit("candidate workdir has an unexpected name")

          trusted_root_inputs = [("TMPDIR", os.environ.get("TMPDIR") or "/tmp")]
          if os.environ.get("RUNNER_TEMP"):
              trusted_root_inputs.append(("RUNNER_TEMP", os.environ["RUNNER_TEMP"]))
          trusted_roots: set[Path] = set()
          for variable, raw_root in trusted_root_inputs:
              root_input = Path(raw_root)
              if not root_input.is_absolute():
                  raise SystemExit(f"{variable} must be absolute")
              try:
                  root = root_input.resolve(strict=True)
              except OSError as exc:
                  raise SystemExit(f"{variable} cannot be resolved: {exc}") from exc
              if not root.is_dir() or root == Path(root.anchor):
                  raise SystemExit(f"{variable} is not a trusted temp directory")
              trusted_roots.add(root)
          if workdir.parent not in trusted_roots:
              raise SystemExit("candidate workdir is outside the trusted temp roots")

          shutil.rmtree(workdir)
          PY
          go clean -cache -modcache
          uv cache clean
          echo "MACOS_CI_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MACOS_GATEWAY_INPUT=$GITHUB_WORKSPACE/build/macos-app/runtime-input/defenseclaw" \
            >> "$GITHUB_ENV"
      - name: Build unified ad-hoc release artifact
        run: scripts/build-macos-app-release.sh "$MACOS_CI_RELEASE_VERSION" dist
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: DefenseClawMac-ci-macos-arm64-unverified
          path: |
            dist/DefenseClawMac-*-macos-arm64-unverified.dmg
            dist/DefenseClawMac-*-macos-arm64-unverified.zip
          if-no-files-found: error

  macos-app-required:
    name: macOS App Required
    needs: [changes, license-headers, build-and-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every macOS app check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_CHANGED: ${{ needs.changes.outputs.macos }}
          LICENSE_HEADERS_RESULT: ${{ needs.license-headers.result }}
          BUILD_AND_TEST_RESULT: ${{ needs.build-and-test.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$MACOS_CHANGED" in
            true)
              test "$LICENSE_HEADERS_RESULT" = success
              test "$BUILD_AND_TEST_RESULT" = success
              ;;
            false)
              test "$LICENSE_HEADERS_RESULT" = skipped
              test "$BUILD_AND_TEST_RESULT" = skipped
              echo "No macOS app paths changed; expensive validation was intentionally skipped."
              ;;
            *)
              echo "::error::unexpected macOS app path decision: $MACOS_CHANGED"
              exit 1
              ;;
          esac
