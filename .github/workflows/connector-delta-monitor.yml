name: Connector Delta Monitor
on:
  pull_request:
    paths: ['scripts/connector_delta_monitor.py', 'scripts/connector_delta/**', 'cli/tests/test_connector_delta.py', '.github/workflows/connector-delta-monitor.yml']
  push:
    branches: ['codex/claude-delta-monitor']
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: Send contributor notices (also requires the repository notification switch)
        type: boolean
        default: false
      replay_pr:
        description: 'Optional merged PR replay, e.g. codex:123 or claudecode:456 (no notices or checkpoint writes)'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: connector-delta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: python3 -m unittest cli.tests.test_connector_delta -v
  monitor:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.CONNECTOR_DELTA_MONITOR_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      ready: ${{ steps.bundle.outputs.ready }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - name: Restore the last committed checkpoint from this main-only workflow
        if: ${{ inputs.replay_pr == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p monitor
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/connector-delta-monitor.yml" --jq .id)
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=connector-delta-state-v2&per_page=100" > monitor/artifacts.json
          jq -r '[.[].artifacts[] | select(.name == "connector-delta-state-v2" and .workflow_run.head_branch == "main")] | sort_by(.created_at, .id) | reverse | .[] | [.workflow_run.id, .expired] | @tsv' monitor/artifacts.json > monitor/candidates.tsv
          had_checkpoint=false
          while IFS=$'\t' read -r run_id expired; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
            [[ "$expired" == true || "$expired" == false ]] || exit 1
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > monitor/run.json
            trusted=$(jq --argjson workflow "$workflow_id" --arg repo "$GITHUB_REPOSITORY" '.workflow_id == $workflow and .head_branch == "main" and .head_repository.full_name == $repo and (.event == "schedule" or .event == "workflow_dispatch")' monitor/run.json)
            if [ "$trusted" != true ]; then continue; fi
            had_checkpoint=true
            if [ "$expired" = true ]; then continue; fi
            gh run download "$run_id" --name connector-delta-state-v2 --dir monitor/checkpoint
            test -s monitor/checkpoint/state.json
            exit 0
          done < monitor/candidates.tsv
          if [ "$had_checkpoint" = false ]; then
            # Deleted artifacts must not look like a first run. Early failures
            # and all-skipped runs, however, never committed a checkpoint.
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&status=completed&per_page=100" > monitor/runs.json
            jq -r --arg repo "$GITHUB_REPOSITORY" '.[].workflow_runs[] | select(.head_repository.full_name == $repo and (.event == "schedule" or .event == "workflow_dispatch")) | .id' monitor/runs.json > monitor/prior.tsv
            while read -r run_id; do
              [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
              gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=all&per_page=100" > monitor/jobs.json
              published=$(jq 'any(.[].jobs[]; .name == "publish" and (.conclusion == "success" or any(.steps[]?; .conclusion == "success" and (.name | startswith("Run actions/upload-artifact@")))))' monitor/jobs.json)
              if [ "$published" = true ]; then had_checkpoint=true; break; fi
            done < monitor/prior.tsv
          fi
          if [ "$had_checkpoint" = true ]; then
            echo '::error::Committed checkpoints expired or were deleted. Restore state; do not reset history.'
            exit 1
          fi
      - name: Assume the SRE Bedrock role with GitHub OIDC
        id: bedrock
        if: ${{ vars.CONNECTOR_DELTA_AI_ENABLED == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::422940237045:role/defenseclaw-connector-delta-gha-oidc-role
          aws-region: us-west-2
          allowed-account-ids: '422940237045'
          mask-aws-account-id: true
          role-duration-seconds: 1800
          retry-max-attempts: 3
          action-timeout-s: 120
          output-env-credentials: false
          output-credentials: true
          unset-current-credentials: true
      - name: Compare merged PRs with current DefenseClaw main
        env:
          CONNECTOR_DELTA_REPLAY_PR: ${{ inputs.replay_pr }}
          GH_TOKEN: ${{ github.token }}
          CONNECTOR_DELTA_AI_ENABLED: ${{ vars.CONNECTOR_DELTA_AI_ENABLED == 'true' }}
          CONNECTOR_DELTA_AI_PROVIDER: bedrock
          CONNECTOR_DELTA_MODEL: arn:aws:bedrock:us-west-2:422940237045:application-inference-profile/j71zf47bc2t6
          CONNECTOR_DELTA_REASONING_EFFORT: high
          AWS_REGION: us-west-2
          AWS_ACCESS_KEY_ID: ${{ steps.bedrock.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.bedrock.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.bedrock.outputs.aws-session-token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from scripts import connector_delta_monitor as monitor

          replay = os.environ.get('CONNECTOR_DELTA_REPLAY_PR', '')
          if not replay:
              sys.exit(monitor.main(['analyze', '--state', 'monitor/checkpoint/state.json', '--output', 'monitor', '--limit', '100']))
          match = re.fullmatch(r'(codex|claudecode):([1-9][0-9]{0,8})', replay)
          if not match or os.environ.get('CONNECTOR_DELTA_AI_ENABLED') != 'true':
              sys.exit('Replay requires connector:PR_NUMBER and CONNECTOR_DELTA_AI_ENABLED=true.')
          output = Path('monitor/replay')
          result = monitor.main(['analyze', '--pr', *match.groups(), '--output', str(output)])
          if result:
              sys.exit(result)
          reports = monitor.load(output / 'private-report.json')
          batches = [row['ai_review']['batches'] for row in reports if 'ai_review' in row]
          attempted = sum(row['attempted'] for row in batches)
          completed = sum(row['completed'] for row in batches)
          print(json.dumps({'processed': len(reports), 'llm_batches_attempted': attempted, 'llm_batches_validated': completed}))
          if not completed or completed != attempted:
              sys.exit('Replay did not complete an LLM review; no end-to-end inference success claimed.')
          PY
      - name: Prepare metadata-only notices and candidate checkpoint
        id: bundle
        if: ${{ always() && inputs.replay_pr == '' }}
        run: |
          if [ -s monitor/public/bundle.json ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ always() && steps.bundle.outputs.ready == 'true' }}
        with:
          name: connector-delta-pending-v3
          path: monitor/public/bundle.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: monitor
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && inputs.replay_pr == '' && needs.monitor.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: connector-delta-pending-v3
          path: monitor/public
      - name: Optionally notify, then commit processed-PR progress
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTOR_DELTA_NOTIFICATIONS_ENABLED: ${{ vars.CONNECTOR_DELTA_NOTIFICATIONS_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.notify == true) }}
        run: python3 scripts/connector_delta_monitor.py publish --output monitor
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: connector-delta-state-v2
          path: monitor/checkpoint/state.json
          retention-days: 90
          if-no-files-found: error
