# OpenShell sandbox integration E2E (opt-in, manual only).
#
# Drives the DefenseClaw sandbox daemon and the `defenseclaw sandbox` CLI
# against a real NVIDIA OpenShell 0.1.x gateway with the mock model servers
# in test/e2e/openshell (scripts/test-e2e-openshell.sh). It needs a
# self-hosted Linux arm64 runner with OpenShell installed, its gateway
# running with bind mounts enabled, and Docker, so it never runs on pull
# requests or on a schedule. The optional real-model lane runs Claude Code
# and Codex on Amazon Bedrock through the runner's instance role.

name: OpenShell Integration E2E

on:
  workflow_dispatch:
    inputs:
      bedrock:
        description: "Also run the real-model lane on Amazon Bedrock"
        type: boolean
        default: false
      pattern:
        description: "go test -run pattern"
        type: string
        default: "TestSandboxDaemon|TestSandboxCLI"

permissions:
  contents: read

concurrency:
  # One run per runner: the tests share the host's OpenShell gateway.
  group: openshell-integration
  cancel-in-progress: false

jobs:
  openshell:
    name: OpenShell sandbox E2E
    runs-on: [self-hosted, Linux, ARM64, e2e]
    timeout-minutes: 150
    env:
      DEFENSECLAW_E2E_WORK_DIR: ${{ runner.temp }}/openshell-e2e
      DEFENSECLAW_E2E_PREFIX: ci-e2e-${{ github.run_number }}
      DEFENSECLAW_E2E_BEDROCK: ${{ inputs.bedrock && '1' || '' }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: OpenShell present
        run: |
          openshell --version
          docker version --format '{{.Server.Version}}'
      - name: Sandbox E2E
        env:
          E2E_PATTERN: ${{ inputs.pattern }}
        run: scripts/test-e2e-openshell.sh "$E2E_PATTERN"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openshell-e2e-logs
          path: |
            ${{ runner.temp }}/openshell-e2e/go-test.log
            ${{ runner.temp }}/openshell-e2e/**/logs/*.log
          if-no-files-found: ignore
