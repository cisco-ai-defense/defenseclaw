# Temporary probe for ci/flake-3-opencode-node-harness-eof (wip branch only; never merged).
name: flake3 stress (temporary)

on:
  push:
    branches: ['wip/ci/flake-3-stress']

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  cold-node:
    name: first node launch / slot ${{ matrix.slot }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Time the first and later node launches on a fresh runner
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $item = Get-Item $node
          Write-Host "node=$node size=$($item.Length) drive=$((Split-Path -Qualifier $node))"
          foreach ($i in 1..4) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $v = & $node --version
            $sw.Stop()
            Write-Host ("launch {0}: {1:n0} ms ({2})" -f $i, $sw.Elapsed.TotalMilliseconds, $v)
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $null = & $node --input-type=module -e "await import('node:url'); await fetch('http://127.0.0.1:9').catch(() => {})"
          $sw.Stop()
          Write-Host ("module+fetch launch: {0:n0} ms" -f $sw.Elapsed.TotalMilliseconds)
