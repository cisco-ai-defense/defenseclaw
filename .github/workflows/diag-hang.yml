name: Diag runner hang

# Temporary diagnostic: bisects the tests of the two jobs that take the
# runner down on PRs into release-defenseclaw-enterprise-26.11.1
# (Connector Matrix part 0, no -race; Go shard 2, -race). Each job runs one
# slice; the slice whose runner dies holds the culprit.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.set }} ${{ matrix.sub }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {set: m, sub: 0, run: '^(?:TestCodexSetupRollsBackRuntimeAfterHookWriterFailure|TestHermesSetupOverA102HookRendersAndSealsTheCurrentScript|TestHookContractsManifestMatchesRuntime|TestPerUserHermesHookBlocksAToolCallWhileTheGatewayIsDown)$'}
          - {set: m, sub: 1, run: '^(?:TestAMPPluginKeepsAgentNameAmpForBuiltInModes|TestCodex_Setup_Surface1_DoesNotExportGlobalEnv|TestHermesTeardownMigratesLegacyBackupAndRestoresExactBytes|TestHookScriptOwner_BuiltinSurface|TestPublishHookAPITokenWindowsPreservesExactCustomCustodyDescriptor)$'}
          - {set: m, sub: 2, run: '^(?:TestAntigravityAndDevinHookFilesMatchTheSharedGolden|TestCopilotCleanupKeepsOperatorCommandMentioningHookPath|TestHookAPIACLPanickedInspectionIsNotClean|TestHooksReplaceAStaleColdStartLockOnce|TestRemoveOTLPPathTokenWindowsRevokesBroadDACL)$'}
          - {set: m, sub: 3, run: '^(?:TestApplyHookContractUsesPinnedContractForUnknownVersion|TestCopilotWindowsHooksRepairAndTeardown|TestHookAPITokenDarwinACLInspectionTimesOut|TestKiroManagedTeardownDisablesCachedHookScript|TestSandboxHookOutcomeIgnoresExportedBashVariables)$'}
          - {set: m, sub: 4, run: '^(?:TestClaudeCodeLauncherGuardArgvStartsOnlyTheClaudeHookOfADefenseClawLauncher|TestCursorHook_StrictMissingTokenBlocks|TestHookAPITokenWindowsRejectsDeleteChildOnSharedAncestor|TestManagedFileBackup_SkipsWhenUserEditedAfterSetup|TestShellHookBehaviourMatchesGolden)$'}
          - {set: m, sub: 5, run: '^(?:TestClaudeCode_Setup_UsesDocumentedTimeoutSeconds|TestDarwinTokenFolderModeDriftIsManagedPermissionDrift|TestHookAPIWindowsTrustUsesEffectiveImpersonatedUserSID|TestManagedShellHooksRefuseANulInTheAnswer|TestTeardown_DoesNotDeleteOtherConnectorsHookScripts)$'}
          - {set: m, sub: 6, run: '^(?:TestCodexCapabilitiesExposeResolvedInventoryAndTelemetry|TestEditedPluginTeardownKeepsOperatorEditAndReceipt|TestHookContractLockClearKeepsGlobalTimestampAfterSurvivingPeer|TestOpenClaw_Setup_RefusesPlaceholder|TestWriteHookScript)$'}
          - {set: m, sub: 7, run: '^(?:TestCodexHookContractToolSurfaceBands|TestHermesHookContractV019V020ClassifiesAllValidEventsWithoutInventingBlockSurfaces|TestHookContractLockRejectsPartialSharedDigestSet|TestOpenCodeSetupRollsBackPluginAndReceiptWhenFinalPublicationFails)$'}
          - {set: r, sub: 0, run: '^(?:TestCodex_Route_PassthroughNonChat|TestHermesWriteViewRetarget|TestOpenClaw_Setup_HILTEnablesPluginApprovalForwarding|TestShellHookHostileReview2)$'}
          - {set: r, sub: 1, run: '^(?:TestAIDToolCallShapesDeclareRealContracts|TestConnectorScopedTurnMappingsDoNotCrossKinds|TestHookAPIACLVerdictReusedUntilIdentityChanges|TestPerUserAntigravityHookDeniesWhileTheGatewayIsDown|TestUnixHookFailModeLinesMatchTheSharedGolden)$'}
          - {set: r, sub: 2, run: '^(?:TestAmpToolResultAfterTheGatewayStopsCarriesTheOutageWarning|TestCorrelationProfileVersionGateFailsClosed|TestHookContractLockLifecycleRewritesOnlyRegeneratedFields|TestPerUserStrictOutageBlockNamesTheStoppedGatewayAndTheStartStep|TestValidatePluginRootChain_WorldWritable)$'}
          - {set: r, sub: 3, run: '^(?:TestClaudeCodeCapabilitiesExposeResolvedInventoryAndTelemetry|TestCursorHook_MissingTokenFailsClosedEvenWhenOpenRequested|TestHookScriptOwner_BuiltinSurface|TestPluginStartupGuardRetriesWithoutRestart|TestWindowsCodexAdoptRequirementsKeepsAdministratorManagedDir)$'}
          - {set: r, sub: 4, run: '^(?:TestClaudeCode_TeardownCleansDefenseClawOtelFromContaminatedPristineEnv|TestEnsurePluginCacheDir_CreatesAndTightens|TestKiroWindowsManagedHookContract|TestReconcileWindowsCodexRequirementsReplacesTheOneZeroHookSet|TestWindowsCodexMachinePrerequisitesDecoupleClaudeEffectivePolicy)$'}
          - {set: r, sub: 5, run: '^(?:TestClaudeHookResponseOptimizationKeepsMalformedRepliesClosed|TestHardeningReadStdinCappedRefusesNULAndOverflowExactly|TestManagedDisabledHookTombstoneUsesManagedRuntimeDescriptor|TestRemoveUnshippedConnectorFiles|TestWindowsCodexUninstallTakesTheEarlierSessionStartShape)$'}
          - {set: r, sub: 6, run: '^(?:TestCodexCorrelationProfileSupportsExactReviewedHookContracts|TestHermesExecutionProbeBoundsInheritedStdout|TestMembershipIDsCannotBeDeclaredAsMirrorProof|TestResolveWindowsCodexManagedRuntimeRegistryCleanAbsenceIsNoop|TestWriteManagedTargetRuntimeFileReplacesHardLinkedMatch)$'}
          - {set: r, sub: 7, run: '^(?:TestCodexRequirementsAdminConflictIsTypedAndReadOnly|TestHermesRegistrationRequiresExecutableProbe|TestNativeTelemetryBindingModesAreExplicit|TestSafeOpenPluginSO_HappyPath)$'}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
      - run: make plugin
      - run: make dev-pycli
      - run: make sync-openclaw-extension
      - name: Run the slice
        timeout-minutes: 11
        env:
          SET: ${{ matrix.set }}
          RUN: ${{ matrix.run }}
        run: |
          set -uo pipefail
          echo "$RUN" | tr '|' '\n'
          race=()
          [ "$SET" = r ] && race=(-race -gcflags=modernc.org/...=-d=checkptr=0)
          timeout -k 15 540 go test -v "${race[@]}" -count=1 -timeout 8m ./internal/gateway/connector -run "$RUN"
