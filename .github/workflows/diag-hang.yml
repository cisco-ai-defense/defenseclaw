name: Diag runner hang

# Temporary diagnostic: bisects the tests of the two jobs that take the
# runner down on PRs into release-defenseclaw-enterprise-26.11.1
# (Connector Matrix part 0, no -race; Go shard 2, -race). Each job runs one
# slice; the slice whose runner dies holds the culprit.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.set }} ${{ matrix.sub }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {set: m, sub: claudecode, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: claudecode-cursor, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: codex, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: codex-mismatch, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: cursor, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: copilot, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: devin, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: kiro, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: hermes, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: antigravity, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: inspect-tool, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: inspect-request, run: '^TestShellHookBehaviourMatchesGolden$'}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
      - run: make plugin
      - run: make dev-pycli
      - run: make sync-openclaw-extension
      - name: Runner processes
        run: |
          ps -eo pid,ppid,pgid,sid,comm | head -30
          echo "step shell: pid $$ pgid $(ps -o pgid= -p $$) sid $(ps -o sid= -p $$)"
      - name: Run the slice
        timeout-minutes: 11
        shell: bash {0}
        env:
          SUB: ${{ matrix.sub }}
          RUN: ${{ matrix.run }}
        run: |
          set -u
          go test -c -o "$RUNNER_TEMP/connector.test" ./internal/gateway/connector
          cd internal/gateway/connector
          nproc; sysctl net.ipv4.ip_local_port_range net.ipv4.tcp_tw_reuse net.ipv4.tcp_fin_timeout
          mon="$RUNNER_TEMP/monitor.log"
          ( while :; do
              { echo "=== $(date -u +%T) load $(cut -d' ' -f1-4 /proc/loadavg) procs $(ps -e --no-headers | wc -l)"
                ss -s | sed -n 1,3p
                echo "tcp states: $(ss -tan | awk 'NR>1{print $1}' | sort | uniq -c | tr '\n' ' ')"
                free -m | sed -n 2p
                ps -eo pid,pcpu,rss,etime,args --sort=-pcpu | sed -n 2,6p | cut -c1-160
              } >> "$mon" 2>&1
              sleep 10
            done ) &
          monitor=$!
          bin="$RUNNER_TEMP/connector.test"
          args=(-test.v -test.count=1 -test.timeout 8m -test.run "$RUN")
          DC_HOOK_GOLDEN_ONLY="${SUB}/" timeout -k 15 540 "$bin" "${args[@]}"; rc=$?
          kill "$monitor"
          echo "exit $rc"
          echo "=== monitor"; cat "$mon"
          exit "$rc"
