name: Diag runner hang

# Temporary diagnostic: bisects the tests of the two jobs that take the
# runner down on PRs into release-defenseclaw-enterprise-26.11.1
# (Connector Matrix part 0, no -race; Go shard 2, -race). Each job runs one
# slice; the slice whose runner dies holds the culprit.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.set }} ${{ matrix.sub }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {set: m, sub: setsid, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: strace, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: workers1, run: '^TestShellHookBehaviourMatchesGolden$'}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
      - run: make plugin
      - run: make dev-pycli
      - run: make sync-openclaw-extension
      - name: Runner processes
        run: ps -eo pid,ppid,pgid,sid,comm | head -30; echo "step shell: pid $$ pgid $(ps -o pgid= -p $$) sid $(ps -o sid= -p $$)"
      - name: Run the slice
        timeout-minutes: 11
        env:
          SUB: ${{ matrix.sub }}
          RUN: ${{ matrix.run }}
        run: |
          set -uo pipefail
          go test -c -o "$RUNNER_TEMP/connector.test" ./internal/gateway/connector
          cd internal/gateway/connector
          trace="$RUNNER_TEMP/signals.trace"
          case "$SUB" in
            setsid) timeout -k 15 480 setsid --wait "$RUNNER_TEMP/connector.test" -test.v -test.count=1 -test.timeout 7m -test.run "$RUN"; rc=$? ;;
            strace)
              sudo apt-get install -y -qq strace >/dev/null 2>&1 || true
              timeout -k 15 480 setsid --wait strace -f -qq -e trace=kill,tkill,tgkill,pidfd_send_signal,setsid,setpgid -o "$trace" \
                "$RUNNER_TEMP/connector.test" -test.v -test.count=1 -test.timeout 7m -test.run "$RUN"; rc=$?
              echo "=== signal syscalls ($(wc -l < "$trace") lines), excluding signal 0 and successful self-tgkill:"
              grep -vE 'kill\([0-9]+, 0\)|, 0\) += 0|SIGURG' "$trace" | head -200
              echo "=== kill() to pid <= 0 or -1:"
              grep -E '(kill|pidfd_send_signal)\((-[0-9]+|0),' "$trace" | head -50 ;;
            workers1) DC_HOOK_GOLDEN_WORKERS=1 timeout -k 15 540 "$RUNNER_TEMP/connector.test" -test.v -test.count=1 -test.timeout 8m -test.run "$RUN"; rc=$? ;;
          esac
          echo "exit $rc"
          exit "$rc"
