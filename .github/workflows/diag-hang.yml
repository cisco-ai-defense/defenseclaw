name: Diag runner hang

# Temporary diagnostic: bisects the tests of the two jobs that take the
# runner down on PRs into release-defenseclaw-enterprise-26.11.1
# (Connector Matrix part 0, no -race; Go shard 2, -race). Each job runs one
# slice; the slice whose runner dies holds the culprit.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.set }} ${{ matrix.sub }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {set: m, sub: cc-empty, only: 'claudecode-cursor/managed-closed/PreToolUse/allow/stdin-empty', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: cc-not-json, only: 'claudecode-cursor/managed-closed/PreToolUse/allow/stdin-not-json', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: cc-nul, only: 'claudecode-cursor/managed-closed/PreToolUse/allow/stdin-nul', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: cc-trailing-nl, only: 'claudecode-cursor/managed-closed/PreToolUse/allow/stdin-trailing-nl', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: cc-nested-event, only: 'claudecode-cursor/managed-closed/PreToolUse/allow/stdin-nested-event', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: cc-over-transport, only: 'claudecode-cursor/managed-closed/PreToolUse/allow/stdin-over-transport', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: cc-over-cap, only: 'claudecode-cursor/managed-closed/PreToolUse/allow/stdin-over-cap', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: cc-answers, only: 'claudecode-cursor/managed-closed/PreToolUse/unreachable', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: ag-empty, only: 'antigravity/managed-closed/PreToolUse/allow/stdin-empty', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: ag-not-json, only: 'antigravity/managed-closed/PreToolUse/allow/stdin-not-json', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: ag-nul, only: 'antigravity/managed-closed/PreToolUse/allow/stdin-nul', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: ag-trailing-nl, only: 'antigravity/managed-closed/PreToolUse/allow/stdin-trailing-nl', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: ag-nested-event, only: 'antigravity/managed-closed/PreToolUse/allow/stdin-nested-event', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: ag-over-transport, only: 'antigravity/managed-closed/PreToolUse/allow/stdin-over-transport', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: ag-over-cap, only: 'antigravity/managed-closed/PreToolUse/allow/stdin-over-cap', run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: m, sub: ag-answers, only: 'antigravity/managed-closed/PreToolUse/unreachable', run: '^TestShellHookBehaviourMatchesGolden$'}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
      - run: make plugin
      - run: make dev-pycli
      - run: make sync-openclaw-extension
      - name: Runner processes
        run: |
          ps -eo pid,ppid,pgid,sid,comm | head -30
          echo "step shell: pid $$ pgid $(ps -o pgid= -p $$) sid $(ps -o sid= -p $$)"
      - name: Run the slice
        timeout-minutes: 11
        shell: bash {0}
        env:
          SUB: ${{ matrix.sub }}
          ONLY: ${{ matrix.only }}
          RUN: ${{ matrix.run }}
        run: |
          set -u
          go test -c -o "$RUNNER_TEMP/connector.test" ./internal/gateway/connector
          cd internal/gateway/connector
          df -h / /tmp; mount | grep -E ' /tmp | / ' ; swapon --show; free -m
          mon="$RUNNER_TEMP/monitor.log"
          ( while :; do
              { echo "=== $(date -u +%T) load $(cut -d' ' -f1-4 /proc/loadavg) procs $(ps -e --no-headers | wc -l)"
                df -m / /tmp | tail -n +2
                du -sm /tmp 2>/dev/null | tail -1
                free -m | sed -n 2,3p
                ps -eo pid,pcpu,rss,etime,args --sort=-rss | sed -n 2,4p | cut -c1-160
              } >> "$mon" 2>&1
              sleep 5
            done ) &
          monitor=$!
          bin="$RUNNER_TEMP/connector.test"
          args=(-test.v -test.count=1 -test.timeout 8m -test.run "$RUN")
          DC_HOOK_GOLDEN_ONLY="$ONLY" timeout -k 15 540 "$bin" "${args[@]}"; rc=$?
          kill "$monitor"
          echo "exit $rc"
          echo "=== monitor"; cat "$mon"
          exit "$rc"
