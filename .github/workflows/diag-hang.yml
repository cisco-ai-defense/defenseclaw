name: Diag runner hang

# Temporary diagnostic: bisects the tests of the two jobs that take the
# runner down on PRs into release-defenseclaw-enterprise-26.11.1
# (Connector Matrix part 0, no -race; Go shard 2, -race). Each job runs one
# slice; the slice whose runner dies holds the culprit.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.set }} ${{ matrix.sub }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {set: m, sub: ClaudeCodeLauncherGuardA, run: '^TestClaudeCodeLauncherGuardArgvStartsOnlyTheClaudeHookOfADefenseClawLauncher$'}
          - {set: m, sub: CursorHook_StrictMissing, run: '^TestCursorHook_StrictMissingTokenBlocks$'}
          - {set: m, sub: HookAPITokenWindowsRejec, run: '^TestHookAPITokenWindowsRejectsDeleteChildOnSharedAncestor$'}
          - {set: m, sub: ManagedFileBackup_SkipsW, run: '^TestManagedFileBackup_SkipsWhenUserEditedAfterSetup$'}
          - {set: m, sub: ShellHookBehaviourMatche, run: '^TestShellHookBehaviourMatchesGolden$'}
          - {set: r, sub: s22a, run: '^(?:TestAIDToolCallShapesDeclareRealContracts|TestAmpToolResultAfterTheGatewayStopsCarriesTheOutageWarning|TestClaudeCodeCapabilitiesExposeResolvedInventoryAndTelemetry|TestClaudeCode_TeardownCleansDefenseClawOtelFromContaminatedPristineEnv|TestClaudeHookResponseOptimizationKeepsMalformedRepliesClosed|TestCodexCorrelationProfileSupportsExactReviewedHookContracts|TestCodexRequirementsAdminConflictIsTypedAndReadOnly|TestCodex_Route_PassthroughNonChat|TestConnectorScopedTurnMappingsDoNotCrossKinds|TestCorrelationProfileVersionGateFailsClosed|TestCursorHook_MissingTokenFailsClosedEvenWhenOpenRequested|TestEnsurePluginCacheDir_CreatesAndTightens|TestHardeningReadStdinCappedRefusesNULAndOverflowExactly|TestHermesExecutionProbeBoundsInheritedStdout|TestHermesRegistrationRequiresExecutableProbe|TestHermesWriteViewRetarget|TestHookAPIACLVerdictReusedUntilIdentityChanges|TestHookContractLockLifecycleRewritesOnlyRegeneratedFields|TestHookScriptOwner_BuiltinSurface|TestKiroWindowsManagedHookContract|TestManagedDisabledHookTombstoneUsesManagedRuntimeDescriptor|TestMembershipIDsCannotBeDeclaredAsMirrorProof|TestNativeTelemetryBindingModesAreExplicit|TestOpenClaw_Setup_HILTEnablesPluginApprovalForwarding|TestPerUserAntigravityHookDeniesWhileTheGatewayIsDown|TestPerUserStrictOutageBlockNamesTheStoppedGatewayAndTheStartStep|TestPluginStartupGuardRetriesWithoutRestart|TestReconcileWindowsCodexRequirementsReplacesTheOneZeroHookSet|TestRemoveUnshippedConnectorFiles|TestResolveWindowsCodexManagedRuntimeRegistryCleanAbsenceIsNoop|TestSafeOpenPluginSO_HappyPath|TestShellHookHostileReview2|TestUnixHookFailModeLinesMatchTheSharedGolden|TestValidatePluginRootChain_WorldWritable|TestWindowsCodexAdoptRequirementsKeepsAdministratorManagedDir|TestWindowsCodexMachinePrerequisitesDecoupleClaudeEffectivePolicy|TestWindowsCodexUninstallTakesTheEarlierSessionStartShape|TestWriteManagedTargetRuntimeFileReplacesHardLinkedMatch)$'}
          - {set: r, sub: s22b, run: '^(?:TestAIDToolCallShapesDeclareRealContracts|TestAmpToolResultAfterTheGatewayStopsCarriesTheOutageWarning|TestClaudeCodeCapabilitiesExposeResolvedInventoryAndTelemetry|TestClaudeCode_TeardownCleansDefenseClawOtelFromContaminatedPristineEnv|TestClaudeHookResponseOptimizationKeepsMalformedRepliesClosed|TestCodexCorrelationProfileSupportsExactReviewedHookContracts|TestCodexRequirementsAdminConflictIsTypedAndReadOnly|TestCodex_Route_PassthroughNonChat|TestConnectorScopedTurnMappingsDoNotCrossKinds|TestCorrelationProfileVersionGateFailsClosed|TestCursorHook_MissingTokenFailsClosedEvenWhenOpenRequested|TestEnsurePluginCacheDir_CreatesAndTightens|TestHardeningReadStdinCappedRefusesNULAndOverflowExactly|TestHermesExecutionProbeBoundsInheritedStdout|TestHermesRegistrationRequiresExecutableProbe|TestHermesWriteViewRetarget|TestHookAPIACLVerdictReusedUntilIdentityChanges|TestHookContractLockLifecycleRewritesOnlyRegeneratedFields|TestHookScriptOwner_BuiltinSurface|TestKiroWindowsManagedHookContract|TestManagedDisabledHookTombstoneUsesManagedRuntimeDescriptor|TestMembershipIDsCannotBeDeclaredAsMirrorProof|TestNativeTelemetryBindingModesAreExplicit|TestOpenClaw_Setup_HILTEnablesPluginApprovalForwarding|TestPerUserAntigravityHookDeniesWhileTheGatewayIsDown|TestPerUserStrictOutageBlockNamesTheStoppedGatewayAndTheStartStep|TestPluginStartupGuardRetriesWithoutRestart|TestReconcileWindowsCodexRequirementsReplacesTheOneZeroHookSet|TestRemoveUnshippedConnectorFiles|TestResolveWindowsCodexManagedRuntimeRegistryCleanAbsenceIsNoop|TestSafeOpenPluginSO_HappyPath|TestShellHookHostileReview2|TestUnixHookFailModeLinesMatchTheSharedGolden|TestValidatePluginRootChain_WorldWritable|TestWindowsCodexAdoptRequirementsKeepsAdministratorManagedDir|TestWindowsCodexMachinePrerequisitesDecoupleClaudeEffectivePolicy|TestWindowsCodexUninstallTakesTheEarlierSessionStartShape|TestWriteManagedTargetRuntimeFileReplacesHardLinkedMatch)$'}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
      - run: make plugin
      - run: make dev-pycli
      - run: make sync-openclaw-extension
      - name: Run the slice
        timeout-minutes: 11
        env:
          SET: ${{ matrix.set }}
          RUN: ${{ matrix.run }}
        run: |
          set -uo pipefail
          echo "$RUN" | tr '|' '\n'
          race=()
          [ "$SET" = r ] && race=(-race -gcflags=modernc.org/...=-d=checkptr=0)
          timeout -k 15 540 go test -v "${race[@]}" -count=1 -timeout 8m ./internal/gateway/connector -run "$RUN"
