name: Diag runner hang

# Temporary diagnostic: bisects the tests of the two jobs that take the
# runner down on PRs into release-defenseclaw-enterprise-26.11.1
# (Connector Matrix part 0, no -race; Go shard 2, -race). Each job runs one
# slice; the slice whose runner dies holds the culprit.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.set }} ${{ matrix.slice }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {set: m0, slice: 0, slices: 8}
          - {set: m0, slice: 1, slices: 8}
          - {set: m0, slice: 2, slices: 8}
          - {set: m0, slice: 3, slices: 8}
          - {set: m0, slice: 4, slices: 8}
          - {set: m0, slice: 5, slices: 8}
          - {set: m0, slice: 6, slices: 8}
          - {set: m0, slice: 7, slices: 8}
          - {set: s2, slice: 0, slices: 6}
          - {set: s2, slice: 1, slices: 6}
          - {set: s2, slice: 2, slices: 6}
          - {set: s2, slice: 3, slices: 6}
          - {set: s2, slice: 4, slices: 6}
          - {set: s2, slice: 5, slices: 6}
          - {set: s2pkgs, slice: 0, slices: 1}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
      - run: make plugin
      - run: make dev-pycli
      - run: make sync-openclaw-extension
      - name: Run the slice
        timeout-minutes: 11
        env:
          SET: ${{ matrix.set }}
          SLICE: ${{ matrix.slice }}
          SLICES: ${{ matrix.slices }}
        run: |
          set -uo pipefail
          go list ./... > "$RUNNER_TEMP/go-packages.txt"
          python3 scripts/go_test_shards.py --packages-file "$RUNNER_TEMP/go-packages.txt" \
            --exclude github.com/defenseclaw/defenseclaw/internal/audit \
            --exclude github.com/defenseclaw/defenseclaw/internal/gateway \
            --timings scripts/test-timings/go-linux.json --shard-count 12 --shard-index 2 > "$RUNNER_TEMP/go-shard.txt"
          slice() { # slice <regex>: the SLICE-th of SLICES name groups, as a -run regex
            sed -E 's/^\^\(\?://; s/\)\$$//' | tr '|' '\n' | sort -u |
              awk -v n="$SLICES" -v i="$SLICE" 'NR % n == i' | paste -sd'|' - | sed -E 's/^/^(?:/; s/$/)$/'
          }
          case "$SET" in
            m0)
              run="$(python3 scripts/go_test_shards.py --package-dir internal/gateway/connector \
                --match 'Connector|Hook|CodeGuard|Telemetry|OTLP|AgentHook|Mode|Setup|Teardown|Capability|Matrix' \
                --timings scripts/test-timings/go-linux.json --shard-count 4 --shard-index 0 | slice)"
              echo "$run" | tr '|' '\n' | sed 's/^/  /'
              timeout -k 15 540 go test -v -count=1 -timeout 8m ./internal/gateway/connector -run "$run"
              ;;
            s2)
              run="$(grep -P 'connector\t' "$RUNNER_TEMP/go-shard.txt" | cut -f2 | slice)"
              echo "$run" | tr '|' '\n' | sed 's/^/  /'
              timeout -k 15 540 go test -v -race -gcflags=modernc.org/...=-d=checkptr=0 -count=1 -timeout 8m \
                ./internal/gateway/connector -run "$run"
              ;;
            s2pkgs)
              mapfile -t pkgs < <(grep -vP '\t' "$RUNNER_TEMP/go-shard.txt")
              printf '  %s\n' "${pkgs[@]}"
              timeout -k 15 540 go test -v -race -gcflags=modernc.org/...=-d=checkptr=0 -count=1 -timeout 8m "${pkgs[@]}"
              ;;
          esac
