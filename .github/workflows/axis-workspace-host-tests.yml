name: AXIS workspace host regressions

# Public synthetic Git/filesystem/process fixtures only. No AXIS/PSEC payload.
on:
  push:
    branches: [codex/axis-native-build, codex/axis-peer-experiments]
    paths:
      - .github/workflows/axis-workspace-host-tests.yml
      - internal/openshell/**
      - internal/axis/backend/**
      - internal/gitsafe/**
      - internal/safefile/**
      - internal/winpath/**
      - internal/processutil/**
      - internal/testenv/**
      - internal/scanner/**
      - internal/config/**
      - go.mod
      - go.sum
      - THIRD_PARTY_LICENSES.txt
      - NOTICE
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axis-workspace-host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-regressions:
    name: Workspace host regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact full source and embedded dependencies
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Provision the pinned Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Test native host staging, held assets and shared workspace behavior
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOVERSION)" = "go1.26.5"
          git --version
          go test -race -p 1 ./internal/openshell/workspace ./internal/axis/backend -count=1 -timeout=10m
      - name: Vet the workspace and held asset packages
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
        run: go vet -p 1 ./internal/openshell/workspace ./internal/axis/backend
