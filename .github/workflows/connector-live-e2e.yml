# Live connector hook E2E + upstream regression radar.
#
# This workflow is intentionally SEPARATE from e2e.yml so it can go red
# (an upstream agent shipped a breaking hook change) without blocking the
# OpenClaw stack gate. It has two layers:
#
#   contract-matrix (Layer A) — deterministic, no LLM, no secrets, Unix.
#     Builds DefenseClaw, then feeds golden stdin payloads into the *installed*
#     hook entrypoint for every registry connector and asserts the gateway
#     received the event, the verdict was shaped correctly, and teardown is
#     clean. Fork-safe; runs on pull requests as well — one always-on macOS
#     cell (codex / macOS, intended as a required check) plus the full
#     Linux + macOS matrix when connector code changes. Deterministic native
#     Windows x64 contract checks live in windows-native.yml.
#
#   live-matrix (Layer B) — installs the real upstream agent at its latest
#     version, wires it with `defenseclaw setup`, and drives lifecycle + forced
#     tool events through the real harness. Asserts observe/block/OTLP/teardown
#     using canonical audit.db history and filesystem sentinel side-effects.
#     Needs provider secrets, so it never runs for fork pull requests.
#
#     ROLLOUT STATUS: Layer B is currently manual-only (workflow_dispatch). The
#     nightly schedule runs Layer A alone until the live secrets are in place.
#     Gemini CLI and Copilot remain deferred (their native keys are not yet set
#     and have no Azure/Bedrock substitute). Cursor has a manual native-Windows
#     preview cell using CURSOR_API_KEY; it is not a release-certification cell.
#
#   report — rolls every per-cell result up into the job summary, records the
#     resolved upstream version, and opens/updates a `connector-regression`
#     issue on any live-cell failure. Alert-only: it never auto-bumps an
#     approved version (that stays a deliberate human edit of
#     cli/defenseclaw/inventory/validated_versions.json).
#
# Native Windows x64 release certification remains closed for Claude Code.
# The manual, source-built Windows cells here, including Claude Code, are
# evidence-producing preview checks rather than release certification. Codex,
# Claude Code, Cursor, OpenCode, and Antigravity remain pending authentic
# packaged plus official-client evidence. Deterministic contract checks run in
# windows-native.yml; certification stays closed until those gates are integrated.
# Antigravity's official client uses Windows Credential Manager/browser auth,
# so its real-client cell runs only on a dedicated pre-authenticated runner.
# OmniGent 0.7.0 has a separate advisory packaged native-degraded cell in
# windows-native.yml; it is not scheduled as a green certification cell here.

name: Connector Live E2E

on:
  # Staggered two hours after the e2e.yml 07:00 cron so the two heavy
  # nightly suites do not contend for the same hosted-runner pool.
  schedule:
    - cron: "0 9 * * *"
  # Layer A also gates pull requests. Every PR runs one always-on
  # cross-platform smoke cell (codex / macOS) so there is a required
  # connector signal on each change; when the PR touches connector, hook,
  # registry, contract-script, or this workflow, the run expands to the full
  # supported Linux + macOS matrix. Native Windows PR gates are separate.
  # Layer B (live) stays manual-only and never runs for pull requests.
  pull_request:
  workflow_dispatch:
    inputs:
      connector:
        description: "Connector to run (or 'all')"
        type: choice
        default: all
        options:
          - all
          - codex
          - claudecode
          - opencode
          - geminicli
          - cursor
          - copilot
          - openhands
          - hermes
          - windsurf
          - antigravity
          - omnigent
      os:
        description: "OS to run (or 'all')"
        type: choice
        default: all
        options:
          - all
          - linux
          - macos
          - windows
      version:
        description: "Upstream agent version to install (live layer)"
        type: string
        default: latest
      mode:
        description: "DefenseClaw enforcement mode for live drivers"
        type: choice
        default: action
        options:
          - action
          - observe
      use_azure:
        description: "Route Codex + OpenHands through Azure OpenAI"
        type: boolean
        default: false
      use_bedrock:
        description: "Route Claude Code + OpenHands through Amazon Bedrock"
        type: boolean
        default: false

concurrency:
  group: connector-live-e2e-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level; the report job widens to
# issues: write only where it is actually needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate — decide which contract cells to run for this event.
  #
  #   schedule / workflow_dispatch → full 2-OS x 9 Unix matrix.
  #   pull_request                 → just the always-on macOS smoke cell,
  #                                  unless the PR touches connector / hook /
  #                                  registry / contract-script / workflow
  #                                  surfaces or a Windows release-sensitive
  #                                  surface, in which case → full matrix.
  # ---------------------------------------------------------------------------
  changes:
    name: Select contract cells
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # Need history back to the PR base so the path diff below is accurate.
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The Unix harness retains the full supported connector matrix.
          # Native Windows contract validation is a separate, explicit x64 matrix.
          full='{"os":["ubuntu-latest","macos-latest"],"connector":["codex","claudecode","opencode","geminicli","cursor","copilot","openhands","hermes","windsurf","antigravity","omnigent"]}'
          # Always-on PR smoke: one connector on one cross-platform OS. macOS is
          # chosen because windows-native.yml separately checks the native
          # Windows hook contract on every PR. This adds the missing native macOS
          # connector signal and is the cell to mark "required" in branch
          # protection. Its check name is "Contract codex / macos-latest".
          minimal='{"os":["macos-latest"],"connector":["codex"]}'

          if [ "${EVENT}" != "pull_request" ]; then
            echo "matrix=${full}" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT} -> full matrix"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE_SHA}"...HEAD)"
          echo "Changed files in PR:"
          printf '%s\n' "${changed}"

          # Keep this allowlist anchored and reviewable. The Windows entries are
          # limited to canonical release workflows, native executable/resource
          # payload sources, installer lifecycle/signing/setup helpers, and the
          # native acceptance harness. Contract:
          # cli/tests/test_connector_live_e2e_path_policy.py.
          # BEGIN connector full-matrix path allowlist
          if printf '%s\n' "${changed}" | grep -qE \
            -e '^internal/gateway/connector/' \
            -e '^internal/gateway/sidecar_observability_v8' \
            -e '^internal/audit/' \
            -e '^internal/observability/redaction/' \
            -e '^internal/cli/' \
            -e '^cli/defenseclaw/inventory/' \
            -e '^cli/defenseclaw/commands/cmd_setup\.py$' \
            -e '^cli/defenseclaw/commands/cmd_init\.py$' \
            -e '^test/e2e/' \
            -e '^scripts/live-connector-e2e/' \
            -e '^\.goreleaser\.yaml$' \
            -e '^\.github/workflows/release\.yaml$' \
            -e '^\.github/workflows/windows-native\.yml$' \
            -e '^cmd/(defenseclaw|defenseclaw-hook|defenseclaw-launcher|defenseclaw-setup|defenseclaw-startup)/' \
            -e '^internal/(tools/)?windowsresources/' \
            -e '^cli/defenseclaw/commands/windows_uninstall_helper\.py$' \
            -e '^cli/defenseclaw/windows_acl\.py$' \
            -e '^scripts/(build-windows-installer|initialize-windows-native-ci-paths|install|invoke-windows-setup-standard-user-ci|test-fresh-install-release-windows|test-upgrade-release-windows|test-windows-disposable-user-safety|test-windows-setup-wizard|upgrade|windows-authenticode|windows-binary-identity|windows-disposable-user-safety|windows-native-ci|windows-native-paths)\.ps1$' \
            -e '^scripts/validate_packaged_v8_resources\.py$' \
            -e '^scripts/windows_installer_artifacts\.py$' \
            -e '^scripts/windows-(disposable-file-guard|disposable-standard-user-launcher|setup-standard-user-launcher)\.cs$' \
            -e '^\.github/workflows/connector-live-e2e\.yml$'; then
            echo "matrix=${full}" >> "$GITHUB_OUTPUT"
            echo "connector/release-sensitive change -> full Linux + macOS matrix"
          else
            echo "matrix=${minimal}" >> "$GITHUB_OUTPUT"
            echo "no connector/release-sensitive change -> macOS codex smoke only"
          fi
          # END connector full-matrix path allowlist

  # ---------------------------------------------------------------------------
  # Layer A — deterministic Unix contract matrix (no secrets).
  # ---------------------------------------------------------------------------
  contract-matrix:
    name: Contract ${{ matrix.connector }} / ${{ matrix.os }}
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DC_E2E_RESULTS: ${{ github.workspace }}/connector-live-e2e-results.jsonl
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Select cell + resolve OS label
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONNECTOR: ${{ inputs.connector }}
          INPUT_OS: ${{ inputs.os }}
          MATRIX_CONNECTOR: ${{ matrix.connector }}
        run: |
          case "${RUNNER_OS}" in
            Linux)   dcos=linux ;;
            macOS)   dcos=macos ;;
            *)       dcos=unknown ;;
          esac
          echo "DC_E2E_OS=${dcos}" >> "$GITHUB_ENV"

          run=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            in_conn="${INPUT_CONNECTOR}"
            in_os="${INPUT_OS}"
            [ "${in_conn}" = "all" ] || [ "${in_conn}" = "${MATRIX_CONNECTOR}" ] || run=false
            [ "${in_os}" = "all" ] || [ "${in_os}" = "${dcos}" ] || run=false
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "cell ${{ matrix.connector }}/${dcos} selected=${run}"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.select.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: steps.select.outputs.run == 'true'

      # Build + install the Python CLI and Go gateway. `make install` runs
      # sync-openclaw-extension (drops the //go:embed placeholder so the
      # gateway compiles without the TS plugin) and skips the OpenClaw plugin
      # entirely because CONNECTOR is not openclaw — hook connectors do not
      # need it. We do NOT run `make plugin` here for the same reason.
      - name: Install DefenseClaw
        if: steps.select.outputs.run == 'true'
        run: make install

      - name: Put DefenseClaw on PATH
        if: steps.select.outputs.run == 'true'
        run: |
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          if [ -d "${{ github.workspace }}/.venv/bin" ]; then
            echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          fi
          # Windows uv venvs expose entry points under Scripts/, not bin/.
          if [ -d "${{ github.workspace }}/.venv/Scripts" ]; then
            echo "${{ github.workspace }}/.venv/Scripts" >> "$GITHUB_PATH"
          fi

      - name: Install official OmniGent contract runtime
        if: steps.select.outputs.run == 'true' && matrix.connector == 'omnigent'
        run: |
          uv python install 3.12
          omnigent_python="$(uv python find --managed-python 3.12)"
          uv tool install --python "${omnigent_python}" --force omnigent==0.7.0
          omnigent_python="$("${omnigent_python}" -I -c \
            'import os, sys; print(os.path.realpath(sys.executable))')"
          printf 'DEFENSECLAW_TRUSTED_BIN_PREFIXES=%s\n' \
            "$(dirname "${omnigent_python}")" >> "$GITHUB_ENV"

      # Deterministic Go contract tests for this connector. The shared
      # connector lifecycle / observability / verify matrices are
      # connector-parameterized; filtering with -run to the active cell makes
      # a failure point at exactly which connector regressed. A connector with
      # no dedicated subtest matches nothing and `go test` exits 0, so the
      # golden-payload smoke below is its real Layer-A coverage.
      - name: Go contract tests
        if: steps.select.outputs.run == 'true'
        run: |
          go test -count=1 ./test/e2e/ \
            -run "TestConnectorLifecycle_Matrix/${{ matrix.connector }}|TestV7Observability_DestinationAppPerConnector/${{ matrix.connector }}|TestConnectorVerifyCleanOnFreshDataDir/${{ matrix.connector }}|TestGoldenPerConnectorLayout"

      # Golden-payload entrypoint smoke: feed each registry event into the
      # installed Unix hook entrypoint and assert fire + verdict shaping +
      # clean teardown. Native Windows uses the dedicated windows-native.yml.
      - name: Contract entrypoint smoke
        if: steps.select.outputs.run == 'true'
        # Layer A runs agent-less, so the cached agent version is empty and the
        # gateway resolves an "unversioned" hook contract. In action mode the
        # gateway refuses to wire the connector (and thus never writes
        # ~/.defenseclaw/hooks/<connector>-hook.sh) unless drift is accepted,
        # which would make every golden-payload hook invocation exit 127. This
        # is the intended no-agent/exploratory case, so opt in here. Belt and
        # suspenders with the export in contract-smoke.sh, in case the gateway
        # daemon is spawned without inheriting the script's environment.
        env:
          DEFENSECLAW_ALLOW_HOOK_CONTRACT_DRIFT: "1"
        run: bash scripts/live-connector-e2e/run.sh --layer contract --connector "${{ matrix.connector }}"

      - name: Upload contract results
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-results-contract-${{ matrix.connector }}-${{ env.DC_E2E_OS }}
          path: ${{ env.DC_E2E_RESULTS }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload contract logs on failure
        if: ${{ failure() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-logs-contract-${{ matrix.connector }}-${{ env.DC_E2E_OS }}
          path: ${{ runner.temp }}/defenseclaw-live-e2e-logs/**
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Layer B — live agent matrix (real agents, secrets, nightly/dispatch).
  # Never runs for fork pull requests: provider secrets must not be exposed to
  # untrusted code, mirroring the full-live gate in e2e.yml.
  # ---------------------------------------------------------------------------
  live-matrix:
    name: Live ${{ matrix.connector }} / ${{ matrix.os }}
    # Manual-only for now: the nightly schedule runs Layer A (contract) alone
    # until live provider secrets are in place. Trigger this layer explicitly
    # via "Run workflow" once keys exist.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        # The reality matrix: which agents have a headless CLI that fires hooks
        # on which OS. Hermes needs no model credential: its official
        # `hermes hooks test` command exercises the genuine shell-hook parser
        # and process boundary. Windsurf and Antigravity remain Layer-A only
        # here. Native Windows candidate evidence is handled below; an unrun or
        # failed cell proves nothing.
        #
        # Credential-gated cells remain in the matrix so their absence is
        # explicit rather than being mistaken for live coverage. In
        # particular, an absent COPILOT_CLI_TOKEN makes that macOS cell
        # fail/skip visibly and cannot promote validated_versions.json.
        include:
          - { connector: codex,      os: ubuntu-latest,  dcos: linux }
          - { connector: codex,      os: macos-latest,   dcos: macos }
          - { connector: claudecode, os: ubuntu-latest,  dcos: linux }
          - { connector: claudecode, os: macos-latest,   dcos: macos }
          - { connector: opencode,   os: macos-latest,   dcos: macos }
          - { connector: hermes,     os: macos-latest,   dcos: macos }
          - { connector: copilot,    os: macos-latest,   dcos: macos }
          - { connector: cursor,     os: macos-latest,   dcos: macos }
          # OpenHands needs the Docker runtime, so it is Linux-only.
          - { connector: openhands,  os: ubuntu-latest,  dcos: linux }
          # OpenHands CLI/headless uses the local SDK workspace. Docker is
          # required for `openhands serve`, not for this official CLI path.
          - { connector: openhands,  os: macos-latest,   dcos: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      DC_E2E_OS: ${{ matrix.dcos }}
      DC_E2E_RESULTS: ${{ github.workspace }}/connector-live-e2e-results.jsonl
      DC_DRIVER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'action' }}
      DC_E2E_AGENT_VERSION_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
      # Non-secret provider configuration can stay at job scope. Provider
      # secrets are scoped to the credentialed driver steps below so
      # no-credential connectors do not inherit unrelated keys.
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Optional Bedrock model-id overrides (non-secret config Variables).
      CLAUDE_BEDROCK_MODEL: ${{ vars.CLAUDE_BEDROCK_MODEL }}
      OPENHANDS_BEDROCK_MODEL: ${{ vars.OPENHANDS_BEDROCK_MODEL }}
      # Provider-selection flags. A dispatch toggle wins; otherwise the repo
      # Variable (DC_USE_AZURE / DC_USE_BEDROCK = "1") makes it the default for
      # nightly runs; otherwise off (use the direct provider keys).
      DC_USE_AZURE: ${{ inputs.use_azure && '1' || vars.DC_USE_AZURE || '0' }}
      DC_USE_BEDROCK: ${{ inputs.use_bedrock && '1' || vars.DC_USE_BEDROCK || '0' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Select cell
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONNECTOR: ${{ inputs.connector }}
          INPUT_OS: ${{ inputs.os }}
          MATRIX_CONNECTOR: ${{ matrix.connector }}
          MATRIX_OS: ${{ matrix.dcos }}
          CURSOR_API_KEY: ${{ matrix.connector == 'cursor' && secrets.CURSOR_API_KEY || '' }}
        run: |
          run=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            in_conn="${INPUT_CONNECTOR}"
            in_os="${INPUT_OS}"
            [ "${in_conn}" = "all" ] || [ "${in_conn}" = "${MATRIX_CONNECTOR}" ] || run=false
            [ "${in_os}" = "all" ] || [ "${in_os}" = "${MATRIX_OS}" ] || run=false
          fi
          if [ "${MATRIX_CONNECTOR}" = "cursor" ] && [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "Cursor cell skipped: CURSOR_API_KEY is not configured"
            run=false
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "cell ${{ matrix.connector }}/${{ matrix.dcos }} selected=${run}"

      - name: Isolate Hermes home
        if: steps.select.outputs.run == 'true' && matrix.connector == 'hermes'
        run: echo "HERMES_HOME=${RUNNER_TEMP}/hermes-home-${{ matrix.connector }}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.select.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: steps.select.outputs.run == 'true'

      # Most live agents use npm and OpenHands uses its official Python 3.12
      # package. Claude's Windows lane uses Anthropic's native PowerShell
      # installer; Node and uv remain required by the other matrix cells.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.select.outputs.run == 'true'
        with:
          node-version: "24"

      - name: Install DefenseClaw
        if: steps.select.outputs.run == 'true'
        run: make install

      - name: Put DefenseClaw on PATH
        if: steps.select.outputs.run == 'true'
        run: |
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          if [ -d "${{ github.workspace }}/.venv/bin" ]; then
            echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          fi
          if [ -d "${{ github.workspace }}/.venv/Scripts" ]; then
            echo "${{ github.workspace }}/.venv/Scripts" >> "$GITHUB_PATH"
          fi

      # Initialize DefenseClaw without exposing provider secrets to every
      # connector cell. Credentialed drivers append their own scoped keys before
      # starting the gateway.
      - name: Initialize DefenseClaw env
        if: steps.select.outputs.run == 'true'
        run: |
          defenseclaw init
          mkdir -p "${HOME}/.defenseclaw"
          touch "${HOME}/.defenseclaw/.env"

      # For Cursor, confirm headless `agent -p` actually fires
      # ~/.cursor/hooks.json before spending a full live run on it. If hooks
      # never reach the gateway, the live driver is skipped (recorded as a
      # skip) and Cursor stays Layer-A only for this cell.
      - name: Validate Cursor headless hooks
        id: cursor_validate
        if: ${{ steps.select.outputs.run == 'true' && matrix.connector == 'cursor' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: bash scripts/live-connector-e2e/cursor-validation.sh
        continue-on-error: true

      - name: Live driver
        if: ${{ steps.select.outputs.run == 'true' && !(matrix.connector == 'cursor' && steps.cursor_validate.outputs.cursor_hooks_fire == '0') }}
        env:
          OPENAI_API_KEY: ${{ contains(fromJSON('["codex","opencode","openhands"]'), matrix.connector) && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.connector == 'claudecode' && secrets.ANTHROPIC_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ matrix.connector == 'geminicli' && secrets.GOOGLE_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.connector == 'geminicli' && secrets.GOOGLE_API_KEY || '' }}
          CURSOR_API_KEY: ${{ matrix.connector == 'cursor' && secrets.CURSOR_API_KEY || '' }}
          COPILOT_GITHUB_TOKEN: ${{ matrix.connector == 'copilot' && secrets.COPILOT_GITHUB_TOKEN || '' }}
          LLM_API_KEY: ${{ matrix.connector == 'openhands' && secrets.LLM_API_KEY || '' }}
          AZURE_OPENAI_API_KEY: ${{ contains(fromJSON('["codex","openhands"]'), matrix.connector) && secrets.AZURE_OPENAI_API_KEY || '' }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ contains(fromJSON('["claudecode","openhands"]'), matrix.connector) && secrets.AWS_BEARER_TOKEN_BEDROCK || '' }}
          AWS_ACCESS_KEY_ID: ${{ contains(fromJSON('["claudecode","openhands"]'), matrix.connector) && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ contains(fromJSON('["claudecode","openhands"]'), matrix.connector) && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AWS_SESSION_TOKEN: ${{ contains(fromJSON('["claudecode","openhands"]'), matrix.connector) && secrets.AWS_SESSION_TOKEN || '' }}
        run: bash scripts/live-connector-e2e/run.sh --layer live --connector "${{ matrix.connector }}"

      - name: Upload live results
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-results-live-${{ matrix.connector }}-${{ matrix.dcos }}
          path: ${{ env.DC_E2E_RESULTS }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload live logs on failure
        if: ${{ failure() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-logs-live-${{ matrix.connector }}-${{ matrix.dcos }}
          path: ${{ runner.temp }}/defenseclaw-live-e2e-logs/**
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Teardown safety net
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        run: |
          defenseclaw-gateway connector teardown --connector "${{ matrix.connector }}" 2>/dev/null || true
          defenseclaw-gateway stop 2>/dev/null || true
          rm -rf "${HOME}/.defenseclaw" 2>/dev/null || true

  windows-live:
    name: Windows x64 live / ${{ matrix.connector }}
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        connector: [codex, claudecode, cursor, opencode]
    env:
      DC_WINDOWS_STATE: ${{ github.workspace }}/.dc-e2e-${{ matrix.connector }}-live
      DC_E2E_RESULTS: ${{ github.workspace }}/connector-live-e2e-results.jsonl
      CODEX_VERSION: ${{ inputs.version }}
      CLAUDE_VERSION: ${{ inputs.version }}
      OPENCODE_VERSION: ${{ inputs.version }}
    steps:
      - name: Select requested Windows connector
        id: select
        shell: pwsh
        env:
          INPUT_CONNECTOR: ${{ inputs.connector }}
          MATRIX_CONNECTOR: ${{ matrix.connector }}
        run: |
          $selected = $env:INPUT_CONNECTOR -eq 'all' -or $env:INPUT_CONNECTOR -eq $env:MATRIX_CONNECTOR
          "run=$($selected.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: steps.select.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.select.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: steps.select.outputs.run == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.select.outputs.run == 'true'
        with:
          node-version: '24'
      - name: Build native DefenseClaw tools
        if: steps.select.outputs.run == 'true'
        shell: pwsh
        run: |
          $embed = Join-Path $env:GITHUB_WORKSPACE 'internal\gateway\connector\openclaw_extension'
          New-Item -ItemType Directory -Force -Path $embed | Out-Null
          Set-Content -LiteralPath (Join-Path $embed '.placeholder') -Value 'OpenClaw extension not built.'
          $bin = Join-Path $env:RUNNER_TEMP 'defenseclaw-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          go build -o (Join-Path $bin 'defenseclaw-gateway.exe') ./cmd/defenseclaw
          go build -ldflags '-H=windowsgui' -o (Join-Path $bin 'defenseclaw-hook.exe') ./cmd/defenseclaw-hook
          uv sync
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Native Windows live harness
        if: steps.select.outputs.run == 'true'
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ contains(fromJSON('["codex","opencode"]'), matrix.connector) && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.connector == 'claudecode' && secrets.ANTHROPIC_API_KEY || '' }}
          CURSOR_API_KEY: ${{ matrix.connector == 'cursor' && secrets.CURSOR_API_KEY || '' }}
        run: |
          ./scripts/live-connector-e2e/run-windows.ps1 `
            -Layer live `
            -Connector '${{ matrix.connector }}' `
            -StateRoot $env:DC_WINDOWS_STATE `
            -ResultsPath $env:DC_E2E_RESULTS `
            -ArtifactPath (Join-Path $env:RUNNER_TEMP 'defenseclaw-live-e2e-logs')
      - name: Upload Windows live results
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-results-live-${{ matrix.connector }}-windows-x64
          path: ${{ env.DC_E2E_RESULTS }}
          if-no-files-found: error
          retention-days: 7
      - name: Capture Windows diagnostics
        if: ${{ (failure() || cancelled()) && steps.select.outputs.run == 'true' }}
        shell: pwsh
        run: ./scripts/live-connector-e2e/run-windows.ps1 -Operation capture -Connector '${{ matrix.connector }}' -StateRoot $env:DC_WINDOWS_STATE -ArtifactPath (Join-Path $env:RUNNER_TEMP 'defenseclaw-live-e2e-logs')
      - name: Upload Windows diagnostics on failure
        if: ${{ (failure() || cancelled()) && steps.select.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-logs-live-${{ matrix.connector }}-windows-x64
          path: ${{ runner.temp }}/defenseclaw-live-e2e-logs/**
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Windows cleanup safety net
        if: ${{ always() && steps.select.outputs.run == 'true' }}
        shell: pwsh
        run: ./scripts/live-connector-e2e/run-windows.ps1 -Operation cleanup -Connector '${{ matrix.connector }}' -StateRoot $env:DC_WINDOWS_STATE

  windows-antigravity-live:
    name: Windows x64 live / antigravity (authenticated)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          (inputs.os == 'all' || inputs.os == 'windows') &&
          (inputs.connector == 'all' || inputs.connector == 'antigravity') }}
    runs-on: [self-hosted, Windows, X64, antigravity-authenticated]
    timeout-minutes: 40
    env:
      DC_WINDOWS_STATE: ${{ github.workspace }}/.dc-e2e-antigravity-live
      DC_E2E_RESULTS: ${{ github.workspace }}/connector-live-e2e-results.jsonl
      DC_ANTIGRAVITY_DEDICATED_RUNNER: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Require official authenticated Antigravity client
        shell: pwsh
        run: |
          $agy = Get-Command agy.exe -ErrorAction Stop
          $version = & $agy.Source --version
          if ("$version" -notmatch '(?<!\d)1\.(?:[2-9]|\d{2,})\.' -and
              "$version" -notmatch '(?<!\d)1\.1\.(?:[89]|\d{2,})(?!\d)') {
            throw "Antigravity CLI 1.1.8+ is required, got: $version"
          }
      - name: Build native DefenseClaw tools
        shell: pwsh
        run: |
          $embed = Join-Path $env:GITHUB_WORKSPACE 'internal\gateway\connector\openclaw_extension'
          New-Item -ItemType Directory -Force -Path $embed | Out-Null
          Set-Content -LiteralPath (Join-Path $embed '.placeholder') -Value 'OpenClaw extension not built.'
          $bin = Join-Path $env:RUNNER_TEMP 'defenseclaw-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          go build -o (Join-Path $bin 'defenseclaw-gateway.exe') ./cmd/defenseclaw
          go build -ldflags '-H=windowsgui' -o (Join-Path $bin 'defenseclaw-hook.exe') ./cmd/defenseclaw-hook
          uv sync
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Real official-client E2E
        shell: pwsh
        run: |
          ./scripts/live-connector-e2e/run-windows.ps1 `
            -Layer live `
            -Connector antigravity `
            -AuthenticatedAntigravityRunner `
            -StateRoot $env:DC_WINDOWS_STATE `
            -ResultsPath $env:DC_E2E_RESULTS `
            -ArtifactPath (Join-Path $env:RUNNER_TEMP 'defenseclaw-live-e2e-logs')
      - name: Upload Antigravity live results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-results-live-antigravity-windows-x64
          path: ${{ env.DC_E2E_RESULTS }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload Antigravity diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-live-e2e-logs-live-antigravity-windows-x64
          path: ${{ runner.temp }}/defenseclaw-live-e2e-logs/**
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Antigravity teardown safety net
        if: ${{ always() }}
        shell: pwsh
        run: |
          defenseclaw-gateway connector teardown --connector antigravity
          ./scripts/live-connector-e2e/run-windows.ps1 `
            -Operation cleanup `
            -Layer live `
            -Connector antigravity `
            -AuthenticatedAntigravityRunner `
            -StateRoot $env:DC_WINDOWS_STATE

  # ---------------------------------------------------------------------------
  # Report — aggregate every cell, render the matrix, and alert on regressions.
  # ---------------------------------------------------------------------------
  report:
    name: Report + regression radar
    needs: [contract-matrix, live-matrix, windows-live, windows-antigravity-live]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so the regression radar can open/update the
      # connector-regression issue. No write access to code.
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download all cell results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: connector-live-e2e-results-*
          path: results
          merge-multiple: true

      - name: Render summary + open regression issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          open_flag=""
          # Only the trusted, scheduled / manual contexts may file issues.
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            open_flag="--open-issue"
          fi
          python3 scripts/live-connector-e2e/report.py \
            --results-dir results \
            ${open_flag} \
            --run-url "${RUN_URL}"
