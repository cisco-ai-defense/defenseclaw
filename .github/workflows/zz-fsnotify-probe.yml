name: zz fsnotify probe (wip, not for merge)
on:
  push:
    branches: [wip/ci/fsnotify-uaf-probe]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [remove, close]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: probe
        shell: pwsh
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_DURATION: 12m
        run: go test -count=1 -timeout 15m -v ./internal/zzfsnprobe/
