# Deterministic, fork-safe native Windows x64 acceptance regression suite.
# A green synthetic/contract job is not connector certification evidence.
#
# Branch protection must require the exact aggregate check name:
#   Windows Native Required
#
# Real provider-secret Codex/Claude tests remain in connector-live-e2e.yml and
# are workflow_dispatch-only. They are regression radar, not a merge gate.
# Hermes setup is supported and included in the required deterministic
# connector-contract matrix. Packaged and official-client evidence is tracked
# separately; a green synthetic contract cell does not manufacture that evidence.

name: Windows Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  powershell-static:
    name: Windows PowerShell harness validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf ps -DiagnosticsLeaf windows-native-diagnostics-powershell
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare harness Python environment
        run: |
          uv sync --frozen
          (Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build canonical v8 configuration helper
        run: |
          $helperRoot = Join-Path $env:RUNNER_TEMP 'windows-powershell-harness'
          [IO.Directory]::CreateDirectory($helperRoot) | Out-Null
          $gateway = Join-Path $helperRoot 'defenseclaw-gateway.exe'
          go build -o $gateway ./cmd/defenseclaw
          "DEFENSECLAW_GATEWAY_BIN=$gateway" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Parse every PowerShell script
        run: |
          $failures = [Collections.Generic.List[string]]::new()
          Get-ChildItem scripts -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($error in @($errors)) { $failures.Add("$($_.FullName): $error") }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Parser, mock timeout, redaction, isolation, and workflow contracts
        run: ./scripts/live-connector-e2e/test-windows.ps1
      - name: Native Setup bootstrap delegation and offline contract
        run: uv run --frozen python -m pytest cli/tests/test_install_ps1.py -q
      - name: Capture bounded diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-powershell-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  package-artifact:
    name: Windows packaged artifact build
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DC_EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact package source checkout
        run: |
          $expected = [string]$env:DC_EXPECTED_SOURCE_COMMIT
          if ($expected -cnotmatch '^[0-9a-f]{40}$') {
            throw "Expected package source commit is invalid: $expected"
          }
          $actual = (& git rev-parse --verify HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
            throw "Package checkout does not match the expected source commit: $actual != $expected"
          }
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf pkg -DiagnosticsLeaf windows-native-diagnostics-package -ArtifactLeaf windows-native-dist
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build release-shaped Windows x64 zip and Python wheel
        run: ./scripts/windows-native-ci.ps1 -Operation build-artifacts -StateRoot $env:DC_STATE_ROOT -ArtifactRoot $env:DC_ARTIFACT_ROOT
      - name: Build unsigned native Windows setup executable
        run: ./scripts/windows-native-ci.ps1 -Operation build-installer -StateRoot $env:DC_STATE_ROOT -ArtifactRoot $env:DC_ARTIFACT_ROOT
      - name: Verify exact package source identity
        run: |
          . ./scripts/windows-native-ci.ps1 -NoRun
          $expected = [string]$env:DC_EXPECTED_SOURCE_COMMIT
          if ($expected -cnotmatch '^[0-9a-f]{40}$') {
            throw "Expected package source commit is invalid: $expected"
          }
          $actual = (& git rev-parse --verify HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
            throw "Package checkout changed during the build: $actual != $expected"
          }

          $provenancePath = Join-Path $env:DC_ARTIFACT_ROOT 'DefenseClawSetup-x64.exe.provenance.json'
          $sbomPath = Join-Path $env:DC_ARTIFACT_ROOT 'DefenseClawSetup-x64.exe.sbom.json'
          foreach ($metadataPath in @($provenancePath, $sbomPath)) {
            if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
              throw "Package source-identity metadata is missing: $metadataPath"
            }
          }
          $provenance = Get-Content -LiteralPath $provenancePath -Raw -Encoding UTF8 |
            ConvertFrom-Json
          if ([string]$provenance.source_commit -cne $expected) {
            throw "Package provenance source commit does not match the expected head: $($provenance.source_commit) != $expected"
          }
          $sbom = Get-Content -LiteralPath $sbomPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$sbom.comment -cne "DefenseClaw source commit: $expected") {
            throw 'Package SBOM source commit does not match the expected head'
          }

          $wheelName = [string]$provenance.inputs.wheel
          $archiveName = [string]$provenance.inputs.gateway_archive
          foreach ($inputName in @($wheelName, $archiveName)) {
            if ([IO.Path]::GetFileName($inputName) -cne $inputName) {
              throw "Package provenance contains a non-canonical input name: $inputName"
            }
          }
          $wheelPath = Join-Path $env:DC_ARTIFACT_ROOT $wheelName
          $archivePath = Join-Path $env:DC_ARTIFACT_ROOT $archiveName
          $wheelHash = (Get-FileHash -LiteralPath $wheelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wheelHash -cne [string]$provenance.inputs.wheel_sha256) {
            throw 'Packaged CLI wheel digest does not match exact-head provenance'
          }
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne [string]$provenance.inputs.gateway_archive_sha256) {
            throw 'Packaged gateway archive digest does not match exact-head provenance'
          }

          $verificationRoot = Join-Path $env:DC_STATE_ROOT (
            'package-source-identity-' + [guid]::NewGuid().ToString('N')
          )
          [IO.Directory]::CreateDirectory($verificationRoot) | Out-Null
          Expand-Archive -LiteralPath $archivePath -DestinationPath $verificationRoot
          foreach ($binary in @(
            @{ File = 'defenseclaw-gateway.exe'; Name = 'defenseclaw-gateway' },
            @{ File = 'defenseclaw-hook.exe'; Name = 'defenseclaw-hook' }
          )) {
            $path = Join-Path $verificationRoot $binary.File
            $result = Invoke-WindowsNativeProcess $path @('--version-json') -TimeoutSeconds 30
            $report = [string]$result.StdOut | ConvertFrom-Json
            if ([int]$report.schema_version -ne 1 -or
                [string]$report.name -cne [string]$binary.Name -or
                [string]$report.version -cne [string]$provenance.version -or
                [string]$report.commit -cne $expected) {
              throw "Packaged $($binary.Name) identity does not match exact-head provenance"
            }
          }
      - name: Verify native setup wizard responsiveness
        run: >-
          ./scripts/invoke-windows-setup-standard-user-ci.ps1
          -Mode wizard-smoke
          -ArtifactRoot $env:DC_ARTIFACT_ROOT
          -StateRoot (Join-Path $env:DC_STATE_ROOT 'wizard-standard-user')
          -DiagnosticsRoot $env:DC_DIAGNOSTICS
          -TimeoutSeconds 600
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-package
          path: ${{ env.DC_ARTIFACT_ROOT }}\*
          if-no-files-found: error
          retention-days: 3
      - name: Capture bounded diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-package-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  connector-contract:
    name: Windows x64 connector contract / ${{ matrix.connector }} / ${{ matrix.rep }}
    needs: [powershell-static, package-artifact]
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.connector == 'devin' && 50 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        # The hash-pinned Devin distribution satisfies normal fixed-path Setup
        # admission only; this deterministic lane infers no auth/live evidence.
        connector: [codex, claudecode, amp, copilot, cursor, devin, hermes, antigravity, opencode]
        rep: [1, 2, 3, 4]
    env:
      CONNECTOR: ${{ matrix.connector }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf ('ct-' + $env:CONNECTOR) -DiagnosticsLeaf ('windows-native-diagnostics-' + $env:CONNECTOR) -ArtifactLeaf windows-native-dist
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: ${{ matrix.connector == 'opencode' }}
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-package
          path: ${{ env.DC_ARTIFACT_ROOT }}
      - name: Stage pinned Devin CLI admission input
        if: ${{ matrix.connector == 'devin' }}
        run: |
          $archive = Join-Path $env:DC_ARTIFACT_ROOT 'devin-3000.4.25-x86_64-pc-windows.zip'
          curl.exe --fail --location --retry 5 --retry-all-errors --output $archive https://static.devin.ai/cli/3000.4.25/devin-3000.4.25-x86_64-pc-windows.zip
          if ($LASTEXITCODE -ne 0) { throw "pinned Devin CLI download failed with exit $LASTEXITCODE" }
          $expected = '926EF4C2139D593BE564B93382D5A80F8AF0EE8AD7201CD35D50EEC9CD289808'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne $expected) {
            throw 'pinned Devin CLI archive digest mismatch'
          }
      - name: Required connector contract with one bounded telemetry retry
        id: connector_contract
        run: |
          $nativeHarness = (Resolve-Path './scripts/windows-native-ci.ps1').Path
          $standardUserHarness = (Resolve-Path './scripts/invoke-windows-setup-standard-user-ci.ps1').Path
          . $nativeHarness -NoRun
          $contractStateRoot = [IO.Path]::GetFullPath($env:DC_STATE_ROOT)
          $artifactRoot = [IO.Path]::GetFullPath($env:DC_ARTIFACT_ROOT)
          $diagnosticsRoot = [IO.Path]::GetFullPath($env:DC_DIAGNOSTICS)
          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          function Invoke-ConnectorContractAttempt([int]$Attempt) {
            $attemptDiagnostics = Join-Path $diagnosticsRoot "attempt-$Attempt-child"
            return Invoke-WindowsNativeProcess -FilePath $pwsh -ArgumentList @(
              '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $standardUserHarness,
              '-Mode', 'contract', '-Connector', $env:CONNECTOR,
              '-StateRoot', $contractStateRoot, '-ArtifactRoot', $artifactRoot,
              '-DiagnosticsRoot', $attemptDiagnostics, '-TimeoutSeconds', '1800'
            ) -AllowedExitCodes @(0, 1) -TimeoutSeconds 1860 -LogPath (
              Join-Path $diagnosticsRoot "attempt-$Attempt-wrapper.log"
            )
          }
          # This returns only after the first wrapper exits and its output drains.
          $first = Invoke-ConnectorContractAttempt 1
          if ($first.ExitCode -eq 0) {
            'retried=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            return
          }
          $retrySignal = 'event_history=sqlite_write_failed'
          $firstOutput = @($first.StdOut, $first.StdErr | Where-Object { $_ }) -join [Environment]::NewLine
          $cleanupFailurePrefixes = @(
            'disposable execution boundary:',
            'interactive desktop ACL restore:',
            'ancestor ACL lease restore:',
            'diagnostic handoff:',
            'account/profile cleanup:',
            'sandbox cleanup:',
            'parent-only sibling cleanup:'
          )
          $cleanupFailure = @($cleanupFailurePrefixes | Where-Object {
            $firstOutput.Contains($_, [StringComparison]::Ordinal)
          } | Select-Object -First 1)
          if ($cleanupFailure.Count -ne 0) {
            throw 'packaged connector contract reported incomplete disposable-user cleanup'
          }
          if (-not $firstOutput.Contains($retrySignal, [StringComparison]::Ordinal)) {
            throw 'packaged connector contract failed without the retryable telemetry signal'
          }
          Write-BoundedText -Path (Join-Path $diagnosticsRoot "$env:CONNECTOR-event-history-retry.txt") `
            -MaxBytes 4096 -Text "attempt=1`nsignal=$retrySignal"
          try {
            Invoke-WindowsNativeProcess -FilePath $pwsh -ArgumentList @(
              '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $nativeHarness,
              '-Operation', 'capture', '-StateRoot', $contractStateRoot,
              '-DiagnosticsRoot', (Join-Path $diagnosticsRoot 'attempt-1-state')
            ) -TimeoutSeconds 120 -LogPath (
              Join-Path $diagnosticsRoot 'attempt-1-capture.log'
            ) | Out-Null
          } catch {
            Write-BoundedText -Path (Join-Path $diagnosticsRoot 'attempt-1-capture-failure.log') `
              -MaxBytes 32768 -Text $_.Exception.Message
            Write-Warning 'bounded first-attempt state capture failed; cleanup remains mandatory'
          }
          Invoke-WindowsNativeProcess -FilePath $pwsh -ArgumentList @(
            '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $nativeHarness,
            '-Operation', 'cleanup', '-StateRoot', $contractStateRoot
          ) -TimeoutSeconds 180 -LogPath (
            Join-Path $diagnosticsRoot 'attempt-1-cleanup.log'
          ) | Out-Null
          if ((Test-Path -LiteralPath $contractStateRoot) -or
              @(Get-StateProcesses $contractStateRoot).Count -ne 0) {
            throw 'connector retry cleanup did not remove its exact state and rooted processes'
          }
          # The wrapper creates a GUID-named user/profile/sandbox on every call.
          $second = Invoke-ConnectorContractAttempt 2
          if ($second.ExitCode -ne 0) {
            throw 'packaged connector contract failed on its final attempt'
          }
          'retried=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload deterministic contract results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-contract-results-${{ matrix.connector }}-${{ matrix.rep }}
          path: ${{ env.DC_STATE_ROOT }}\results.jsonl
          if-no-files-found: warn
          retention-days: 5
      - name: Capture bounded redacted diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure or recovered telemetry retry
        if: ${{ failure() || cancelled() || steps.connector_contract.outputs.retried == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-contract-diagnostics-${{ matrix.connector }}-${{ matrix.rep }}
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

