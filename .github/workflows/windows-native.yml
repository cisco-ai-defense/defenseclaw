# Deterministic, fork-safe native Windows x64 acceptance regression suite.
# A green synthetic/contract job is not connector certification evidence.
#
# Branch protection must require the exact aggregate check name:
#   Windows Native Required
#
# Real provider-secret Codex/Claude tests remain in connector-live-e2e.yml and
# are workflow_dispatch-only. They are regression radar, not a merge gate.
# Hermes setup is supported and included in the required deterministic
# connector-contract matrix. Packaged and official-client evidence is tracked
# separately; a green synthetic contract cell does not manufacture that evidence.

name: Windows Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_candidate_replay_run_id:
        description: Actions run ID that produced the sealed release candidate to replay.
        required: false
        type: string
      release_candidate_replay_artifact:
        description: Exact release-candidate artifact name from that run.
        required: false
        type: string
      release_candidate_replay_version:
        description: Canonical X.Y.Z version bound into the candidate.
        required: false
        type: string
      release_candidate_replay_commit:
        description: Exact lowercase 40-character commit bound into the candidate.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows-go:
    name: Windows x64 Go suite
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf go -DiagnosticsLeaf windows-native-diagnostics-go
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native Windows Go DACL regressions explicitly
        run: |
          . ./scripts/windows-native-ci.ps1 -NoRun
          Initialize-WindowsNativeTestEnvironment $env:DC_STATE_ROOT | Out-Null
          $go = (Get-Command go.exe -ErrorAction Stop).Source
          $daclTests = @(
            'TestWriteWindowsRemovesInheritedUnauthorizedWriter',
            'TestWriteWindowsPreservesStricterExistingDACL',
            'TestWindowsWriteLikeAccess',
            'TestWindowsTrustedOwner',
            'TestRejectUntrustedWindowsWriteACEs',
            'TestHookAPITokenWindowsRejectsUntrustedDirectoryACL',
            'TestHookAPITokenWindowsAllowsReadOnlyUnsupportedAllowACE',
            'TestHookAPITokenWindowsAllowsInheritOnlyCreatorOwnerTemplate',
            'TestHookAPITokenWindowsAllowsOwnerRightsACE',
            'TestHookAPITokenWindowsRejectsDirectCreatorOwnerACE',
            'TestHookAPITokenWindowsAllowsCreateChildOnSharedAncestor',
            'TestHookAPITokenWindowsRejectsOrdinaryWriteOnSharedAncestor',
            'TestHookAPITokenWindowsRejectsWritableAncestorThroughPublicOperations',
            'TestHookAPITokenWindowsAllowsInheritOnlyTemplateOnSharedAncestor',
            'TestHookAPITokenWindowsRejectsDeleteChildOnSharedAncestor',
            'TestHookAPITokenWindowsRejectsReparsePointDirectory',
            'TestHookAPITokenRejectsSymlinkedDataDirParent',
            'TestLoadOTLPPathToken_RejectsUnsafeFiles',
            'TestLoadOTLPPathTokenWindowsRejectsWritableAncestor',
            'TestLoadOTLPPathTokenWindowsAllowsCreateChildOnSharedAncestor'
          )
          $daclTestPattern = '^(' + ($daclTests -join '|') + ')$'
          Invoke-WindowsNativeProcess $go @('test', '-vet=off', '-v', '-count=1', '-run', $daclTestPattern, './internal/safefile', './internal/managed', './internal/gateway/connector') -TimeoutSeconds 600 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-dacl-test.log') | Out-Null
      - name: Stress native single-flight and executable lifecycle contracts
        run: |
          . ./scripts/windows-native-ci.ps1 -NoRun
          Initialize-WindowsNativeTestEnvironment $env:DC_STATE_ROOT | Out-Null
          $go = (Get-Command go.exe -ErrorAction Stop).Source
          Invoke-WindowsNativeProcess $go @(
            'test', '-vet=off', '-v', '-count=10', '-run', '^TestRunScan_SingleFlight$', './internal/inventory'
          ) -TimeoutSeconds 300 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-inventory-singleflight-stress.log') | Out-Null
          Invoke-WindowsNativeProcess $go @(
            'test', '-vet=off', '-v', '-count=2', '-run', '^TestNativeWindowsExecutableForeignCollisionAndRecovery$', './internal/cli'
          ) -TimeoutSeconds 600 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-native-executable-lifecycle-stress.log') | Out-Null
      - name: Full native Windows Go test, vet, and build
        run: |
          . ./scripts/windows-native-ci.ps1 -NoRun
          Initialize-WindowsNativeTestEnvironment $env:DC_STATE_ROOT | Out-Null
          $go = (Get-Command go.exe -ErrorAction Stop).Source
          # These tests contain POSIX mode-bit/script assertions that native
          # Windows does not use. Equivalent token validation, reparse-point,
          # private-DACL, and supported-connector coverage runs in this job.
          $windowsInapplicable = '^(' + (@(
            'TestAtomicWriteFile_PreservesSymlinkedDotfile',
            'TestOpenHandsHookScript_BlockExitsTwo'
          ) -join '|') + ')$'
          # The gateway and connector packages are large enough that one native
          # Windows test binary can retain the full suite's resources until it
          # reaches Go's package timeout. Partition both top-level test lists in
          # the same process-isolation shape as Linux CI. Shards remain
          # sequential on this four-core hosted runner.
          $gatewayList = Invoke-WindowsNativeProcess $go @(
            'test', '-vet=off', '-list', '^(Test|Fuzz|Example)', './internal/gateway'
          ) -TimeoutSeconds 600 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-gateway-list.log')
          $gatewayTests = @(
            [regex]::Split([string]$gatewayList.StdOut, '\r?\n') |
                Where-Object { $_ -match '^(Test|Fuzz|Example)\S*$' } |
                Sort-Object -Unique
          )
          if ($gatewayTests.Count -lt 4) {
            throw "native gateway sharding discovered only $($gatewayTests.Count) top-level tests"
          }
          $goTestLog = Join-Path $env:DC_STATE_ROOT 'go-test.log'
          $goFailureSummary = Join-Path $env:DC_STATE_ROOT 'go-test-failure-summary.log'
          foreach ($shard in 0..3) {
            $shardTests = @(
              for ($index = 0; $index -lt $gatewayTests.Count; $index++) {
                if (($index % 4) -eq $shard) { [regex]::Escape($gatewayTests[$index]) }
              }
            )
            $gatewayShardPattern = '^(' + ($shardTests -join '|') + ')$'
            Invoke-WindowsNativeProcess $go @(
              'test', '-vet=off', '-json', '-count=1', '-timeout=20m', '-p=1',
              '-skip', $windowsInapplicable, '-run', $gatewayShardPattern, './internal/gateway'
            ) -TimeoutSeconds 1500 `
              -LogPath (Join-Path $env:DC_STATE_ROOT ("go-gateway-shard-{0}.log" -f $shard)) `
              -GoTestFailureSummaryPath $goFailureSummary | Out-Null
          }
          $connectorList = Invoke-WindowsNativeProcess $go @(
            'test', '-vet=off', '-list', '^(Test|Fuzz|Example)', './internal/gateway/connector'
          ) -TimeoutSeconds 600 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-connector-list.log')
          $connectorTests = @(
            [regex]::Split([string]$connectorList.StdOut, '\r?\n') |
                Where-Object { $_ -match '^(Test|Fuzz|Example)\S*$' } |
                Sort-Object -Unique
          )
          if ($connectorTests.Count -lt 4) {
            throw "native connector sharding discovered only $($connectorTests.Count) top-level tests"
          }
          foreach ($shard in 0..3) {
            $shardTests = @(
              for ($index = 0; $index -lt $connectorTests.Count; $index++) {
                if (($index % 4) -eq $shard) { [regex]::Escape($connectorTests[$index]) }
              }
            )
            $connectorShardPattern = '^(' + ($shardTests -join '|') + ')$'
            Invoke-WindowsNativeProcess $go @(
              'test', '-vet=off', '-json', '-count=1', '-timeout=20m', '-p=1',
              '-skip', $windowsInapplicable, '-run', $connectorShardPattern, './internal/gateway/connector'
            ) -TimeoutSeconds 1500 `
              -LogPath (Join-Path $env:DC_STATE_ROOT ("go-connector-shard-{0}.log" -f $shard)) `
              -GoTestFailureSummaryPath $goFailureSummary | Out-Null
          }
          $packageList = Invoke-WindowsNativeProcess $go @(
            'list', './...'
          ) -TimeoutSeconds 600 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-package-list.log')
          $remainingPackages = @(
            [regex]::Split([string]$packageList.StdOut, '\r?\n') |
              Where-Object {
                $_ -match '^github\.com/defenseclaw/defenseclaw/' -and
                $_ -ne 'github.com/defenseclaw/defenseclaw/internal/gateway' -and
                $_ -ne 'github.com/defenseclaw/defenseclaw/internal/gateway/connector'
              }
          )
          if (-not $remainingPackages) {
            throw 'native Go package discovery selected no non-gateway packages'
          }
          $remainingArguments = @(
            'test', '-vet=off', '-json', '-count=1', '-timeout=20m', '-p=1',
            '-skip', $windowsInapplicable
          ) + $remainingPackages
          Invoke-WindowsNativeProcess $go $remainingArguments -TimeoutSeconds 2100 `
            -LogPath $goTestLog -GoTestFailureSummaryPath $goFailureSummary | Out-Null
          Invoke-WindowsNativeProcess $go @('vet', './...') -TimeoutSeconds 900 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-vet.log') | Out-Null
          $bin = Join-Path $env:DC_STATE_ROOT 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          Invoke-WindowsNativeProcess $go @('build', '-o', (Join-Path $bin 'defenseclaw-gateway.exe'), './cmd/defenseclaw') -TimeoutSeconds 900 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-build-gateway.log') | Out-Null
          Invoke-WindowsNativeProcess $go @('build', '-ldflags', '-H=windowsgui', '-o', (Join-Path $bin 'defenseclaw-hook.exe'), './cmd/defenseclaw-hook') -TimeoutSeconds 900 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-build-hook.log') | Out-Null
          $hookLauncher = Join-Path $bin 'defenseclaw-hook-launcher.exe'
          Invoke-WindowsNativeProcess $go @(
            'build', '-trimpath', '-buildvcs=false', '-ldflags', '-s -w -H=windowsgui',
            '-o', $hookLauncher, './cmd/defenseclaw-hook-launcher'
          ) -TimeoutSeconds 900 -LogPath (Join-Path $env:DC_STATE_ROOT 'go-build-hook-launcher.log') | Out-Null
          $packageVersion = Get-WorkspacePackageVersion
          Assert-WindowsExecutableResource -Path (Join-Path $bin 'defenseclaw-gateway.exe') -Component 'gateway' -Version $packageVersion -Apply
          Assert-WindowsExecutableResource -Path (Join-Path $bin 'defenseclaw-hook.exe') -Component 'hook' -Version $packageVersion -Apply
          Assert-WindowsExecutableResource -Path $hookLauncher -Component 'hook' -Version $packageVersion -Apply
          if ((Get-Item -LiteralPath $hookLauncher -Force).Length -gt 8MB) {
            throw 'HookRuntime launcher exceeds the unsigned 8 MiB size ceiling'
          }
      - name: Capture bounded diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-go-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  windows-python:
    name: Windows Python suite / shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHON_SHARD: ${{ matrix.shard }}
      # Linux CI already runs the complete Python/TUI suite on every PR.
      # Keep the native Windows PR gate focused on platform smoke coverage;
      # main and manual/release-candidate runs retain the complete Windows TUI.
      WINDOWS_TUI_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
      # The selective Telemetry Registry Exhaustive workflow owns these two
      # mutation-heavy modules on PRs. Keep their native Windows updater paths
      # here, while main and manual/release-candidate runs retain both modules.
      WINDOWS_TELEMETRY_REGISTRY_MODE: ${{ github.event_name == 'pull_request' && 'focused' || 'full' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf ('py-' + $env:PYTHON_SHARD) -DiagnosticsLeaf ('windows-native-diagnostics-python-' + $env:PYTHON_SHARD)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked Python environment
        run: uv sync --frozen --python 3.12
      - name: Stage packaged runtime data with PowerShell
        run: ./scripts/windows-native-ci.ps1 -Operation stage-package-data
      - name: Validate registered Windows Codex and Claude hook commands
        if: ${{ matrix.shard == 1 }}
        run: |
          . ./scripts/windows-native-ci.ps1 -NoRun
          Initialize-WindowsNativeTestEnvironment $env:DC_STATE_ROOT | Out-Null
          $uv = (Get-Command uv.exe -ErrorAction Stop).Source
          Invoke-WindowsNativeProcess $uv @('run', '--frozen', 'python', '-m', 'pytest', 'cli/tests/test_cmd_doctor_windows_hooks.py', '-q') -TimeoutSeconds 300 -LogPath (Join-Path $env:DC_STATE_ROOT 'pytest-doctor-windows-hooks.log') | Out-Null
      - name: Run native Windows Local Splunk certification regressions
        if: ${{ matrix.shard == 1 }}
        run: |
          . ./scripts/windows-native-ci.ps1 -NoRun
          Initialize-WindowsNativeTestEnvironment $env:DC_STATE_ROOT | Out-Null
          $uv = (Get-Command uv.exe -ErrorAction Stop).Source
          Invoke-WindowsNativeProcess $uv @('run', '--frozen', 'python', '-m', 'pytest', 'cli/tests/test_local_splunk_controller.py', 'cli/tests/test_local_splunk_transaction.py', 'cli/tests/test_local_splunk_packaging.py', 'cli/tests/test_windows_local_observability_gates.py', '-q') -TimeoutSeconds 900 -LogPath (Join-Path $env:DC_STATE_ROOT 'pytest-local-splunk.log') | Out-Null
      - name: Run Python test shard ${{ matrix.shard }} of 8 with bounded PR coverage
        run: |
          . ./scripts/windows-native-ci.ps1 -NoRun
          Initialize-WindowsNativeTestEnvironment $env:DC_STATE_ROOT | Out-Null
          $uv = (Get-Command uv.exe -ErrorAction Stop).Source
          $allTestFiles = @(Get-ChildItem cli/tests -Recurse -File -Filter 'test_*.py' | Sort-Object FullName)
          $shardIndex = [int]$env:PYTHON_SHARD - 1
          $appShellFile = @($allTestFiles | Where-Object { $_.Name -eq 'test_app_shell.py' })
          if ($appShellFile.Count -ne 1) {
            throw "Expected exactly one test_app_shell.py file, found $($appShellFile.Count)"
          }
          $fullTUI = $env:WINDOWS_TUI_MODE -eq 'full'
          $fullTelemetryRegistry = $env:WINDOWS_TELEMETRY_REGISTRY_MODE -eq 'full'
          $exhaustiveTelemetryPaths = @(
            [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'cli\tests\test_telemetry_registry_generator.py')),
            [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'cli\tests\test_telemetry_registry_candidate_renderer.py'))
          )
          foreach ($telemetryPath in $exhaustiveTelemetryPaths) {
            if (-not (Test-Path -LiteralPath $telemetryPath -PathType Leaf)) {
              throw "Expected exhaustive telemetry registry test file $telemetryPath"
            }
          }
          $tuiRoot = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'cli\tests\tui'))
          $tuiPrefix = $tuiRoot + [IO.Path]::DirectorySeparatorChar
          $testFiles = @(
            $allTestFiles | Where-Object {
              if ($_.FullName -eq $appShellFile[0].FullName) { return $false }
              if (-not $fullTelemetryRegistry -and $_.FullName -in $exhaustiveTelemetryPaths) { return $false }
              $isTUI = $_.FullName.StartsWith($tuiPrefix, [StringComparison]::OrdinalIgnoreCase)
              return $fullTUI -or -not $isTUI
            }
          )
          $shardFiles = @(
            for ($index = 0; $index -lt $testFiles.Count; $index++) {
              if (($index % 8) -eq $shardIndex) {
                $testFiles[$index].FullName
              }
            }
          )
          # These assertions exercise the POSIX-only OpenShell ownership path
          # (pwd, root-owned mkdir/chown, and Linux sandbox users). Symlink
          # capability alone is not enough to make that product path native to
          # Windows, so keep the exact nodes in Linux CI and omit them here.
          $windowsInapplicableTests = @(
            '--deselect=cli/tests/test_cmd_setup_sandbox.py::TestTrustedPrivilegedCommands::test_existing_openclaw_integration_requires_pin',
            '--deselect=cli/tests/test_remediation_setup_sandbox.py::TestSandboxInitIdempotentPin::test_f0162_refuses_swapped_symlink',
            '--deselect=cli/tests/test_remediation_setup_sandbox.py::TestInitSandboxChownTOCTOU::test_f0421_rechecks_pinned_home_before_chown',
            # Windows os.readlink returns the preserved absolute target with
            # an equivalent \\?\ prefix, so this raw POSIX string assertion
            # remains covered by the Linux suite.
            '--deselect=cli/tests/test_migrations.py::TestMigrate050PurgeLegacyFlatPolicyBundle::test_symlinked_flat_data_json_is_left_alone'
          )
          $tuiTargets = @()
          if ($fullTUI) {
            $appShellCollectionLog = Join-Path $env:DC_STATE_ROOT 'pytest-app-shell-collection.log'
            $appShellCollectionArgs = @('run', '--frozen', 'python', '-m', 'pytest', $appShellFile[0].FullName, '--collect-only', '-q', '--color=no')
            Invoke-WindowsNativeProcess $uv $appShellCollectionArgs -TimeoutSeconds 300 -LogPath $appShellCollectionLog | Out-Null
            $appShellNodes = @(
              Get-Content -LiteralPath $appShellCollectionLog |
                Where-Object { $_ -match '^cli[/\\]tests[/\\]tui[/\\]test_app_shell\.py::' }
            )
            if (-not $appShellNodes) {
              throw 'Collected no test_app_shell.py nodes'
            }
            $tuiTargets = @(
              for ($index = 0; $index -lt $appShellNodes.Count; $index++) {
                if (($index % 8) -eq $shardIndex) {
                  $appShellNodes[$index]
                }
              }
            )
          } elseif ($shardIndex -eq 0) {
            $tuiTargets = @(
              'cli/tests/tui/test_app_shell.py::test_textual_shell_starts_on_overview',
              'cli/tests/tui/test_app_shell.py::test_digit_shortcut_switches_panel_placeholder',
              'cli/tests/tui/test_executor_gateway_windows.py',
              'cli/tests/tui/test_windows_clipboard.py'
            )
          }
          $nativeTelemetryTargets = @()
          if (-not $fullTelemetryRegistry -and $shardIndex -eq 2) {
            $nativeTelemetryTargets = @(
              'cli/tests/test_telemetry_registry_generator.py::test_updater_help_imports_on_native_platform',
              'cli/tests/test_telemetry_registry_generator.py::test_updater_mid_publish_failure_restores_prior_bytes_and_inodes',
              'cli/tests/test_telemetry_registry_generator.py::test_updater_windows_failure_after_replace_restores_prior_file',
              'cli/tests/test_telemetry_registry_generator.py::test_updater_post_commit_cleanup_fsync_failure_reports_live_commit',
              'cli/tests/test_telemetry_registry_generator.py::test_updater_namespace_swap_cannot_publish_through_detached_parent',
              'cli/tests/test_telemetry_registry_generator.py::test_updater_transaction_bootstrap_failure_removes_exact_created_inode'
            )
          }
          if (-not $shardFiles) {
            throw "Python test shard $($shardIndex + 1) selected no ordinary test files"
          }
          if ($fullTUI -and -not $tuiTargets) {
            throw "Python test shard $($shardIndex + 1) selected no test_app_shell.py nodes"
          }
          # Run focused suites in fresh interpreters before the ordinary file
          # shard so their process-global state cannot leak across suites.
          if ($nativeTelemetryTargets) {
            $nativeTelemetryPytestArgs = @('run', '--frozen', 'python', '-m', 'pytest') + $nativeTelemetryTargets + @('-vv', '--durations=25', '--color=no')
            Invoke-WindowsNativeProcess $uv $nativeTelemetryPytestArgs -TimeoutSeconds 900 -LogPath (Join-Path $env:DC_STATE_ROOT ('pytest-shard-{0}-native-telemetry.log' -f $env:PYTHON_SHARD)) | Out-Null
          }
          if ($tuiTargets) {
            $tuiPytestArgs = @('run', '--frozen', 'python', '-m', 'pytest') + $tuiTargets + @('-vv', '--durations=25', '--color=no')
            Invoke-WindowsNativeProcess $uv $tuiPytestArgs -TimeoutSeconds 900 -LogPath (Join-Path $env:DC_STATE_ROOT ('pytest-shard-{0}-tui.log' -f $env:PYTHON_SHARD)) | Out-Null
          }
          $ordinaryPytestArgs = @('run', '--frozen', 'python', '-m', 'pytest') + $shardFiles + $windowsInapplicableTests + @('-q')
          Invoke-WindowsNativeProcess $uv $ordinaryPytestArgs -TimeoutSeconds 4200 -LogPath (Join-Path $env:DC_STATE_ROOT ('pytest-shard-{0}-ordinary.log' -f $env:PYTHON_SHARD)) | Out-Null
      - name: Capture bounded diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-python-diagnostics-${{ matrix.shard }}
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  powershell-static:
    name: Windows PowerShell harness validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf ps -DiagnosticsLeaf windows-native-diagnostics-powershell
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare harness Python environment
        run: |
          uv sync --frozen
          (Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build canonical v8 configuration helper
        run: |
          $helperRoot = Join-Path $env:RUNNER_TEMP 'windows-powershell-harness'
          [IO.Directory]::CreateDirectory($helperRoot) | Out-Null
          $gateway = Join-Path $helperRoot 'defenseclaw-gateway.exe'
          go build -o $gateway ./cmd/defenseclaw
          "DEFENSECLAW_GATEWAY_BIN=$gateway" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Parse every PowerShell script
        run: |
          $failures = [Collections.Generic.List[string]]::new()
          Get-ChildItem scripts -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($error in @($errors)) { $failures.Add("$($_.FullName): $error") }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Parser, mock timeout, redaction, isolation, and workflow contracts
        run: ./scripts/live-connector-e2e/test-windows.ps1
      - name: Native Setup bootstrap delegation and offline contract
        run: uv run --frozen python -m pytest cli/tests/test_install_ps1.py -q
      - name: Capture bounded diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-powershell-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  package-artifact:
    name: Windows packaged artifact build
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DC_EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact package source checkout
        run: |
          $expected = [string]$env:DC_EXPECTED_SOURCE_COMMIT
          if ($expected -cnotmatch '^[0-9a-f]{40}$') {
            throw "Expected package source commit is invalid: $expected"
          }
          $actual = (& git rev-parse --verify HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
            throw "Package checkout does not match the expected source commit: $actual != $expected"
          }
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf pkg -DiagnosticsLeaf windows-native-diagnostics-package -ArtifactLeaf windows-native-dist
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build release-shaped Windows x64 zip and Python wheel
        run: ./scripts/windows-native-ci.ps1 -Operation build-artifacts -StateRoot $env:DC_STATE_ROOT -ArtifactRoot $env:DC_ARTIFACT_ROOT
      - name: Build unsigned native Windows setup executable
        run: ./scripts/windows-native-ci.ps1 -Operation build-installer -StateRoot $env:DC_STATE_ROOT -ArtifactRoot $env:DC_ARTIFACT_ROOT
      - name: Verify exact package source identity
        run: |
          . ./scripts/windows-native-ci.ps1 -NoRun
          $expected = [string]$env:DC_EXPECTED_SOURCE_COMMIT
          if ($expected -cnotmatch '^[0-9a-f]{40}$') {
            throw "Expected package source commit is invalid: $expected"
          }
          $actual = (& git rev-parse --verify HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
            throw "Package checkout changed during the build: $actual != $expected"
          }

          $provenancePath = Join-Path $env:DC_ARTIFACT_ROOT 'DefenseClawSetup-x64.exe.provenance.json'
          $sbomPath = Join-Path $env:DC_ARTIFACT_ROOT 'DefenseClawSetup-x64.exe.sbom.json'
          foreach ($metadataPath in @($provenancePath, $sbomPath)) {
            if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
              throw "Package source-identity metadata is missing: $metadataPath"
            }
          }
          $provenance = Get-Content -LiteralPath $provenancePath -Raw -Encoding UTF8 |
            ConvertFrom-Json
          if ([string]$provenance.source_commit -cne $expected) {
            throw "Package provenance source commit does not match the expected head: $($provenance.source_commit) != $expected"
          }
          $sbom = Get-Content -LiteralPath $sbomPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$sbom.comment -cne "DefenseClaw source commit: $expected") {
            throw 'Package SBOM source commit does not match the expected head'
          }

          $wheelName = [string]$provenance.inputs.wheel
          $archiveName = [string]$provenance.inputs.gateway_archive
          foreach ($inputName in @($wheelName, $archiveName)) {
            if ([IO.Path]::GetFileName($inputName) -cne $inputName) {
              throw "Package provenance contains a non-canonical input name: $inputName"
            }
          }
          $wheelPath = Join-Path $env:DC_ARTIFACT_ROOT $wheelName
          $archivePath = Join-Path $env:DC_ARTIFACT_ROOT $archiveName
          $wheelHash = (Get-FileHash -LiteralPath $wheelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wheelHash -cne [string]$provenance.inputs.wheel_sha256) {
            throw 'Packaged CLI wheel digest does not match exact-head provenance'
          }
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne [string]$provenance.inputs.gateway_archive_sha256) {
            throw 'Packaged gateway archive digest does not match exact-head provenance'
          }

          $verificationRoot = Join-Path $env:DC_STATE_ROOT (
            'package-source-identity-' + [guid]::NewGuid().ToString('N')
          )
          [IO.Directory]::CreateDirectory($verificationRoot) | Out-Null
          Expand-Archive -LiteralPath $archivePath -DestinationPath $verificationRoot
          foreach ($binary in @(
            @{ File = 'defenseclaw.exe'; Name = 'defenseclaw-gateway' },
            @{ File = 'defenseclaw-hook.exe'; Name = 'defenseclaw-hook' }
          )) {
            $path = Join-Path $verificationRoot $binary.File
            $result = Invoke-WindowsNativeProcess $path @('--version-json') -TimeoutSeconds 30
            $report = [string]$result.StdOut | ConvertFrom-Json
            if ([int]$report.schema_version -ne 1 -or
                [string]$report.name -cne [string]$binary.Name -or
                [string]$report.version -cne [string]$provenance.version -or
                [string]$report.commit -cne $expected) {
              throw "Packaged $($binary.Name) identity does not match exact-head provenance"
            }
          }
      - name: Verify native setup wizard responsiveness
        run: >-
          ./scripts/invoke-windows-setup-standard-user-ci.ps1
          -Mode wizard-smoke
          -ArtifactRoot $env:DC_ARTIFACT_ROOT
          -StateRoot (Join-Path $env:DC_STATE_ROOT 'wizard-standard-user')
          -DiagnosticsRoot $env:DC_DIAGNOSTICS
          -TimeoutSeconds 600
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-package
          path: ${{ env.DC_ARTIFACT_ROOT }}\*
          if-no-files-found: error
          retention-days: 3
      - name: Capture bounded diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-package-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  packaged-acceptance:
    name: Windows native Setup install and lifecycle acceptance
    needs: package-artifact
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf acc -DiagnosticsLeaf windows-native-diagnostics-acceptance -ArtifactLeaf windows-native-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-package
          path: ${{ env.DC_ARTIFACT_ROOT }}
      - name: Native Setup EXE install, CLI/TUI smoke, repair, and uninstall
        run: >-
          ./scripts/invoke-windows-setup-standard-user-ci.ps1
          -Mode setup-acceptance
          -StateRoot $env:DC_STATE_ROOT
          -ArtifactRoot $env:DC_ARTIFACT_ROOT
          -DiagnosticsRoot $env:DC_DIAGNOSTICS
          -TimeoutSeconds 4200
      - name: Capture bounded redacted diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-acceptance-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  public-bootstrap-acceptance:
    name: Windows public install.ps1 acceptance
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    env:
      BOOTSTRAP_FIXTURE_VERSION: 0.8.7
      # Before 0.8.7 exists, replay the sealed candidate that exposed the
      # fake-profile harness defect. Once published, the job automatically uses
      # permanent release assets and this fallback remains fail-closed evidence.
      BOOTSTRAP_FIXTURE_RUN_ID: "30063491006"
      BOOTSTRAP_FIXTURE_ARTIFACT: release-candidate-30063491006-1
      # 0.8.7 predates immutable install.ps1 release assets. The compatibility
      # fallback below is review-bound to these exact repository bytes and is
      # refused for every other release/candidate identity.
      BOOTSTRAP_LEGACY_INSTALLER_SHA256: a0ddd7469500fce694df924f03cdf1445ceb7fe9a3dfe101bde209728be8e5bf
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf bootstrap -DiagnosticsLeaf windows-native-diagnostics-bootstrap -ArtifactLeaf windows-bootstrap-fixture
      - name: Stage pinned Windows Cosign verifier
        run: ./scripts/install-pinned-windows-cosign.ps1
      - name: Select permanent release or sealed candidate fixture
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previousErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $lookup = (
              gh release view $env:BOOTSTRAP_FIXTURE_VERSION `
                --repo $env:GITHUB_REPOSITORY `
                --json isDraft `
                --jq '.isDraft' 2>&1 |
                Out-String -Width 32768
            ).Trim()
            $lookupExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ($lookupExit -eq 0) {
            $published = $lookup -ceq 'false'
          } elseif ($lookup -ceq 'release not found') {
            $published = $false
          } else {
            throw "Could not resolve bootstrap fixture release: $lookup"
          }
          if ($published) {
            'source=release' >> $env:GITHUB_OUTPUT
          } else {
            'source=candidate' >> $env:GITHUB_OUTPUT
          }
          # GitHub's pwsh wrapper exits with the last native exit code. A
          # missing release is the expected pre-publication branch, not an
          # error after its candidate fallback has been selected.
          $global:LASTEXITCODE = 0
      - name: Download authenticated public bootstrap fixture
        if: ${{ steps.fixture.outputs.source == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fixture = Join-Path $env:DC_ARTIFACT_ROOT 'release'
          [IO.Directory]::CreateDirectory($fixture) | Out-Null
          function Invoke-AuthenticatedReleaseAssetDownload {
            param(
              [Parameter(Mandatory)] [string] $Asset,
              [Parameter(Mandatory)] [string] $FailureMessage
            )
            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              gh release download $env:BOOTSTRAP_FIXTURE_VERSION `
                --repo $env:GITHUB_REPOSITORY `
                --pattern $Asset `
                --dir $fixture `
                --clobber
              if ($LASTEXITCODE -eq 0) {
                return
              }
              if ($attempt -eq $maxAttempts) {
                throw $FailureMessage
              }
              Write-Warning (
                "Authenticated release asset download failed for $Asset " +
                "(attempt $attempt/$maxAttempts); retrying."
              )
              Start-Sleep -Seconds $attempt
            }
          }
          foreach ($asset in @(
            'DefenseClawSetup-x64.exe',
            'DefenseClawSetup-x64.exe.provenance.json',
            'upgrade-manifest.json',
            'checksums.txt',
            'checksums.txt.sig',
            'checksums.txt.pem',
            'checksums.txt.bundle'
          )) {
            Invoke-AuthenticatedReleaseAssetDownload `
              -Asset $asset `
              -FailureMessage "Could not download authenticated bootstrap fixture asset: $asset"
          }
          $installerAssetCount = (
            gh release view $env:BOOTSTRAP_FIXTURE_VERSION `
              --repo $env:GITHUB_REPOSITORY `
              --json assets `
              --jq '[.assets[] | select(.name == "install.ps1")] | length'
          )
          if ($LASTEXITCODE -ne 0 -or $installerAssetCount -notmatch '^[0-9]+$') {
            throw 'Could not resolve the immutable install.ps1 asset inventory'
          }
          if ([int]$installerAssetCount -gt 1) {
            throw 'The immutable release contains duplicate install.ps1 assets'
          }
          if ([int]$installerAssetCount -eq 1) {
            Invoke-AuthenticatedReleaseAssetDownload `
              -Asset install.ps1 `
              -FailureMessage 'Could not download the immutable install.ps1 asset'
          } elseif ($env:BOOTSTRAP_FIXTURE_VERSION -cne '0.8.7') {
            throw (
              'The authenticated release is missing its exact immutable ' +
              'install.ps1 asset'
            )
          } else {
            Write-Host (
              'Pinned legacy 0.8.7 has no install.ps1 asset; the digest-bound ' +
              'compatibility fixture will be staged later.'
            )
          }
          "DC_BOOTSTRAP_RELEASE_DIR=$fixture" >> $env:GITHUB_ENV
      - name: Download sealed pre-publication bootstrap fixture
        if: ${{ steps.fixture.outputs.source == 'candidate' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.BOOTSTRAP_FIXTURE_ARTIFACT }}
          path: ${{ env.DC_ARTIFACT_ROOT }}\candidate
          repository: cisco-ai-defense/defenseclaw
          run-id: ${{ env.BOOTSTRAP_FIXTURE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Select sealed candidate distribution
        if: ${{ steps.fixture.outputs.source == 'candidate' }}
        run: |
          $fixture = Join-Path $env:DC_ARTIFACT_ROOT 'candidate\dist'
          if (-not (Test-Path -LiteralPath $fixture -PathType Container)) {
            throw "Sealed bootstrap candidate distribution is missing: $fixture"
          }
          "DC_BOOTSTRAP_RELEASE_DIR=$fixture" >> $env:GITHUB_ENV
      - name: Exercise current public bootstrap under a real disposable user
        env:
          BOOTSTRAP_FIXTURE_SOURCE: ${{ steps.fixture.outputs.source }}
        run: |
          # The pinned 0.8.7 regression fixture predates immutable installer
          # assets. Every current candidate/release must provide its exact
          # downloaded install.ps1. The only fallback is this explicitly pinned
          # legacy fixture, whose reviewed repository bytes are digest-bound
          # before and after staging.
          $fixtureInstaller = Join-Path $env:DC_BOOTSTRAP_RELEASE_DIR 'install.ps1'
          if (-not (Test-Path -LiteralPath $fixtureInstaller -PathType Leaf)) {
            $isPinnedLegacyFixture = (
              $env:BOOTSTRAP_FIXTURE_VERSION -ceq '0.8.7' -and
              (
                $env:BOOTSTRAP_FIXTURE_SOURCE -ceq 'release' -or
                (
                  $env:BOOTSTRAP_FIXTURE_SOURCE -ceq 'candidate' -and
                  $env:BOOTSTRAP_FIXTURE_RUN_ID -ceq '30063491006' -and
                  $env:BOOTSTRAP_FIXTURE_ARTIFACT -ceq 'release-candidate-30063491006-1'
                )
              )
            )
            if (-not $isPinnedLegacyFixture) {
              throw (
                'The authenticated candidate/release is missing its exact ' +
                'immutable install.ps1 asset'
              )
            }
            $legacyInstaller = (
              Resolve-Path -LiteralPath ./scripts/install.ps1 -ErrorAction Stop
            ).Path
            $legacyDigest = (
              Get-FileHash -LiteralPath $legacyInstaller -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if ($legacyDigest -cne $env:BOOTSTRAP_LEGACY_INSTALLER_SHA256) {
              throw (
                'The reviewed legacy 0.8.7 installer digest changed: ' +
                "$legacyDigest"
              )
            }
            Copy-Item -LiteralPath $legacyInstaller `
              -Destination $fixtureInstaller -ErrorAction Stop
            $stagedLegacyDigest = (
              Get-FileHash -LiteralPath $fixtureInstaller -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if ($stagedLegacyDigest -cne $env:BOOTSTRAP_LEGACY_INSTALLER_SHA256) {
              throw 'The staged legacy 0.8.7 installer lost its digest binding'
            }
          }
          $bootstrapState = Join-Path $env:DC_STATE_ROOT (
            'defenseclaw-bootstrap-acceptance-' + [guid]::NewGuid().ToString('N')
          )
          ./scripts/test-fresh-install-release-windows.ps1 `
            -ReleaseDir $env:DC_BOOTSTRAP_RELEASE_DIR `
            -TargetVersion $env:BOOTSTRAP_FIXTURE_VERSION `
            -UninstallContract immediate `
            -StateRoot $bootstrapState `
            -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Capture bounded diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-bootstrap-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  connector-contract:
    name: Windows x64 connector contract / ${{ matrix.connector }}
    needs: [powershell-static, package-artifact]
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.connector == 'devin' && 50 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        # The hash-pinned Devin distribution satisfies normal fixed-path Setup
        # admission only; this deterministic lane infers no auth/live evidence.
        connector: [codex, claudecode, amp, copilot, cursor, devin, hermes, antigravity, opencode]
    env:
      CONNECTOR: ${{ matrix.connector }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf ('ct-' + $env:CONNECTOR) -DiagnosticsLeaf ('windows-native-diagnostics-' + $env:CONNECTOR) -ArtifactLeaf windows-native-dist
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: ${{ matrix.connector == 'opencode' }}
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-package
          path: ${{ env.DC_ARTIFACT_ROOT }}
      - name: Stage pinned Devin CLI admission input
        if: ${{ matrix.connector == 'devin' }}
        run: |
          $archive = Join-Path $env:DC_ARTIFACT_ROOT 'devin-3000.4.25-x86_64-pc-windows.zip'
          curl.exe --fail --location --retry 5 --retry-all-errors --output $archive https://static.devin.ai/cli/3000.4.25/devin-3000.4.25-x86_64-pc-windows.zip
          if ($LASTEXITCODE -ne 0) { throw "pinned Devin CLI download failed with exit $LASTEXITCODE" }
          $expected = '926EF4C2139D593BE564B93382D5A80F8AF0EE8AD7201CD35D50EEC9CD289808'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne $expected) {
            throw 'pinned Devin CLI archive digest mismatch'
          }
      - name: Required setup, allow/block, audit, telemetry, timeout, and teardown contract
        if: ${{ matrix.connector != 'devin' }}
        run: >-
          ./scripts/invoke-windows-setup-standard-user-ci.ps1
          -Mode contract
          -Connector $env:CONNECTOR
          -StateRoot $env:DC_STATE_ROOT
          -ArtifactRoot $env:DC_ARTIFACT_ROOT
          -DiagnosticsRoot $env:DC_DIAGNOSTICS
          -TimeoutSeconds 1800
      - name: Required Devin contract with one bounded infrastructure retry
        if: ${{ matrix.connector == 'devin' }}
        id: devin_contract
        run: |
          $nativeHarness = (Resolve-Path './scripts/windows-native-ci.ps1').Path
          $standardUserHarness = (Resolve-Path './scripts/invoke-windows-setup-standard-user-ci.ps1').Path
          . $nativeHarness -NoRun
          $contractStateRoot = [IO.Path]::GetFullPath($env:DC_STATE_ROOT)
          $artifactRoot = [IO.Path]::GetFullPath($env:DC_ARTIFACT_ROOT)
          $diagnosticsRoot = [IO.Path]::GetFullPath($env:DC_DIAGNOSTICS)
          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          function Invoke-DevinContractAttempt([int]$Attempt) {
            $attemptDiagnostics = Join-Path $diagnosticsRoot "attempt-$Attempt-child"
            return Invoke-WindowsNativeProcess -FilePath $pwsh -ArgumentList @(
              '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $standardUserHarness,
              '-Mode', 'contract', '-Connector', 'devin',
              '-StateRoot', $contractStateRoot, '-ArtifactRoot', $artifactRoot,
              '-DiagnosticsRoot', $attemptDiagnostics, '-TimeoutSeconds', '1800'
            ) -AllowedExitCodes @(0, 1) -TimeoutSeconds 1860 -LogPath (
              Join-Path $diagnosticsRoot "attempt-$Attempt-wrapper.log"
            )
          }
          # This returns only after the first wrapper exits and its output drains.
          $first = Invoke-DevinContractAttempt 1
          if ($first.ExitCode -eq 0) {
            'retried=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            return
          }
          $retrySignal = 'event_history=sqlite_write_failed'
          $firstOutput = @($first.StdOut, $first.StdErr | Where-Object { $_ }) -join [Environment]::NewLine
          $cleanupFailurePrefixes = @(
            'disposable execution boundary:',
            'interactive desktop ACL restore:',
            'ancestor ACL lease restore:',
            'diagnostic handoff:',
            'account/profile cleanup:',
            'sandbox cleanup:',
            'parent-only sibling cleanup:'
          )
          $cleanupFailure = @($cleanupFailurePrefixes | Where-Object {
            $firstOutput.Contains($_, [StringComparison]::Ordinal)
          } | Select-Object -First 1)
          if ($cleanupFailure.Count -ne 0) {
            throw 'packaged Devin connector contract reported incomplete disposable-user cleanup'
          }
          if (-not $firstOutput.Contains($retrySignal, [StringComparison]::Ordinal)) {
            throw 'packaged Devin connector contract failed without the retryable telemetry signal'
          }
          Write-BoundedText -Path (Join-Path $diagnosticsRoot 'devin-event-history-retry.txt') `
            -MaxBytes 4096 -Text "attempt=1`nsignal=$retrySignal"
          try {
            Invoke-WindowsNativeProcess -FilePath $pwsh -ArgumentList @(
              '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $nativeHarness,
              '-Operation', 'capture', '-StateRoot', $contractStateRoot,
              '-DiagnosticsRoot', (Join-Path $diagnosticsRoot 'attempt-1-state')
            ) -TimeoutSeconds 120 -LogPath (
              Join-Path $diagnosticsRoot 'attempt-1-capture.log'
            ) | Out-Null
          } catch {
            Write-BoundedText -Path (Join-Path $diagnosticsRoot 'attempt-1-capture-failure.log') `
              -MaxBytes 32768 -Text $_.Exception.Message
            Write-Warning 'bounded first-attempt state capture failed; cleanup remains mandatory'
          }
          Invoke-WindowsNativeProcess -FilePath $pwsh -ArgumentList @(
            '-NoLogo', '-NoProfile', '-NonInteractive', '-File', $nativeHarness,
            '-Operation', 'cleanup', '-StateRoot', $contractStateRoot
          ) -TimeoutSeconds 180 -LogPath (
            Join-Path $diagnosticsRoot 'attempt-1-cleanup.log'
          ) | Out-Null
          if ((Test-Path -LiteralPath $contractStateRoot) -or
              @(Get-StateProcesses $contractStateRoot).Count -ne 0) {
            throw 'Devin retry cleanup did not remove its exact state and rooted processes'
          }
          # The wrapper creates a GUID-named user/profile/sandbox on every call.
          $second = Invoke-DevinContractAttempt 2
          if ($second.ExitCode -ne 0) {
            throw 'packaged Devin connector contract failed on its final attempt'
          }
          'retried=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload deterministic contract results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-contract-results-${{ matrix.connector }}
          path: ${{ env.DC_STATE_ROOT }}\results.jsonl
          if-no-files-found: warn
          retention-days: 5
      - name: Capture bounded redacted diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload diagnostics on failure or recovered Devin retry
        if: ${{ failure() || cancelled() || steps.devin_contract.outputs.retried == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-contract-diagnostics-${{ matrix.connector }}
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  omnigent-native-degraded:
    name: Windows x64 OmniGent native degraded
    needs: [powershell-static, package-artifact]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Initialize isolated paths
        run: ./scripts/initialize-windows-native-ci-paths.ps1 -Leaf omnigent -DiagnosticsLeaf windows-native-diagnostics-omnigent -ArtifactLeaf windows-native-dist
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-package
          path: ${{ env.DC_ARTIFACT_ROOT }}
      - name: Official OmniGent 0.7.0 packaged Setup lifecycle and server/policy contract
        run: >-
          ./scripts/invoke-windows-setup-standard-user-ci.ps1
          -Mode omnigent-native-degraded
          -StateRoot $env:DC_STATE_ROOT
          -ArtifactRoot $env:DC_ARTIFACT_ROOT
          -DiagnosticsRoot $env:DC_DIAGNOSTICS
          -TimeoutSeconds 1800
      - name: Capture bounded diagnostics
        if: ${{ failure() || cancelled() }}
        run: ./scripts/windows-native-ci.ps1 -Operation capture -StateRoot $env:DC_STATE_ROOT -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload advisory diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-omnigent-advisory-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: ignore
          retention-days: 5
      - name: Always clean isolated processes, listeners, and temp state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  release-validator-replay:
    name: Windows exact release validator replay
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_candidate_replay_run_id != ''
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      # Download the sealed candidate from its producing run and check out the
      # repository containing the replay validator and signature verifier.
      actions: read
      contents: read
    env:
      REPLAY_RUN_ID: ${{ inputs.release_candidate_replay_run_id }}
      REPLAY_ARTIFACT: ${{ inputs.release_candidate_replay_artifact }}
      REPLAY_VERSION: ${{ inputs.release_candidate_replay_version }}
      REPLAY_COMMIT: ${{ inputs.release_candidate_replay_commit }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate exact replay identity
        run: |
          if ($env:REPLAY_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw 'release candidate replay run ID must be a positive integer'
          }
          $escapedRunID = [regex]::Escape($env:REPLAY_RUN_ID)
          if ($env:REPLAY_ARTIFACT -notmatch (
              "^release-candidate-${escapedRunID}-[1-9][0-9]*$"
          )) {
            throw 'release candidate replay artifact must bind the exact run ID and attempt'
          }
          if ($env:REPLAY_VERSION -notmatch (
              '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          )) {
            throw 'release candidate replay version must be canonical X.Y.Z'
          }
          if ($env:REPLAY_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'release candidate replay commit must be an exact lowercase SHA'
          }
      - name: Initialize isolated replay paths
        run: >-
          ./scripts/initialize-windows-native-ci-paths.ps1
          -Leaf release-replay
          -DiagnosticsLeaf windows-release-validator-replay-diagnostics
          -ArtifactLeaf windows-release-validator-replay
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Stage pinned Windows Cosign verifier
        run: ./scripts/install-pinned-windows-cosign.ps1
      - name: Download exact sealed release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.release_candidate_replay_artifact }}
          path: ${{ env.DC_ARTIFACT_ROOT }}\transport
          repository: cisco-ai-defense/defenseclaw
          run-id: ${{ inputs.release_candidate_replay_run_id }}
          github-token: ${{ github.token }}
      - name: Restore and authenticate exact release candidate
        run: |
          $candidateRoot = Join-Path $env:DC_ARTIFACT_ROOT 'candidate'
          python scripts/release_candidate.py unpack-transport `
            --archive (Join-Path $env:DC_ARTIFACT_ROOT 'transport\release-candidate.tar') `
            --destination $candidateRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_candidate.py verify `
            --root $candidateRoot `
            --version $env:REPLAY_VERSION `
            --commit $env:REPLAY_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $certificateIdentity = (
            "https://github.com/$env:GITHUB_REPOSITORY/.github/workflows/release.yaml@refs/heads/main"
          )
          python scripts/verify-sigstore-blob.py `
            --certificate (Join-Path $candidateRoot 'dist\checksums.txt.pem') `
            --signature (Join-Path $candidateRoot 'dist\checksums.txt.sig') `
            --certificate-identity $certificateIdentity `
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' `
            (Join-Path $candidateRoot 'dist\checksums.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DC_REPLAY_RELEASE_DIR=$(Join-Path $candidateRoot 'dist')" >> $env:GITHUB_ENV
      - name: Replay current validator against exact failed candidate
        run: |
          $replayState = Join-Path $env:DC_STATE_ROOT (
            'defenseclaw-bootstrap-acceptance-' + [guid]::NewGuid().ToString('N')
          )
          ./scripts/test-fresh-install-release-windows.ps1 `
            -ReleaseDir $env:DC_REPLAY_RELEASE_DIR `
            -TargetVersion $env:REPLAY_VERSION `
            -UninstallContract deferred `
            -StateRoot $replayState `
            -DiagnosticsRoot $env:DC_DIAGNOSTICS
      - name: Upload exact replay diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-validator-replay-diagnostics
          path: ${{ env.DC_DIAGNOSTICS }}\**
          if-no-files-found: warn
          retention-days: 7
      - name: Always clean exact replay state
        if: ${{ always() }}
        run: ./scripts/windows-native-ci.ps1 -Operation cleanup -StateRoot $env:DC_STATE_ROOT

  windows-native-required:
    name: Windows Native Required
    if: ${{ always() }}
    needs:
      - windows-go
      - windows-python
      - powershell-static
      - package-artifact
      - packaged-acceptance
      - public-bootstrap-acceptance
      - connector-contract
      - omnigent-native-degraded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Fail unless every deterministic Windows validation job succeeded
        run: |
          $results = $env:REQUIRED_RESULTS | ConvertFrom-Json
          $failed = @($results.PSObject.Properties | Where-Object { $_.Value.result -ne 'success' })
          if ($failed.Count) {
            $summary = $failed | ForEach-Object { "$($_.Name)=$($_.Value.result)" }
            throw "Required Windows validation did not succeed: $($summary -join ', ')"
          }
          Write-Host 'Every required deterministic native Windows x64 validation job succeeded; this does not certify preview connectors.'
