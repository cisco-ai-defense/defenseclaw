name: Edge Connector CI

on:
  push:
    branches: [main]
    paths:
      - 'edge-connector/**'
      - 'internal/fleet/**'
      - '.github/workflows/edge-connector-ci.yml'
  pull_request:
    paths:
      - 'edge-connector/**'
      - 'internal/fleet/**'
      - '.github/workflows/edge-connector-ci.yml'

permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-c-engine:
    name: Build C Engine (STANDARD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Configure (STANDARD profile)
        run: cmake -B build -DDCLAW_PROFILE=STANDARD
        working-directory: edge-connector
      - name: Build
        run: cmake --build build
        working-directory: edge-connector
      - name: Run CTests
        run: ctest --test-dir build --output-on-failure
        working-directory: edge-connector

  go-fleet-tests:
    name: Go Fleet Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Run fleet tests with race detector
        run: go test ./internal/fleet/... -count=1 -race -timeout 15m
