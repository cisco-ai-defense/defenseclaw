# Fork-safe validation for the public enterprise Setup boundary. The real
# CMID-enabled gateway and signed installer are assembled only in the protected
# release/AVC process; pull-request CI never receives private-repository or
# signing credentials.

name: Windows Enterprise Setup

on:
  pull_request:
    branches:
      - windows-avc-machine-installer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-enterprise-setup-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  public-contracts:
    name: Validate public enterprise Setup contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out DefenseClaw
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test the public installer contracts
        run: >-
          go test -count=1
          ./cmd/defenseclaw-enterprise-setup
          ./cmd/defenseclaw-setup
          ./internal/windowsresources
          ./internal/tools/windowsresources

      - name: Vet the public installer contracts
        run: >-
          go vet
          ./cmd/defenseclaw-enterprise-setup
          ./cmd/defenseclaw-setup
          ./internal/windowsresources
          ./internal/tools/windowsresources

      - name: Cross-compile the native Windows bootstrap and tests
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go test -c \
            -o "${RUNNER_TEMP}/defenseclaw-enterprise-setup.test.exe" \
            ./cmd/defenseclaw-enterprise-setup
          go build -trimpath \
            -o "${RUNNER_TEMP}/DefenseClawSetup-Enterprise-x64.exe" \
            ./cmd/defenseclaw-enterprise-setup

      - name: Parse the public PowerShell assembly boundary
        shell: pwsh
        run: |
          $failures = [Collections.Generic.List[string]]::new()
          @(
            'packaging/scripts/lib/assemble.ps1',
            'packaging/scripts/lib/assert-cisco-signature.ps1',
            'packaging/scripts/lib/finalize.ps1',
            'packaging/scripts/lib/repro-flags.ps1',
            'packaging/windows/install-enterprise.ps1',
            'packaging/windows/DefenseClawEnterprise.psm1'
          ) | ForEach-Object {
            $path = (Resolve-Path -LiteralPath $_).Path
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            foreach ($parseError in @($errors)) {
              $failures.Add("${path}: ${parseError}")
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }

      - name: Validate the managed bundle shell boundary
        shell: bash
        run: bash -n packaging/scripts/build-managed-windows-bundle.sh

      - name: Assert the GA release-gate is satisfied by Windows IPC peer auth
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          # internal/ipc/authposture_gagate.go references
          # authpostureGAApproved under -tags ga. The symbol is defined
          # only next to the accept-time peer authentication
          # (peerauth_windows.go, peerauth_unix.go), so a release-candidate
          # build compiles exactly when that authentication is present.
          # Removing it makes these builds fail again.
          for target in windows/amd64 windows/arm64 darwin/arm64 linux/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -tags ga ./internal/ipc/...
            echo "go build -tags ga ./internal/ipc/... succeeded for ${target}"
          done
          # The Windows peer-auth unit tests and syscall layer must build.
          GOOS=windows GOARCH=amd64 go vet -tags ga ./internal/ipc/...
          GOOS=windows GOARCH=amd64 go test -c -o "${RUNNER_TEMP}/ipc-windows.test.exe" ./internal/ipc
          # Platform-neutral admission policy tests and the release-time
          # peer-kind assertion run natively here.
          go test -count=1 -run 'WindowsPeer|NewWindowsPeerPolicy|CanonicalWindowsDrivePath|CodesignStateLabel' ./internal/ipc
          go test -count=1 -run 'EffectivePeerAuthKind|ValidateWindowsSecureClient|ValidateManagedIPCPeerAuthKnobs|DefaultSecureClientPolicy' ./internal/config
