name: Release

# Actions -> Release -> Run workflow on main. Builds every asset once, signs
# checksums.txt, installs and upgrades the result on every platform, then
# publishes it as the latest release. Installed clients upgrade by running the
# latest release's install.sh / install.ps1, so nothing else needs updating.
#
# Keep this file's name and run it from main only: installers verify
# checksums.txt against this workflow's Sigstore identity, and 0.8.8-0.8.10
# clients trust the legacy channel only when this workflow signed it.
#
# dry_run: true builds and checks every asset from any ref, for any version,
# without the release environment's secrets. It never signs to the public
# Sigstore log, creates a release or draft, or pushes a tag, branch, package or
# image; the unsigned assets and an unsigned checksums.txt are uploaded as the
# run's "release" artifact instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z)"
        required: true
        type: string
      draft:
        description: "Stop at a draft release (publish later with: gh release edit X.Y.Z --draft=false --latest)"
        required: false
        type: boolean
        default: false
      allow_unnotarized_macos_app:
        description: "Publish an ad-hoc signed macOS app when the Apple secrets are missing (it runs without administrator mode)"
        required: false
        type: boolean
        default: false
      operation:
        description: "release, or legacy-channel to point 0.8.8-0.8.10 upgrades at an already published 1.x release (run once)"
        required: false
        type: choice
        options:
          - release
          - legacy-channel
        default: release
      dry_run:
        description: "Build and check everything unsigned from any ref, upload the assets as workflow artifacts, publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A dry run gets its own queue, so a pending dry run never replaces a pending
# release (a group keeps one pending run).
concurrency:
  group: release-${{ github.repository }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only to list draft releases, which a read-only token cannot see; the
    # job's steps make no changes.
    permissions:
      contents: write
    outputs:
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - name: Check ref, version and release state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          # refuse MESSAGE: stop a release; a dry run only notes it, since it publishes nothing.
          refuse() {
            if [[ "$DRY_RUN" == true ]]; then echo "::notice title=Dry run::$1 (allowed in a dry run)"; return 0; fi
            echo "::error::$1"; exit 1
          }
          if [[ "$DRY_RUN" == true ]]; then
            [[ "$OPERATION" == release ]] || { echo "::error::dry_run supports operation: release only"; exit 1; }
            echo "dry run: nothing published. The unsigned assets and checksums.txt are uploaded as the run's release artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          [[ "$GITHUB_REF" == refs/heads/main ]] || refuse "Run the Release workflow from main"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1; }
          # Only "no release yet" means there is no latest; any other failure stops the run.
          if ! latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>latest.err)"; then
            grep -qi 'release not found' latest.err \
              || { cat latest.err >&2; echo "::error::Could not read the latest release"; exit 1; }
            latest=""
          fi
          if [[ "$OPERATION" == legacy-channel ]]; then
            [[ "$latest" == "$VERSION" ]] || { echo "::error::$VERSION must be the published latest release (latest is $latest)"; exit 1; }
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>tag.err; then
              refuse "Tag $VERSION already exists; releases are immutable, use the next patch version"
            else
              # Only a 404 means the tag is free; any other failure stops the run.
              grep -q 'HTTP 404' tag.err || { cat tag.err >&2; echo "::error::Could not check whether tag $VERSION exists"; exit 1; }
            fi
            # A draft has no tag yet, so look for one by name too.
            drafts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" -q ".[] | select(.tag_name == \"$VERSION\") | .id")"
            [[ -z "$drafts" ]] || refuse "A release (or draft) for $VERSION already exists; delete the draft or use the next patch version"
            [[ "$VERSION" != 0.* ]] || refuse "Releases start at 1.0.0; 0.x is retired"
            # Publishing marks the release latest, so it must not move latest backwards.
            if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]]; then
              refuse "$VERSION is older than the latest release $latest"
            fi
          fi
          # The previous 1.x release is the upgrade-test baseline. It must be
          # older than VERSION, which only a dry run can get wrong.
          if [[ "$latest" =~ ^[1-9][0-9]*\. && "$latest" != "$VERSION" \
              && "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" == "$VERSION" ]]; then
            echo "previous=$latest" >> "$GITHUB_OUTPUT"
          elif [[ "$DRY_RUN" == true && "$latest" =~ ^[1-9][0-9]*\. ]]; then
            echo "::notice title=Dry run::No older 1.x release to upgrade from; install-gate skips the upgrade-previous lanes"
          fi

  build:
    name: Build assets
    if: inputs.operation == 'release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/defenseclaw/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
      - uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0

      # The tag stays in this job's checkout. A dry run may rebuild a version
      # that is already tagged, so it moves the local copy to this commit.
      - name: Tag the build commit locally
        run: |
          if [[ "$DRY_RUN" == true ]]; then git tag -d "$VERSION" >/dev/null 2>&1 || true; fi
          git tag "$VERSION"

      - name: Build the OpenClaw plugin into the gateway embed tree
        run: |
          set -euo pipefail
          scripts/stamp-version.sh "$VERSION"
          python3 scripts/source_release_identity.py check --expected-release "$VERSION"
          make extensions
          # goreleaser needs a clean tree; the embedded plugin is gitignored.
          git restore --worktree -- .
          test -z "$(git status --porcelain)"

      # .goreleaser.yaml disables its release and has no publishers; a dry run
      # also skips the publish stage outright.
      - name: Build gateway archives and SBOMs
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: "v2.15.4"
          args: release --clean${{ inputs.dry_run && ' --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the wheel, hashed requirements and installers
        run: |
          set -euo pipefail
          scripts/stamp-version.sh "$VERSION"
          make dist-cli dist-installers dist-requirements DIST_DIR=assets
          cp dist/defenseclaw-"$VERSION"-*.tar.gz dist/defenseclaw-"$VERSION"-*.zip assets/
          cp dist/*.sbom.json assets/ 2>/dev/null || true
          ls -l assets

      - name: Collect the standalone enterprise packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          enterprise=(dist/defenseclaw-enterprise-"$VERSION"-*)
          (( ${#enterprise[@]} > 0 )) || { echo "::error::goreleaser produced no defenseclaw-enterprise artifacts"; exit 1; }
          cp "${enterprise[@]}" assets/
          ls -l assets/defenseclaw-enterprise-*

      # Optional: GPG detached signatures for the Linux enterprise packages
      # (signed trust in packaging/mdm/linux). Without the secret the
      # packages rely on the cosign-signed checksums.txt (hash-pinned trust).
      # A dry run never reads the secret.
      - name: Sign the enterprise Linux packages (optional)
        env:
          ENTERPRISE_GPG_PRIVATE_KEY: ${{ !inputs.dry_run && secrets.ENTERPRISE_GPG_PRIVATE_KEY || '' }}
          ENTERPRISE_GPG_PASSPHRASE: ${{ !inputs.dry_run && secrets.ENTERPRISE_GPG_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${ENTERPRISE_GPG_PRIVATE_KEY:-}" ]]; then
            echo "::notice title=Unsigned enterprise Linux packages::ENTERPRISE_GPG_PRIVATE_KEY is not set; the packages ship hash-pinned through checksums.txt."
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 0700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$ENTERPRISE_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          passphrase="$GNUPGHOME/passphrase"
          printf '%s' "${ENTERPRISE_GPG_PASSPHRASE:-}" > "$passphrase"
          shopt -s nullglob
          for file in assets/defenseclaw-enterprise-"$VERSION"-linux-*; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase" \
              --armor --detach-sign --output "$file.asc" "$file"
            gpg --batch --verify "$file.asc" "$file"
          done
          gpg --batch --armor --export > assets/defenseclaw-enterprise-release-key.asc

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assets
          path: assets/
          if-no-files-found: error
          retention-days: 7

  macos-app:
    name: Build macOS app
    if: inputs.operation == 'release'
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    # A dry run runs outside the release environment and blanks every secret,
    # so it never signs, notarizes or uploads to Apple. (An empty name means no
    # environment; `dry_run && '' || 'release'` would always pick 'release'.)
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    outputs:
      verification: ${{ steps.app.outputs.verification_status }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check the reviewed macOS upstream pin
        run: python3 scripts/check-macos-upstream.py --offline
      - name: Build, sign, notarize and package
        id: app
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ !inputs.dry_run && secrets.MACOS_DEVELOPER_ID_P12_BASE64 || '' }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ !inputs.dry_run && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || '' }}
          MACOS_SIGNING_IDENTITY: ${{ !inputs.dry_run && secrets.MACOS_SIGNING_IDENTITY || '' }}
          MACOS_NOTARY_KEY_BASE64: ${{ !inputs.dry_run && secrets.MACOS_NOTARY_KEY_BASE64 || '' }}
          MACOS_NOTARY_KEY_ID: ${{ !inputs.dry_run && secrets.MACOS_NOTARY_KEY_ID || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ !inputs.dry_run && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
          MACOS_REQUIRE_NOTARIZATION: "false"
        run: |
          set -euo pipefail
          # All five Apple secrets, or none: a partial set is a misconfiguration.
          count=0
          for value in "${MACOS_DEVELOPER_ID_P12_BASE64:-}" "${MACOS_DEVELOPER_ID_P12_PASSWORD:-}" \
              "${MACOS_NOTARY_KEY_BASE64:-}" "${MACOS_NOTARY_KEY_ID:-}" "${MACOS_NOTARY_ISSUER_ID:-}"; do
            [[ -z "$value" ]] || count=$((count + 1))
          done
          if (( count != 0 && count != 5 )); then
            echo "::error::Only $count of the 5 macOS signing and notarization secrets are set; set all or none"; exit 1
          fi
          scripts/build-macos-app-release.sh "$VERSION" macos-out
      - name: Verify the app bundle
        env:
          VERIFICATION_STATUS: ${{ steps.app.outputs.verification_status }}
          ALLOW_UNNOTARIZED: ${{ inputs.allow_unnotarized_macos_app }}
        run: |
          scripts/verify-macos-app-release.sh "$VERSION" macos-out "$VERIFICATION_STATUS"
          if [[ "$VERIFICATION_STATUS" != notarized ]]; then
            # install.sh puts this app on users' Macs, so an ad-hoc signed one
            # ships only when asked for. A dry run ships nothing.
            if [[ "$ALLOW_UNNOTARIZED" != true && "$DRY_RUN" != true ]]; then
              echo "::error title=Unnotarized macOS app::The Apple signing secrets are missing, so the app is only ad-hoc signed. Set them in the release environment, or re-run with allow_unnotarized_macos_app: true."
              exit 1
            fi
            echo "::warning title=Unnotarized macOS app::Apple credentials were absent; the app is ad-hoc signed."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app
          path: |
            macos-out/DefenseClawMac-${{ inputs.version }}-macos-arm64.zip
            macos-out/DefenseClawMac-${{ inputs.version }}-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  # Standalone managed-enterprise Setup for MDMs (packaging/mdm). Signed with
  # Authenticode only when a code-signing certificate is configured;
  # otherwise it ships hash-pinned (flavor standalone-unsigned).
  enterprise-windows:
    name: Build the standalone Windows enterprise Setup
    if: inputs.operation == 'release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A dry run has no environment and no certificate, so it never signs.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # build-setup.sh builds the Python scanner runtime with uv.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Build, and Authenticode-sign when a certificate is configured
        env:
          WINDOWS_AUTHENTICODE_PFX_BASE64: ${{ !inputs.dry_run && secrets.WINDOWS_AUTHENTICODE_PFX_BASE64 || '' }}
          WINDOWS_AUTHENTICODE_PFX_PASSWORD: ${{ !inputs.dry_run && secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD || '' }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --out-dir enterprise-windows)
          if [[ -n "${WINDOWS_AUTHENTICODE_PFX_BASE64:-}" ]]; then
            sudo apt-get install -y -q osslsigncode
            AUTHENTICODE_PFX="$RUNNER_TEMP/codesign.pfx"; export AUTHENTICODE_PFX
            ( umask 077; printf '%s' "$WINDOWS_AUTHENTICODE_PFX_BASE64" | base64 --decode > "$AUTHENTICODE_PFX" )
            trap 'rm -f "$AUTHENTICODE_PFX"' EXIT
            export AUTHENTICODE_PFX_PASSWORD="${WINDOWS_AUTHENTICODE_PFX_PASSWORD:-}"
            args+=(--sign-command "$GITHUB_WORKSPACE/packaging/mdm/signing/authenticode-sign.sh")
          else
            echo "::notice title=Unsigned standalone Setup::WINDOWS_AUTHENTICODE_PFX_BASE64 is not set; the Setup ships hash-pinned (flavor standalone-unsigned)."
          fi
          packaging/windows/standalone/build-setup.sh "${args[@]}"
          mv enterprise-windows/payload-manifest.json \
            enterprise-windows/DefenseClawSetup-Enterprise-Standalone-x64.payload-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-windows
          path: |
            enterprise-windows/DefenseClawSetup-Enterprise-Standalone-x64.exe
            enterprise-windows/DefenseClawSetup-Enterprise-Standalone-x64.payload-manifest.json
          if-no-files-found: error
          retention-days: 7

  # Standalone managed-enterprise pkg for MDMs. Developer ID signing and
  # notarization run only when the Apple installer secrets are configured;
  # without them the pkg ships unsigned, pinned by its SHA-256 in the
  # cosign-signed checksums.txt, and the release notes say so.
  enterprise-macos:
    name: Build the standalone macOS enterprise package
    if: inputs.operation == 'release'
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    # A dry run has no environment and no Apple secrets, so it never signs,
    # notarizes or uploads to Apple.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    outputs:
      pkg_signed: ${{ steps.pkg.outputs.signed }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build, sign and notarize when Apple credentials are configured
        id: pkg
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ !inputs.dry_run && secrets.MACOS_DEVELOPER_ID_P12_BASE64 || '' }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ !inputs.dry_run && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || '' }}
          MACOS_SIGNING_IDENTITY: ${{ !inputs.dry_run && secrets.MACOS_SIGNING_IDENTITY || '' }}
          MACOS_INSTALLER_P12_BASE64: ${{ !inputs.dry_run && secrets.MACOS_INSTALLER_P12_BASE64 || '' }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ !inputs.dry_run && secrets.MACOS_INSTALLER_P12_PASSWORD || '' }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ !inputs.dry_run && secrets.MACOS_INSTALLER_SIGNING_IDENTITY || '' }}
          MACOS_NOTARY_KEY_BASE64: ${{ !inputs.dry_run && secrets.MACOS_NOTARY_KEY_BASE64 || '' }}
          MACOS_NOTARY_KEY_ID: ${{ !inputs.dry_run && secrets.MACOS_NOTARY_KEY_ID || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ !inputs.dry_run && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
        run: |
          set -euo pipefail
          packaging/mdm/signing/build-macos-release.sh "$VERSION" enterprise-macos
          pkg="defenseclaw-enterprise-$VERSION-darwin-arm64.pkg"
          if pkgutil --check-signature "enterprise-macos/$pkg" 2>/dev/null \
              | grep -q 'signed by a developer certificate issued by Apple for distribution'; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "$pkg is unsigned. Deployments verify it by its SHA-256 in the cosign-signed checksums.txt." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-macos
          path: enterprise-macos/defenseclaw-enterprise-${{ inputs.version }}-darwin-arm64.pkg
          if-no-files-found: error
          retention-days: 7

  # Signing writes to the public Sigstore log, so a dry run skips this job.
  sign:
    name: Checksum and sign
    if: ${{ !inputs.dry_run }}
    needs: [build, macos-app, enterprise-windows, enterprise-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: "v2.6.3"
      - name: Write and sign checksums.txt
        run: |
          set -euo pipefail
          [[ "$DRY_RUN" != true ]] || { echo "::error::A dry run never signs"; exit 1; }
          cd release
          find . -maxdepth 1 -type f ! -name '.*' | sed 's#^\./##' | sort | xargs sha256sum > checksums.txt
          grep -Eq '  install\.sh$' checksums.txt && grep -Eq '  install\.ps1$' checksums.txt \
            && grep -Eq '  defenseclaw-upgrade\.sh$' checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.bundle \
            --output-signature checksums.txt.sig --output-certificate checksums.txt.pem checksums.txt
          cosign verify-blob --bundle checksums.txt.bundle \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  # The dry run's stand-in for sign: the same checksums.txt, unsigned, and the
  # same "release" artifact, which is where a dry run's assets end up.
  dry-run-assets:
    name: Checksum the dry-run assets (unsigned)
    if: inputs.dry_run
    needs: [build, macos-app, enterprise-windows, enterprise-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Write checksums.txt (not signed)
        env:
          APP_VERIFICATION: ${{ needs.macos-app.outputs.verification }}
          PKG_SIGNED: ${{ needs.enterprise-macos.outputs.pkg_signed }}
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name '.*' | sed 's#^\./##' | sort | xargs sha256sum > checksums.txt
          grep -Eq '  install\.sh$' checksums.txt && grep -Eq '  install\.ps1$' checksums.txt \
            && grep -Eq '  defenseclaw-upgrade\.sh$' checksums.txt
          {
            echo "## dry run: nothing published"
            echo
            echo "Nothing was signed, released, tagged or pushed. The assets and an unsigned checksums.txt are this run's \`release\` artifact."
            echo "macOS app: ${APP_VERIFICATION:-unknown}. macOS enterprise pkg signed: ${PKG_SIGNED:-unknown}."
            echo
            echo '```'
            cat checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 3

  install-gate:
    name: Install and upgrade (${{ matrix.os }})
    needs: [validate, sign, dry-run-assets]
    # Either sign or dry-run-assets runs, never both. A dry run's assets have
    # no signature bundle, so the installers take their checksum-only path for
    # --local assets ("relying on checksums") and the fresh lane skips its
    # signature check.
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
      ((!inputs.dry_run && needs.sign.result == 'success') ||
      (inputs.dry_run && needs.dry-run-assets.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PREVIOUS: ${{ needs.validate.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Note the checksum-only verification
        if: inputs.dry_run
        shell: bash
        run: echo "::notice title=Dry run::These assets are unsigned; the installers verify them against checksums.txt only."
      - name: Fetch the previous release
        if: env.PREVIOUS != ''
        shell: bash
        run: gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous
      # The fresh lane then checks the installer verifies this release's
      # signature, and the 0.8.4 installer needs cosign to run at all.
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        if: runner.os != 'Windows'
        with:
          cosign-release: "v2.6.3"
      - name: Lifecycle (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          lanes="fresh upgrade-0.8.10 upgrade-0.8.4 handoff"
          args=()
          if [[ -n "$PREVIOUS" ]]; then
            lanes="$lanes upgrade-previous"; args+=(--previous-assets previous)
            [[ "$RUNNER_OS" == macOS ]] && lanes="$lanes macos-app"
          fi
          lanes="$lanes drills"
          scripts/test-install-lifecycle.sh --assets release --lanes "$lanes" ${args[@]+"${args[@]}"}
      - name: Lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lanes = @('fresh', 'setup-import', 'files-in-use', 'failure-drill', 'policy')
          $extra = @{}
          if ($env:PREVIOUS) { $lanes += 'upgrade-previous', 'shim'; $extra['PreviousAssets'] = 'previous' }
          & scripts/test-install-lifecycle.ps1 -Assets release -Lanes ($lanes -join ' ') @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Upgrades the previous release's standalone enterprise packages to this
  # release's, through the lane scripts' --upgrade-from mode: the upgrade
  # keeps the administrator config intent, secrets and guardian ledger and
  # reports the applied policy, and on Linux and macOS a failed upgrade rolls
  # back (the root-only lifecycle test fault). The lane names are stable
  # check names. Without a previous 1.x release every lane is a notice.
  enterprise-upgrade-gate:
    name: Enterprise Upgrade (${{ matrix.lane }})
    needs: [validate, sign, dry-run-assets]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
      ((!inputs.dry_run && needs.sign.result == 'success') ||
      (inputs.dry_run && needs.dry-run-assets.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: deb
            runner: ubuntu-latest
            asset: linux-amd64.deb
          - lane: rpm-el9
            runner: ubuntu-24.04
            asset: linux-amd64.rpm
            image: registry.access.redhat.com/ubi9/ubi-init@sha256:762319bbd0b15a4eff9078eb373b1f426de3e8b5560cf314715c62844b7b0fc8
          - lane: pkg
            runner: macos-15
            asset: darwin-arm64.pkg
          - lane: Windows
            runner: windows-latest
            asset: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PREVIOUS: ${{ needs.validate.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
      LANE: ${{ matrix.lane }}
      LANE_ASSET: ${{ matrix.asset }}
      LANE_IMAGE: ${{ matrix.image }}
    steps:
      - name: Note a release with nothing to upgrade from
        if: env.PREVIOUS == ''
        shell: bash
        run: echo "::notice title=Enterprise upgrade::No previous 1.x release, so there is no enterprise package to upgrade from"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: env.PREVIOUS != ''
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: env.PREVIOUS != ''
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        if: env.PREVIOUS != ''
        with:
          cosign-release: "v2.6.3"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.PREVIOUS != ''
        with:
          name: release
          path: release
      - name: Fetch and verify the previous release's enterprise package
        id: previous
        if: env.PREVIOUS != ''
        shell: bash
        run: >-
          bash scripts/fetch-previous-enterprise-package.sh --asset "$LANE_ASSET" --version "$PREVIOUS" --require
          --dir "$RUNNER_TEMP/previous" --github-output "$GITHUB_OUTPUT"
      - name: Remove group and other write access from the runner /opt
        if: env.PREVIOUS != '' && matrix.lane == 'deb'
        shell: bash
        run: sudo chmod go-w /opt
      - name: Give the runner Windows log folder its usual owner and access
        if: env.PREVIOUS != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $logs = Join-Path $env:windir 'Logs'
          $account = (Get-LocalUser | Where-Object { $_.SID.Value -like 'S-1-5-21-*-500' }).SID.Value
          icacls $logs /setowner '*S-1-5-32-544' | Out-Null
          if ($account) {
            icacls $logs /inheritance:d | Out-Null
            icacls $logs /remove:g "*$account" | Out-Null
          }
      - name: Upgrade, drill the rollback, converge, verify and remove
        if: env.PREVIOUS != '' && runner.os != 'Windows'
        shell: bash
        env:
          PREVIOUS_PACKAGE: ${{ steps.previous.outputs.package }}
        run: |
          set -euo pipefail
          args=(--package "release/defenseclaw-enterprise-${VERSION}-${LANE_ASSET}" --version "$VERSION"
            --upgrade-from "$PREVIOUS_PACKAGE" --previous-version "$PREVIOUS" --results "$RUNNER_TEMP/lane-results")
          if [ "$LANE" = rpm-el9 ]; then
            bash scripts/test-enterprise-linux-container.sh --image "$LANE_IMAGE" "${args[@]}"
          else
            sudo bash scripts/test-enterprise-unix-install.sh "${args[@]}"
          fi
      - name: Upgrade, converge, verify and remove the standalone services
        if: env.PREVIOUS != '' && runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/test-enterprise-windows-install.ps1
          -Setup (Resolve-Path 'release\DefenseClawSetup-Enterprise-Standalone-x64.exe').Path
          -Version $env:VERSION -ResultsRoot (Join-Path $env:RUNNER_TEMP 'lane-results')
          -UpgradeFrom '${{ steps.previous.outputs.package }}' -PreviousVersion $env:PREVIOUS
      - name: Make the lifecycle results readable
        if: always() && env.PREVIOUS != '' && runner.os != 'Windows'
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/lane-results" 2>/dev/null || true
      - name: The upgrade kept the administrator config intent
        if: env.PREVIOUS != ''
        shell: bash
        run: >-
          uv run --no-project --with pyyaml==6.0.3 python scripts/check_enterprise_upgrade_config.py
          --before "$RUNNER_TEMP/lane-results/config-v8.yaml"
          --after "$RUNNER_TEMP/lane-results/config-upgraded.yaml"
          --record "$RUNNER_TEMP/lane-results/migration-v9.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.PREVIOUS != ''
        with:
          name: enterprise-upgrade-results-${{ matrix.lane }}
          path: ${{ runner.temp }}/lane-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    # Explicit results: dry-run-assets is always skipped here, and a skipped
    # job anywhere upstream would make the implicit success() false.
    if: >-
      ${{ !inputs.dry_run && !cancelled() && needs.sign.result == 'success' &&
      needs.install-gate.result == 'success' && needs.enterprise-upgrade-gate.result == 'success' &&
      needs.enterprise-macos.result == 'success' }}
    needs: [sign, install-gate, enterprise-upgrade-gate, enterprise-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PKG_SIGNED: ${{ needs.enterprise-macos.outputs.pkg_signed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Create the release
        run: |
          set -euo pipefail
          [[ "$DRY_RUN" != true ]] || { echo "::error::A dry run never publishes"; exit 1; }
          # Notes given with --generate-notes go above the generated ones.
          notes=()
          if [[ "$PKG_SIGNED" != true ]]; then
            pkg="defenseclaw-enterprise-$VERSION-darwin-arm64.pkg"
            printf '%s\n\n' "**macOS enterprise package:** \`$pkg\` is unsigned (not Developer ID-signed or notarized). Verify the cosign signature on \`checksums.txt\`, then the pkg against its SHA-256 in \`checksums.txt\`." > notes.md
            echo "$pkg ships unsigned; the release notes say to verify it through the cosign-signed checksums.txt." >> "$GITHUB_STEP_SUMMARY"
            notes=(--notes-file notes.md)
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes ${notes[@]+"${notes[@]}"} --draft release/*
          if [[ "${{ inputs.draft }}" != true ]]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            echo "Published $VERSION as the latest release"
          else
            echo "Draft $VERSION is ready; publish with: gh release edit $VERSION --draft=false --latest"
          fi

  # One-time bridge for 0.8.8-0.8.10: their `defenseclaw upgrade` follows the
  # signed stable pointer on the release-channel branch. Point it at a
  # published 1.x release whose defenseclaw-upgrade.sh hands off to install.sh.
  # Uses the 0.8.10 publisher unchanged, so no 0.x code lives on main.
  legacy-channel:
    name: Point 0.8.x upgrades at ${{ inputs.version }}
    # validate refuses a legacy-channel dry run; this is the second guard.
    if: inputs.operation == 'legacy-channel' && !inputs.dry_run
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: "0.8.10"
          path: legacy
          persist-credentials: false
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: "v2.6.3"
      - name: Verify the release's handoff and checksums
        run: |
          set -euo pipefail
          mkdir target && cd target
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            -p checksums.txt -p checksums.txt.bundle -p defenseclaw-upgrade.sh -p install.sh -p install.ps1
          cosign verify-blob --bundle checksums.txt.bundle \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          for name in defenseclaw-upgrade.sh install.sh install.ps1; do
            grep -q "  $name\$" checksums.txt || { echo "::error::checksums.txt does not list $name"; exit 1; }
          done
          sha256sum --check --ignore-missing checksums.txt
          [[ "$(tail -n1 defenseclaw-upgrade.sh)" == "# DefenseClaw upgrade resolver complete v1" ]]
          bash -n defenseclaw-upgrade.sh
      - name: Sign and advance the stable channel
        run: |
          set -euo pipefail
          [[ "$DRY_RUN" != true ]] || { echo "::error::A dry run never pushes the release channel"; exit 1; }
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" -q .sha)"
          RELEASE_TAG="$VERSION" RELEASE_COMMIT="$commit" RELEASE_CHECKSUMS="$GITHUB_WORKSPACE/target/checksums.txt" \
            bash legacy/scripts/publish-release-channel.sh
