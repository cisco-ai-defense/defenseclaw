# Copy to ../scrape.d/fleet.yml only after configuring the optional Fleet
# admin metrics token mount in docker-compose.fleet.yml and a reachable gateway bind.
scrape_configs:
  - job_name: defenseclaw-fleet
    metrics_path: /api/v1/fleet/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/fleet_metrics_token
    static_configs:
      - targets: ["host.docker.internal:18970"]
