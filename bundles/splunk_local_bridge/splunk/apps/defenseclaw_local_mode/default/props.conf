# Field extraction for DefenseClaw events sent via HEC.
# Events arrive as JSON objects; KV_MODE=json extracts every field once at
# search time (action, target, run_id, severity, ...), so standard
# field=value filters work. Every sourcetype the app searches is set here and
# the macros never run spath: spath on top of KV_MODE=json extracts each
# multivalue field a second time and doubles its counts.

[defenseclaw:json]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 0

[otel:log]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[otel:metric]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[otel:trace]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[openclaw:gateway:json]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[openclaw:diagnostics:json]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
