version: 2

project_name: defenseclaw

# The Linux package's preinstall refuses a downgrade before any file is
# replaced: it compares the deployed release with this build's version, which
# is stamped into the copy nfpm packages (packaging/linux/preinstall.sh).
#
# The archives copy each file's mode from the checkout, so a checkout made
# under umask 0002 shipped group-writable scripts and docs; dropping the
# group and other write bits gives every builder the modes a umask 0022
# checkout has (GAP-0108). The nfpm entries pin their own modes.
before:
  hooks:
    - sh -c 'mkdir -p build/packaging/linux && sed "s|@DC_PKG_VERSION@|{{ .Version }}|" packaging/linux/preinstall.sh >build/packaging/linux/preinstall.sh'
    - chmod -R go-w packaging edge-connector LICENSE NOTICE THIRD_PARTY_LICENSES.txt README.md CHANGELOG.md

builds:
  - id: defenseclaw
    main: ./cmd/defenseclaw
    binary: defenseclaw-gateway
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # macOS releases support Apple Silicon only.
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component gateway -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  - id: defenseclaw-windows-amd64
    main: ./cmd/defenseclaw
    binary: defenseclaw-gateway
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component gateway -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  - id: defenseclaw-hook-post
    main: ./cmd/defenseclaw-hook-post
    binary: defenseclaw-hook-post
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-hook-post-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: defenseclaw-hook
    main: ./cmd/defenseclaw-hook
    binary: defenseclaw-hook
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-hook-{{.Commit}}-{{.Os}}-{{.Arch}} -H=windowsgui -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component hook -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  - id: defenseclaw-acp-posix
    main: ./cmd/defenseclaw-acp
    binary: defenseclaw-acp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-acp-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component acp-guard -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  - id: defenseclaw-acp-windows-amd64
    main: ./cmd/defenseclaw-acp
    binary: defenseclaw-acp
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-acp-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component acp-guard -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  # Standalone managed-enterprise binaries for Linux and macOS: the
  # admin-owned hook runtime and the privileged sensor helper. They ship only
  # in the enterprise archive and packages, never in the per-user archive.
  - id: defenseclaw-hook-posix
    main: ./cmd/defenseclaw-hook
    binary: defenseclaw-hook
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-hook-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: defenseclaw-sensor-helper-posix
    main: ./cmd/defenseclaw-sensor-helper
    binary: defenseclaw-sensor-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-sensor-helper-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}}

  # The scanner runtime launcher of the managed Linux and macOS packages:
  # it runs skill-scanner, the MCP scan and the plugin scanner from the
  # Python tree the package installs at <install root>/scanner-runtime
  # (packaging/unix/build-scanner-runtime.sh, GAP-1527).
  - id: defenseclaw-scanners-posix
    main: ./cmd/defenseclaw-scanners
    binary: defenseclaw-scanners
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-scanners-{{.Commit}}-{{.Os}}-{{.Arch}}

# Release asset names are flat and permanent: installers fetch
# defenseclaw-<version>-<os>-<arch>.{tar.gz,zip} by name.
archives:
  # The per-user archive carries the sensor helper too: on Linux it is the
  # sandbox kernel feed (`sudo defenseclaw-gateway sandbox kernel-feed
  # install` copies it into a root service); install.sh keeps it on Linux
  # only.
  - id: default
    ids:
      - defenseclaw
      - defenseclaw-hook-post
      - defenseclaw-acp-posix
      - defenseclaw-sensor-helper-posix
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    builds_info:
      mode: 0755
      owner: root
      group: root
    files:
      - LICENSE*
      - NOTICE
      - THIRD_PARTY_LICENSES.txt
      - README*
      - CHANGELOG.md
      - packaging/**/*
      # Inert Fleet compiler: install.sh and install.ps1 activate it only
      # when fleet.enabled is true (a Fleet-on install fails without it).
      # Managed archives and packages never carry it.
      - edge-connector/tools/policy_compiler.py

  # Standalone managed-enterprise payload for Linux and macOS: extract as
  # root and run `sudo ./defenseclaw-gateway enterprise <linux|macos> install
  # --payload "$PWD"`.
  - id: enterprise-posix
    ids:
      - defenseclaw
      - defenseclaw-hook-posix
      - defenseclaw-sensor-helper-posix
      - defenseclaw-acp-posix
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-enterprise-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    # Extracted as root, tar keeps the archived owner: binaries owned by the
    # build account were refused by `enterprise <os> install --payload`.
    builds_info:
      mode: 0755
      owner: root
      group: root
    files:
      - LICENSE*
      - NOTICE
      - THIRD_PARTY_LICENSES.txt
      - README*
      - CHANGELOG.md
      - packaging/**/*

  - id: windows-amd64
    # The GUI-subsystem hook ships beside the x64 gateway so installers stage
    # every Windows binary from one archive.
    ids:
      - defenseclaw-windows-amd64
      - defenseclaw-hook
      - defenseclaw-acp-windows-amd64
    formats:
      - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    builds_info:
      mode: 0755
      owner: root
      group: root
    files:
      - LICENSE*
      - NOTICE
      - THIRD_PARTY_LICENSES.txt
      - README*
      - CHANGELOG.md
      - packaging/**/*
      # Inert Fleet compiler: install.sh and install.ps1 activate it only
      # when fleet.enabled is true (a Fleet-on install fails without it).
      # Managed archives and packages never carry it.
      - edge-connector/tools/policy_compiler.py

# Standalone managed-enterprise Linux packages. The maintainer scripts call
# the lifecycle (`enterprise linux ensure --from-package`), which renders the
# host-specific drop-ins and never fails the package transaction; the units
# themselves are the reviewed files in packaging/systemd, the system units in
# /usr/lib/systemd/system and the per-user sandbox units (kept in
# packaging/systemd/user so the //go:embed globs of the system units never
# take them) in /usr/lib/systemd/user.
nfpms:
  - id: defenseclaw-enterprise
    package_name: defenseclaw-enterprise
    ids:
      - defenseclaw
      - defenseclaw-hook-posix
      - defenseclaw-sensor-helper-posix
      - defenseclaw-acp-posix
      - defenseclaw-scanners-posix
    formats:
      - deb
      - rpm
    file_name_template: "{{ .PackageName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    vendor: Cisco Systems, Inc.
    homepage: https://github.com/cisco-ai-defense/defenseclaw
    maintainer: DefenseClaw maintainers <defenseclaw@cisco.com>
    description: DefenseClaw managed enterprise (standalone profile) for AI coding agents.
    license: Apache-2.0
    bindir: /opt/defenseclaw/bin
    section: admin
    priority: optional
    dependencies:
      - systemd (>= 239)
    overrides:
      rpm:
        dependencies:
          - systemd >= 239
    # Every entry pins its owner and mode: without file_info nfpm copies the
    # builder's mode, and a checkout made under umask 0002 shipped the units
    # 0664, which verify refuses (GAP-0108; guarded by
    # cli/tests/test_enterprise_packaging.py).
    contents:
      - src: packaging/systemd/defenseclaw-gateway.service
        dst: /usr/lib/systemd/system/defenseclaw-gateway.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-gateway-api.socket
        dst: /usr/lib/systemd/system/defenseclaw-gateway-api.socket
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-gateway-hook.socket
        dst: /usr/lib/systemd/system/defenseclaw-gateway-hook.socket
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-hook-guardian.service
        dst: /usr/lib/systemd/system/defenseclaw-hook-guardian.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-hook-guardian-reconcile.service
        dst: /usr/lib/systemd/system/defenseclaw-hook-guardian-reconcile.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-hook-enumerator.service
        dst: /usr/lib/systemd/system/defenseclaw-hook-enumerator.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-sensor-helper.service
        dst: /usr/lib/systemd/system/defenseclaw-sensor-helper.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-enterprise-apply.path
        dst: /usr/lib/systemd/system/defenseclaw-enterprise-apply.path
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-enterprise-apply.service
        dst: /usr/lib/systemd/system/defenseclaw-enterprise-apply.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-enterprise-verify.timer
        dst: /usr/lib/systemd/system/defenseclaw-enterprise-verify.timer
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw-enterprise-verify.service
        dst: /usr/lib/systemd/system/defenseclaw-enterprise-verify.service
        file_info:
          mode: 0644
          owner: root
          group: root
      # The standard user's sandbox launcher: the gateway binary under the name
      # defenseclaw, which offers only `defenseclaw sandbox ...` on a managed
      # host (internal/cli/launcher.go). A root-owned link, so no account can
      # point the name elsewhere.
      - src: /opt/defenseclaw/bin/defenseclaw-gateway
        dst: /usr/bin/defenseclaw
        type: symlink
      # The user units of the per-user sandbox daemon and, in install mode
      # setup, of the user's OpenShell gateway. They stay disabled until the
      # lifecycle enables them for every account (enterprise.openshell.enabled).
      - src: packaging/systemd/user/defenseclaw-sandbox.socket
        dst: /usr/lib/systemd/user/defenseclaw-sandbox.socket
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/user/defenseclaw-sandbox.service
        dst: /usr/lib/systemd/user/defenseclaw-sandbox.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/user/defenseclaw-openshell-gateway.service
        dst: /usr/lib/systemd/user/defenseclaw-openshell-gateway.service
        file_info:
          mode: 0644
          owner: root
          group: root
      # The rendered OpenShell gateway.toml lives here, world-readable (it
      # holds no secret): every account's OpenShell gateway reads it. The
      # lifecycle writes the file; the package owns the directory so an erase
      # leaves no empty one behind.
      - dst: /etc/defenseclaw/openshell
        type: dir
        file_info:
          mode: 0755
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw.sysusers
        dst: /usr/lib/sysusers.d/defenseclaw.conf
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: packaging/systemd/defenseclaw.conf
        dst: /usr/lib/tmpfiles.d/defenseclaw.conf
        file_info:
          mode: 0644
          owner: root
          group: root
      # The managed OpenCode plugin holds no host value, so the package owns
      # it: application control that trusts the package database (fapolicyd's
      # rpm and deb backends) then trusts the file OpenCode loads, as it does
      # the hook binary. A plugin only the lifecycle wrote was refused to
      # OpenCode under fapolicyd while status stayed green (GAP-0763). The
      # lifecycle renders the same bytes and leaves the file to the package.
      - src: internal/enterprisepolicy/opencode_managed_plugin.js
        dst: /opt/defenseclaw/share/opencode/defenseclaw.js
        file_info:
          mode: 0644
          owner: root
          group: root
      # apt hook that refuses a package downgrade before dpkg replaces any
      # file. Not a conffile: it must go away with the package, or apt would
      # keep calling a script that is no longer there.
      - src: packaging/linux/apt-downgrade-guard.sh
        dst: /usr/lib/defenseclaw-enterprise/apt-downgrade-guard
        packager: deb
        file_info:
          mode: 0755
          owner: root
          group: root
      - src: packaging/linux/apt-downgrade-guard.conf
        dst: /etc/apt/apt.conf.d/50defenseclaw-enterprise
        packager: deb
        file_info:
          mode: 0644
          owner: root
          group: root
      # The scanner runtime defenseclaw-scanners runs (GAP-1527): CPython and
      # the locked scanner packages, built per architecture before
      # GoReleaser runs (packaging/unix/build-scanner-runtime.sh --target
      # linux-<arch> --out-dir scanner-runtime/linux-<arch>). The
      # package manager installs it root-owned with the modes the build set
      # (0755 folders and programs, 0644 files); the gateway checks that
      # before every scan.
      - src: scanner-runtime/linux-{{ .Arch }}/
        dst: /opt/defenseclaw/scanner-runtime
        type: tree
        file_info:
          owner: root
          group: root
      # An rpm owns only the directories it lists, so without this entry an
      # erase leaves /usr/share/doc/defenseclaw-enterprise behind, empty.
      - dst: /usr/share/doc/defenseclaw-enterprise
        type: dir
        file_info:
          mode: 0755
          owner: root
          group: root
      - src: packaging/systemd/hook-guardian-targets.example.yaml
        dst: /usr/share/doc/defenseclaw-enterprise/hook-guardian-targets.example.yaml
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: LICENSE
        dst: /usr/share/doc/defenseclaw-enterprise/LICENSE
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: NOTICE
        dst: /usr/share/doc/defenseclaw-enterprise/NOTICE
        file_info:
          mode: 0644
          owner: root
          group: root
    scripts:
      preinstall: build/packaging/linux/preinstall.sh
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
      postremove: packaging/linux/postremove.sh
    # Signed only when the release provides a key.
    deb:
      signature:
        key_file: '{{ if index .Env "NFPM_GPG_KEY_FILE" }}{{ .Env.NFPM_GPG_KEY_FILE }}{{ end }}'
    rpm:
      signature:
        key_file: '{{ if index .Env "NFPM_GPG_KEY_FILE" }}{{ .Env.NFPM_GPG_KEY_FILE }}{{ end }}'

# The release workflow computes and signs checksums.txt over every published
# asset, so GoReleaser neither checksums nor signs.
checksum:
  disable: true

sboms:
  - artifacts: archive
    cmd: syft

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  disable: "true"
