version: 2

project_name: defenseclaw

builds:
  - id: defenseclaw
    main: ./cmd/defenseclaw
    binary: defenseclaw-gateway
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # macOS releases support Apple Silicon only.
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component gateway -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  - id: defenseclaw-windows-amd64
    main: ./cmd/defenseclaw
    binary: defenseclaw-gateway
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component gateway -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  - id: defenseclaw-hook
    main: ./cmd/defenseclaw-hook
    binary: defenseclaw-hook
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-hook-{{.Commit}}-{{.Os}}-{{.Arch}} -H=windowsgui -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component hook -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  - id: defenseclaw-acp-posix
    main: ./cmd/defenseclaw-acp
    binary: defenseclaw-acp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-acp-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component acp-guard -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

  - id: defenseclaw-acp-windows-amd64
    main: ./cmd/defenseclaw-acp
    binary: defenseclaw-acp
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=defenseclaw-acp-{{.Commit}}-{{.Os}}-{{.Arch}} -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: go run ./internal/tools/windowsresources -target {{ .Os }}_{{ .Arch }} -executable "{{ .Path }}" -component acp-guard -version {{ .Version }} -icon macos/DefenseClawMac/DefenseClawMac/Assets.xcassets/AppIcon.appiconset/icon_256.png
          output: true

# Release asset names are flat and permanent: installers fetch
# defenseclaw-<version>-<os>-<arch>.{tar.gz,zip} by name.
archives:
  - id: default
    ids:
      - defenseclaw
      - defenseclaw-acp-posix
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE*
      - NOTICE
      - THIRD_PARTY_LICENSES.txt
      - README*
      - CHANGELOG.md
      - packaging/**/*

  - id: windows-amd64
    # The GUI-subsystem hook ships beside the x64 gateway so installers stage
    # every Windows binary from one archive.
    ids:
      - defenseclaw-windows-amd64
      - defenseclaw-hook
      - defenseclaw-acp-windows-amd64
    formats:
      - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE*
      - NOTICE
      - THIRD_PARTY_LICENSES.txt
      - README*
      - CHANGELOG.md
      - packaging/**/*

# The release workflow computes and signs checksums.txt over every published
# asset, so GoReleaser neither checksums nor signs.
checksum:
  disable: true

sboms:
  - artifacts: archive
    cmd: syft

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  disable: "true"
