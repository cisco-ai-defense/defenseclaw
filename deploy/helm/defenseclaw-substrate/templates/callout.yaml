{{- $sel := dict "ctx" . "component" "callout" "serving" true }}
# The atenet-egress ext_proc callout. It serves TLS 1.3 with the servicedns
# pod certificate for defenseclaw-callout.<namespace>.svc, which Envoy checks,
# and accepts only the atenet-egress client certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defenseclaw-callout
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  {{- if not .Values.callout.hpa.enabled }}
  replicas: {{ .Values.callout.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dc.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dc.selector" $sel | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "dc.podAnnotations" $sel | nindent 8 }}
        checksum/callout: {{ include "dc.calloutConfig" . | sha256sum }}
    spec:
      {{- include "dc.podSpecCommon" (dict "ctx" . "sa" "callout" "values" .Values.callout) | nindent 6 }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            {{- include "dc.selector" $sel | nindent 12 }}
      {{- include "dc.initContainers" . | nindent 6 }}
      containers:
      - name: callout
        image: {{ include "dc.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        {{- if .Values.callout.args }}
        {{- toYaml .Values.callout.args | nindent 8 }}
        {{- else }}
        - substrate-extproc
        - --config=/etc/defenseclaw-callout/callout.yaml
        - --listen=:{{ .Values.callout.port }}
        - --health-listen=:{{ .Values.callout.ports.health }}
        {{- if .Values.podCertificates.enabled }}
        - --tls-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --client-ca=/var/run/ate/podidentity-ca.crt
        {{- end }}
        {{- end }}
        env:
        {{- include "dc.env" . | nindent 8 }}
        ports:
        - name: extproc
          containerPort: {{ .Values.callout.port }}
        - name: health
          containerPort: {{ .Values.callout.ports.health }}
        readinessProbe:
          httpGet: {path: /readyz, port: health}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 10
          failureThreshold: 6
        resources:
          {{- toYaml .Values.callout.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        volumeMounts:
        {{- include "dc.volumeMounts" $sel | nindent 8 }}
        - name: callout-config
          mountPath: /etc/defenseclaw-callout
          readOnly: true
        {{- if .Values.callout.judge.tokenSecret }}
        - name: callout-judge
          mountPath: /var/run/secrets/defenseclaw-callout-judge
          readOnly: true
        {{- end }}
        {{- if .Values.callout.actorSecrets.secretName }}
        - name: actor-secrets
          mountPath: /run/defenseclaw/actor-secrets
          readOnly: true
        {{- end }}
      volumes:
      {{- include "dc.volumes" $sel | nindent 6 }}
      - name: callout-config
        configMap:
          name: defenseclaw-callout
      {{- with .Values.callout.judge.tokenSecret }}
      - name: callout-judge
        secret:
          secretName: {{ . }}
          items:
          - {key: token, path: token}
      {{- end }}
      {{- with .Values.callout.actorSecrets.secretName }}
      # Exposed actor_secrets values, for exact-value DLP only (D14).
      - name: actor-secrets
        secret:
          secretName: {{ . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: defenseclaw-callout
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dc.selector" $sel | nindent 4 }}
  ports:
  - name: grpc
    port: {{ .Values.callout.port }}
    targetPort: extproc
  - name: health
    port: {{ .Values.callout.ports.health }}
    targetPort: health
{{- if .Values.callout.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: defenseclaw-callout
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: defenseclaw-callout
  minReplicas: {{ .Values.callout.hpa.minReplicas }}
  maxReplicas: {{ .Values.callout.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.callout.hpa.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: defenseclaw-callout
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  minAvailable: {{ .Values.callout.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dc.selector" $sel | nindent 6 }}
