{{- $sel := dict "ctx" . "component" "callout" }}
# The atenet-egress ext_proc callout. It serves TLS 1.3 with the servicedns
# pod certificate for defenseclaw-callout.<namespace>.svc, which Envoy checks,
# and accepts only the atenet-egress client certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defenseclaw-callout
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  {{- if not .Values.callout.hpa.enabled }}
  replicas: {{ .Values.callout.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dc.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dc.selector" $sel | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "dc.podAnnotations" $sel | nindent 8 }}
    spec:
      {{- include "dc.podSpecCommon" (dict "ctx" . "sa" "callout" "values" .Values.callout) | nindent 6 }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            {{- include "dc.selector" $sel | nindent 12 }}
      containers:
      - name: callout
        image: {{ include "dc.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        {{- if .Values.callout.args }}
        {{- toYaml .Values.callout.args | nindent 8 }}
        {{- else }}
        - substrate-extproc
        - --listen=:{{ .Values.callout.port }}
        - --metrics-listen=:{{ .Values.callout.ports.metrics }}
        - --tls-cert=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --client-ca=/var/run/ate/podidentity-ca.crt
        - --client-spiffe-id={{ .Values.substrate.egressSpiffeId }}
        - --leader-address=defenseclaw-leader.{{ .Release.Namespace }}.svc:{{ .Values.leader.port }}
        {{- end }}
        env:
        {{- include "dc.env" . | nindent 8 }}
        ports:
        - name: extproc
          containerPort: {{ .Values.callout.port }}
        - name: metrics
          containerPort: {{ .Values.callout.ports.metrics }}
        readinessProbe:
          httpGet: {path: /readyz, port: metrics}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: metrics}
          periodSeconds: 10
          failureThreshold: 6
        resources:
          {{- toYaml .Values.callout.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        volumeMounts:
        {{- include "dc.volumeMounts" $sel | nindent 8 }}
      volumes:
      {{- include "dc.volumes" $sel | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: defenseclaw-callout
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dc.selector" $sel | nindent 4 }}
  ports:
  - name: grpc
    port: {{ .Values.callout.port }}
    targetPort: extproc
  - name: metrics
    port: {{ .Values.callout.ports.metrics }}
    targetPort: metrics
{{- if .Values.callout.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: defenseclaw-callout
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: defenseclaw-callout
  minReplicas: {{ .Values.callout.hpa.minReplicas }}
  maxReplicas: {{ .Values.callout.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.callout.hpa.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: defenseclaw-callout
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  minAvailable: {{ .Values.callout.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dc.selector" $sel | nindent 6 }}
