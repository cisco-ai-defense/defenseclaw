{{- /*
Self-service secrets (B1). The binding store is one ConfigMap the gateway
writes (bindings.json; no secret value is in it). The chart never sets its
data, so helm upgrade keeps the bindings people added, and
resource-policy keep leaves both objects at uninstall: the bindings and the
dc-b-<person> value Secrets are the people's, removed only on purpose.
substrate.credentialProvider.createUserSecretsNamespace false: the
namespace already exists (created by the administrator).
*/ -}}
{{- with include "dc.userSecretsNs" . }}
{{- if $.Values.substrate.credentialProvider.createUserSecretsNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    app.kubernetes.io/managed-by: defenseclaw
    app.kubernetes.io/part-of: defenseclaw
  annotations:
    helm.sh/resource-policy: keep
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: defenseclaw-secret-bindings
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dc.componentLabels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
