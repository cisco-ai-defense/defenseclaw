{{- range $component := list "gateway" "controller" "callout" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dc.sa" $component }}
  labels:
    {{- include "dc.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
  {{- $ann := merge (deepCopy (get ($.Values.serviceAccounts.componentAnnotations | default dict) $component | default dict)) (deepCopy ($.Values.serviceAccounts.annotations | default dict)) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
