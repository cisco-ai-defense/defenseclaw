{{- range $component := list "gateway" "controller" "callout" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dc.sa" $component }}
  labels:
    {{- include "dc.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
  {{- with $.Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
