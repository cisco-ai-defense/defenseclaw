{{- $sel := dict "ctx" . "component" "controller" "serving" false }}
# One replica, Recreate: policies, admission, idle suspend, drift and
# inventory. The controller has no Lease client yet (A3), so two would both
# act; when it gets one this becomes two replicas with a PDB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defenseclaw-controller
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dc.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dc.selector" $sel | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "dc.podAnnotations" $sel | nindent 8 }}
    spec:
      {{- include "dc.podSpecCommon" (dict "ctx" . "sa" "controller" "values" .Values.controller) | nindent 6 }}
      containers:
      - name: controller
        image: {{ include "dc.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        {{- if .Values.controller.args }}
        {{- toYaml .Values.controller.args | nindent 8 }}
        {{- else }}
        - substrate-controller
        - --config=/etc/defenseclaw/config.yaml
        {{- end }}
        env:
        {{- include "dc.env" . | nindent 8 }}
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        volumeMounts:
        {{- include "dc.volumeMounts" $sel | nindent 8 }}
      volumes:
      {{- include "dc.volumes" $sel | nindent 6 }}
