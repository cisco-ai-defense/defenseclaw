{{- $sel := dict "ctx" . "component" "controller" }}
# Two replicas, one active through the lease: policies, admission, idle
# suspend, drift and inventory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defenseclaw-controller
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dc.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dc.selector" $sel | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "dc.podAnnotations" $sel | nindent 8 }}
    spec:
      {{- include "dc.podSpecCommon" (dict "ctx" . "sa" "controller" "values" .Values.controller) | nindent 6 }}
      containers:
      - name: controller
        image: {{ include "dc.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        {{- if .Values.controller.args }}
        {{- toYaml .Values.controller.args | nindent 8 }}
        {{- else }}
        - substrate-controller
        - --lease={{ .Values.controller.leaseName }}
        - --metrics-listen=:{{ .Values.controller.ports.metrics }}
        {{- end }}
        env:
        {{- include "dc.env" . | nindent 8 }}
        ports:
        - name: metrics
          containerPort: {{ .Values.controller.ports.metrics }}
        readinessProbe:
          httpGet: {path: /readyz, port: metrics}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: metrics}
          periodSeconds: 10
          failureThreshold: 6
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        volumeMounts:
        {{- include "dc.volumeMounts" $sel | nindent 8 }}
      volumes:
      {{- include "dc.volumes" $sel | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: defenseclaw-controller
  labels:
    {{- include "dc.componentLabels" $sel | nindent 4 }}
spec:
  minAvailable: {{ .Values.controller.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dc.selector" $sel | nindent 6 }}
