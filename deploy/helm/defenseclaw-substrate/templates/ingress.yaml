{{- $x := .Values.admin.expose -}}
{{- if eq $x.type "Ingress" }}
{{- if not $x.ingress.host }}{{ fail "admin.expose.ingress.host is required for type Ingress" }}{{ end }}
{{- if not $x.ingress.tlsSecretName }}{{ fail "admin.expose.ingress.tlsSecretName is required for type Ingress (the admin listener is TLS only)" }}{{ end }}
# Launchers reach the admin listener through this ingress (TLS); the actor
# listener is never exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: defenseclaw-admin
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
  {{- with $x.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $x.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
  - hosts: [{{ $x.ingress.host | quote }}]
    secretName: {{ $x.ingress.tlsSecretName }}
  rules:
  - host: {{ $x.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: defenseclaw-admin
            port:
              name: https
{{- else if eq $x.type "LoadBalancer" }}
{{- if not $x.loadBalancer.sourceRanges }}{{ fail "admin.expose.loadBalancer.sourceRanges is required for type LoadBalancer (list the launcher networks)" }}{{ end }}
# Launchers reach the admin listener on this load balancer (TLS passes
# through to the gateway). Only the admin port; the actor listener is never
# exposed. Client addresses are kept so the NetworkPolicy can check them.
apiVersion: v1
kind: Service
metadata:
  name: defenseclaw-admin-external
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
    defenseclaw.cisco.com/listener: admin
  {{- with $x.loadBalancer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    {{- toYaml $x.loadBalancer.sourceRanges | nindent 4 }}
  selector:
    {{- include "dc.selector" (dict "ctx" . "component" "gateway") | nindent 4 }}
  ports:
  - name: https
    port: 443
    targetPort: admin
{{- else if ne $x.type "ClusterIP" }}
{{- fail "admin.expose.type must be ClusterIP, LoadBalancer or Ingress" }}
{{- end }}
