# The gateway leader and the controller hold a Lease each; the leader records
# the store schema in defenseclaw-store-state (read by the rollback check).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defenseclaw-gateway
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  resourceNames: [{{ .Values.leader.leaseName | quote }}]
  verbs: [get, update]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [defenseclaw-store-state, defenseclaw-policy-resets]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defenseclaw-gateway
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defenseclaw-gateway
subjects:
- kind: ServiceAccount
  name: defenseclaw-gateway
  namespace: {{ .Release.Namespace }}
{{- if include "dc.kubeSignIn" . }}
---
# The Kubernetes sign-in (no OIDC issuer, not managed): the gateway asks the
# API server who a person's token belongs to with a TokenReview (GAP-0153).
# Only tokenreviews create, not the whole system:auth-delegator role (which
# also grants subjectaccessreviews). Cluster-scoped, so the name carries the
# namespace and release.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dc.tokenReviewName" . }}
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
rules:
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dc.tokenReviewName" . }}
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dc.tokenReviewName" . }}
subjects:
- kind: ServiceAccount
  name: defenseclaw-gateway
  namespace: {{ .Release.Namespace }}
{{- end }}
---
# The controller reads and clears admin policy_conflict resets (the gateway
# admin route writes them into defenseclaw-policy-resets).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defenseclaw-controller
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "controller") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [defenseclaw-policy-resets]
  verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defenseclaw-controller
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "controller") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defenseclaw-controller
subjects:
- kind: ServiceAccount
  name: defenseclaw-controller
  namespace: {{ .Release.Namespace }}
