# The gateway leader and the controller hold a Lease each; the leader records
# the store schema in defenseclaw-store-state (read by the rollback check).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defenseclaw-gateway
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  resourceNames: [{{ .Values.leader.leaseName | quote }}]
  verbs: [get, update]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [defenseclaw-store-state, defenseclaw-policy-resets]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defenseclaw-gateway
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defenseclaw-gateway
subjects:
- kind: ServiceAccount
  name: defenseclaw-gateway
  namespace: {{ .Release.Namespace }}
---
# The controller reads and clears admin policy_conflict resets (the gateway
# admin route writes them into defenseclaw-policy-resets).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defenseclaw-controller
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "controller") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [defenseclaw-policy-resets]
  verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defenseclaw-controller
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "controller") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defenseclaw-controller
subjects:
- kind: ServiceAccount
  name: defenseclaw-controller
  namespace: {{ .Release.Namespace }}
