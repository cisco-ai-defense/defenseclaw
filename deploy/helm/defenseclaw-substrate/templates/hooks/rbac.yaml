# The chart hook Jobs: read the store state, and in the Substrate namespace
# merge and remove DefenseClaw's entries of the credential provider namespace
# policy and restart the provider (it reads the policy at start only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: defenseclaw-hooks
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defenseclaw-hooks
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [defenseclaw-store-state]
  verbs: [get]
{{- if and .Values.bootstrap.ownerTokenSecret .Values.bootstrap.deleteTokenAfterUse }}
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [{{ .Values.bootstrap.ownerTokenSecret | quote }}]
  verbs: [delete]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defenseclaw-hooks
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defenseclaw-hooks
subjects:
- kind: ServiceAccount
  name: defenseclaw-hooks
  namespace: {{ .Release.Namespace }}
---
# Only while the chain-key hook runs: create the shared chain key Secret
# when it is absent (create cannot be limited to one name; get can).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defenseclaw-hooks-chain-key
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
  annotations:
    {{- include "dc.hookRBACAnnotations" (dict "hooks" "pre-install,pre-upgrade") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [defenseclaw-chain-key]
  verbs: [get]
- apiGroups: [""]
  resources: [secrets]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defenseclaw-hooks-chain-key
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
  annotations:
    {{- include "dc.hookRBACAnnotations" (dict "hooks" "pre-install,pre-upgrade") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defenseclaw-hooks-chain-key
subjects:
- kind: ServiceAccount
  name: defenseclaw-hooks
  namespace: {{ .Release.Namespace }}
---
# Only while the pre-delete hook runs: stop the controller before the
# policies are removed (GAP-0056). A hook resource, so no standing grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defenseclaw-hooks-uninstall
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
  annotations:
    {{- include "dc.hookRBACAnnotations" (dict "hooks" "pre-delete") | nindent 4 }}
rules:
- apiGroups: [apps]
  resources: [deployments, deployments/scale]
  resourceNames: [defenseclaw-controller]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defenseclaw-hooks-uninstall
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
  annotations:
    {{- include "dc.hookRBACAnnotations" (dict "hooks" "pre-delete") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defenseclaw-hooks-uninstall
subjects:
- kind: ServiceAccount
  name: defenseclaw-hooks
  namespace: {{ .Release.Namespace }}
{{- if .Values.substrate.credentialProvider.grant }}
{{- /* The grant in the Substrate namespace exists only while the bootstrap
and pre-delete hooks run (GAP-0080): a standing Role would let any pod run
as defenseclaw-hooks rewrite the credential provider policy. */}}
{{- $when := ternary "post-install,post-upgrade,pre-delete" "pre-delete" (not (empty .Values.bootstrap.ownerTokenSecret)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defenseclaw-{{ .Release.Namespace }}-hooks
  namespace: {{ .Values.substrate.namespace }}
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
  annotations:
    {{- include "dc.hookRBACAnnotations" (dict "hooks" $when) | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [{{ .Values.substrate.credentialProvider.policyConfigMap | quote }}]
  verbs: [get, update]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [{{ .Values.substrate.credentialProvider.deployment | quote }}]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defenseclaw-{{ .Release.Namespace }}-hooks
  namespace: {{ .Values.substrate.namespace }}
  labels:
    {{- include "dc.componentLabels" (dict "ctx" . "component" "hooks") | nindent 4 }}
  annotations:
    {{- include "dc.hookRBACAnnotations" (dict "hooks" $when) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defenseclaw-{{ .Release.Namespace }}-hooks
subjects:
- kind: ServiceAccount
  name: defenseclaw-hooks
  namespace: {{ .Release.Namespace }}
{{- end }}
