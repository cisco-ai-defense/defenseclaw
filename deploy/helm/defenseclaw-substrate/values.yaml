# DefenseClaw on Agent Substrate. Every value is described in README.md and
# checked by values.schema.json.

image:
  repository: ghcr.io/cisco-ai-defense/defenseclaw-gateway
  # Empty means the chart's appVersion.
  tag: ""
  # A digest (sha256:...) pins the image and wins over the tag. The release
  # chart sets it to the signed image's digest.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Where Agent Substrate runs and how DefenseClaw reaches it.
substrate:
  namespace: ate-system
  # The ate-api-server Service, and the audience its ServiceAccount tokens
  # must carry.
  apiAddress: api.ate-system.svc:443
  apiAudience: api.ate-system.svc
  # The SPIFFE ID atenet-egress presents to the callout, and the label the
  # NetworkPolicy admits it by.
  egressSpiffeId: spiffe://cluster.local/ns/ate-system/sa/atenet-egress
  egressPodLabels:
    app: atenet-egress
  # The upstream Kubernetes credential provider. The bootstrap Job grants the
  # launcher atespaces the secrets namespace below in its namespace policy,
  # and the pre-delete Job removes the grant.
  credentialProvider:
    grant: true
    policyConfigMap: k8s-credential-provider-namespace-policy
    deployment: k8s-credential-provider
    # The namespace holding the Secrets egress injects into actors (never
    # this release's namespace: DefenseClaw's own Secrets stay here).
    secretsNamespace: defenseclaw-actor-secrets

# DefenseClaw config.yaml, rendered as is into the defenseclaw-config
# ConfigMap: the single source of the gateway, controller and callout config.
# The chart fills substrate.enabled, substrate.services and substrate.api when
# they are not set here. Keys and defaults: docs/SUBSTRATE.md and the config
# reference (substrate section).
config:
  config_version: 9
  substrate:
    enabled: true
    supported_versions: ">=1.0.0 <1.1.0"
    identity:
      # Unique per cluster (E13): doctor fails when two clusters share one.
      issuer: https://idp.ate-system.svc
      audience: defenseclaw
      token_lifetime_seconds: 300
    launcher_atespaces: {}
    require_attested_templates: true
    default_sandbox_class: gvisor
    idle_suspend_after: 30m
    unattended:
      asks: deny
      ask_timeout: 30m
    extproc:
      enabled: true
      failure_mode: closed
      body_inspection: auto
      body_max_bytes: 1048576

# Atespaces outside launcher_atespaces that DefenseClaw writes egress policy
# in (editor grant). Launcher atespaces are always included.
managedAtespaces: []

# Kubernetes pod certificates (PodCertificateRequest) for the servicedns
# serving certificates the callout and the gateway listeners present, and the
# podidentity client certificates for ate-api. Substrate itself needs them.
podCertificates:
  enabled: true

gateway:
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1
  ports:
    # The actor listener, plain HTTP: atenet-egress reaches it on an http
    # rule (an https rule cannot verify an in-cluster certificate; see
    # README, Known limits). The NetworkPolicy admits only atenet-egress.
    actor: 8080
    admin: 9443
    metrics: 9464
  # Secrets the gateway and leader mount when they exist (optional): the
  # relay session signing key (keys private.pem, public.pem), the provider
  # keys for /llm (one file per provider), and the callout judge token
  # (callout.judge.tokenSecret, shared with the callout).
  relaySessionSecret: defenseclaw-relay-session
  llmCredentialsSecret: defenseclaw-llm
  args: []
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The gateway leader: one replica that holds the lease and the store volume
# and serves the stateful RPCs (tool chains, intent, asks, registrations).
leader:
  leaseName: defenseclaw-gateway-leader
  port: 7443
  store:
    size: 10Gi
    storageClassName: ""
    # Keep the store when the release is uninstalled; delete the PVC by hand.
    keepOnUninstall: true
  args: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

controller:
  # One replica (no Lease client in the controller yet).
  # The admin-only Secret with the template signing keys (key anchors.pem),
  # mounted for substrate.templates.trust_anchors. Without it every template
  # is refused (require_attested_templates).
  templateAnchorsSecret: defenseclaw-template-anchors
  args: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Signed policy bundles (substrate.bundles): profiles and match.substrate
# assignments for a stage of atespaces, verified against trust anchors. An
# administrator creates the anchors Secret (bundle-anchors.json) before
# enabling this; the controller and the gateway mount it read-only.
bundles:
  enabled: false
  anchorsSecret: defenseclaw-bundle-anchors
  # The GitOps inbox ConfigMap: <stage>.dcbundle and <stage>.atespaces.
  inbox: defenseclaw-bundle-inbox

# The atenet-egress ext_proc callout.
callout:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  replicas: 2
  pdb:
    minAvailable: 1
  port: 9443
  ports:
    # Plain HTTP /healthz and /readyz (with the detected body mode).
    health: 9444
  # The callout asks the gateway for MCP tools/call verdicts (the hook path's
  # MCP asset policy and tool rules) on the admin Service. Name a Secret with
  # the bearer token in key "token" to turn it on; without it the callout
  # applies only its own MCP rules.
  judge:
    tokenSecret: ""
  # A Secret whose keys are the exposed actor_secrets values (one file per
  # name), for exact-value DLP on egress. Never mounted into actors.
  actorSecrets:
    secretName: ""
  args: []
  resources:
    requests: {cpu: 250m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccounts:
  # Token audience and lifetime of the projected ate-api tokens.
  apiTokenExpirationSeconds: 3600
  annotations: {}

networkPolicy:
  enabled: true
  # Peers that may reach the admin Service (launcher, fleet): the release
  # namespace always may. Add the ingress controller here, for example
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
  adminFrom: []
  # Peers that may scrape the metrics ports.
  metricsFrom: []
  # Egress limits for the pods that hold keys (gateway, leader, callout):
  # DNS, the Kubernetes and Substrate APIs, the release's own Services,
  # OTLP, and (gateway and leader only) model providers on 443.
  egress:
    enabled: true
    # Ports of the OTLP collector(s) the pods export to.
    otlpPorts: [4317, 4318]
    # Extra egress rules (NetworkPolicyEgressRule) for every key-holding pod.
    extra: []

# How launchers on laptops reach the admin listener (TLS). The actor
# listener is never exposed outside the cluster.
admin:
  expose:
    # ClusterIP (in-cluster only), LoadBalancer or Ingress.
    type: ClusterIP
    loadBalancer:
      # Required for LoadBalancer: the client ranges allowed (also put in
      # the NetworkPolicy; the Service keeps client addresses).
      sourceRanges: []
      annotations: {}
    ingress:
      className: ""
      host: ""
      # Required for Ingress: the TLS Secret the ingress serves. The ingress
      # must re-encrypt to the admin listener (HTTPS backend), for example
      # nginx.ingress.kubernetes.io/backend-protocol: HTTPS.
      tlsSecretName: ""
      annotations: {}
  # The https URL laptops use for the admin listener, published in the
  # ConfigMap defenseclaw-launcher-endpoint (the only URL login --kube sends
  # a Kubernetes credential to). Default: the Ingress host, or the in-cluster
  # admin Service; required for LoadBalancer.
  url: ""
  # A kubernetes.io/tls Secret with a certificate for the external name
  # (LoadBalancer). Without it the admin listener presents its in-cluster
  # serving certificate, which laptops do not trust for other names.
  tlsSecretName: ""

# OpenFGA bootstrap (post-install and post-upgrade Job). It creates the
# launcher atespaces, writes their access policies (only DefenseClaw's
# ServiceAccounts are editors: create, fork, suspend, resume), grants
# DefenseClaw global viewer, and grants the credential provider namespace.
# Writing them needs a Substrate global owner: name a Secret with a token of
# one in key "token". Without it the Job does not run, and
# `defenseclaw substrate setup` prints the policies for an admin to apply.
bootstrap:
  ownerTokenSecret: ""
  # Remove the owner token Secret once the bootstrap succeeded.
  deleteTokenAfterUse: true
  backoffLimit: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Pre-upgrade and pre-rollback checks (config validate, kit and Substrate
# skew, store schema), and the pre-delete cleanup of DefenseClaw-written
# egress policies.
hooks:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

metrics:
  prometheusRule:
    enabled: false
    labels: {}

# A local OpenTelemetry collector for trying the chart out. Point
# config.otel at a real backend in production.
observability:
  local:
    enabled: false
    image: otel/opentelemetry-collector-contrib:0.139.0
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The memory emptyDir that holds DEFENSECLAW_HOME (the audit database and
# local state) in every DefenseClaw pod; it counts against the pod's memory.
homeSizeLimit: 256Mi

podAnnotations: {}
podLabels: {}
