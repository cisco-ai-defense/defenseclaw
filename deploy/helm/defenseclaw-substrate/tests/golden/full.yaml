# Source: defenseclaw-substrate/templates/networkpolicy.yaml
# Deny every ingress to this release's pods; the policies below open only
# what each listener needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: defenseclaw-default-deny
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.10
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: dc
      app.kubernetes.io/name: defenseclaw-substrate
  policyTypes: [Ingress]
---
# Source: defenseclaw-substrate/templates/networkpolicy.yaml
# Gateway: the actor listener only from atenet-egress (actors reach it only
# through egress, with the injected actor JWT); the admin listener only from
# this namespace and adminFrom (launcher ingress, fleet).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: defenseclaw-gateway
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.10
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: defenseclaw-substrate
      app.kubernetes.io/instance: dc
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
  - from:
    -
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ate-system
      podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - protocol: TCP
      port: 8443
  - from:
    # This namespace's pods, never a Substrate worker pod (which hosts
    # actors) even if worker pools share the namespace.
    - podSelector:
        matchExpressions:
        - {key: ate.dev/worker-pool, operator: DoesNotExist}
    ports:
    - protocol: TCP
      port: 9443
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9464
---
