# Source: defenseclaw-substrate/templates/callout-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: defenseclaw-callout
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.10
    app.kubernetes.io/component: callout
data:
  callout.yaml: |
    actor_secrets_dir: /run/defenseclaw/actor-secrets
    body_hosts: []
    body_inspection: auto
    body_max_bytes: 1048576
    defenseclaw_hosts:
    - defenseclaw-actor.defenseclaw-system.svc
    - defenseclaw-actor.defenseclaw-system.svc.cluster.local
    - defenseclaw-admin.defenseclaw-system.svc
    - defenseclaw-admin.defenseclaw-system.svc.cluster.local
    egress_peers:
    - spiffe://cluster.local/ns/ate-system/sa/atenet-egress
    failure_mode: closed
    judge:
      ca_file: /var/run/ate/ca.crt
      token_file: /var/run/defenseclaw/callout-judge/token
      url: https://defenseclaw-admin.defenseclaw-system.svc/api/v1/substrate/callout/mcp-verdict
    mcp_hosts:
    - mcp.example.com
    profiles:
    - atespaces:
      - data-ml
      egress:
        allow:
        - github.com
        - pypi.org
      name: data
      unattended_asks: deny
    - atespaces:
      - eng-web
      egress:
        allow:
        - github.com
        - pypi.org
      name: engineering
      unattended_asks: deny
    secrets:
    - header: Authorization
      hosts:
      - github.com
      - api.github.com
      name: github-push
      placeholder: DC_SECRET_GITHUB
---
# Source: defenseclaw-substrate/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: defenseclaw-config
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.10
data:
  config.yaml: |
    config_version: 9
    substrate:
      api:
        address: api.ate-system.svc:443
        auth: serviceaccount
        ca_file: /var/run/ate/ca.crt
        server_name: api.ate-system.svc
        token_file: /var/run/ate/token
      default_sandbox_class: gvisor
      egress:
        allow:
        - github.com
        - pypi.org
      enabled: true
      extproc:
        body_inspection: auto
        body_max_bytes: 1048576
        enabled: true
        failure_mode: closed
        mcp_hosts:
        - mcp.example.com
      identity:
        audience: defenseclaw
        issuer: https://idp.cluster-a.example
        token_lifetime_seconds: 900
      idle_suspend_after: 30m
      launcher_atespaces:
        data:
        - data-ml
        engineering:
        - eng-web
      require_attested_templates: true
      secrets:
      - inject:
          header: Authorization
          hosts:
          - github.com
          - api.github.com
          placeholder: DC_SECRET_GITHUB
          prefix: 'Bearer '
        name: github-push
        profiles:
        - engineering
        scope: shared
        source: ate-secret://k8s.io/default/defenseclaw-actor-secrets/github-app/token
      services:
        actor: defenseclaw-actor.defenseclaw-system.svc
        admin: defenseclaw-admin.defenseclaw-system.svc
      supported_versions: '>=1.0.0 <1.1.0'
      unattended:
        ask_timeout: 30m
        asks: deny
