# Source: defenseclaw-substrate/templates/observability/collector.yaml
# A local OpenTelemetry collector for trying the chart: OTLP in, the debug
# exporter out. Not for production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: defenseclaw-otel-collector
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.10
    app.kubernetes.io/component: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      batch: {}
    exporters:
      debug: {verbosity: basic}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [debug]}
        metrics: {receivers: [otlp], processors: [batch], exporters: [debug]}
        logs: {receivers: [otlp], processors: [batch], exporters: [debug]}
