# Source: defenseclaw-substrate/templates/callout.yaml
# The atenet-egress ext_proc callout. It serves TLS 1.3 with the servicedns
# pod certificate for defenseclaw-callout.<namespace>.svc, which Envoy checks,
# and accepts only the atenet-egress client certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defenseclaw-callout
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.10
    app.kubernetes.io/component: callout
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: defenseclaw-substrate
      app.kubernetes.io/instance: dc
      app.kubernetes.io/component: callout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: defenseclaw-substrate
        app.kubernetes.io/instance: dc
        app.kubernetes.io/component: callout
      annotations:
        checksum/config: 61e0dbdd2c906907f7adf8d028538a64f70b22b75e5d06c44d3b56cc57a69c9a
    spec:
      
      serviceAccountName: defenseclaw-callout
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: defenseclaw-substrate
            app.kubernetes.io/instance: dc
            app.kubernetes.io/component: callout
      containers:
      - name: callout
        image: ghcr.io/cisco-ai-defense/defenseclaw-gateway:1.0.10
        imagePullPolicy: IfNotPresent
        args:
        - substrate-extproc
        - --listen=:9443
        - --metrics-listen=:9464
        - --tls-cert=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --client-ca=/var/run/ate/podidentity-ca.crt
        - --client-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/atenet-egress
        - --leader-address=defenseclaw-leader.defenseclaw-system.svc:7443
        env:
        - name: DEFENSECLAW_CONFIG
          value: /etc/defenseclaw/config.yaml
        - name: DEFENSECLAW_HOME
          value: /tmp/defenseclaw
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: extproc
          containerPort: 9443
        - name: metrics
          containerPort: 9464
        readinessProbe:
          httpGet: {path: /readyz, port: metrics}
