# Source: defenseclaw-substrate/templates/rbac.yaml
# The chart's one cluster-wide grant (lead ruling, STEER 2026-11-13 00:32Z):
# the Kubernetes sign-in (no OIDC issuer, not managed) verifies a person's
# token with a TokenReview, which is cluster-scoped, so the gateway
# ServiceAccount is bound to system:auth-delegator (tokenreviews create,
# subjectaccessreviews come with it). Never rendered with an OIDC issuer.
# Named by gateway.authDelegatorBinding; helm removes it on uninstall.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: defenseclaw-auth-delegator-defenseclaw-system-dc
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.11"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.11
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: defenseclaw-gateway
  namespace: defenseclaw-system
