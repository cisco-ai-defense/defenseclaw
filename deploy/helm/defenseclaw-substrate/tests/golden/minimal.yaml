    app.kubernetes.io/component: callout
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: defenseclaw-substrate
      app.kubernetes.io/instance: dc
      app.kubernetes.io/component: callout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: defenseclaw-substrate
        app.kubernetes.io/instance: dc
        app.kubernetes.io/component: callout
      annotations:
        checksum/config: 61e0dbdd2c906907f7adf8d028538a64f70b22b75e5d06c44d3b56cc57a69c9a
        checksum/callout: d78beb5ea18c644e46c619d653a4cad7b82ad2bc5bdd847b0f5b3da92095f1aa
    spec:
      
      serviceAccountName: defenseclaw-callout
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: defenseclaw-substrate
            app.kubernetes.io/instance: dc
            app.kubernetes.io/component: callout
      containers:
      - name: callout
        image: ghcr.io/cisco-ai-defense/defenseclaw-gateway:1.0.10
        imagePullPolicy: IfNotPresent
        args:
        - substrate-extproc
        - --config=/etc/defenseclaw-callout/callout.yaml
        - --listen=:9443
        - --health-listen=:9444
        env:
        - name: DEFENSECLAW_CONFIG
          value: /etc/defenseclaw/config.yaml
        - name: DEFENSECLAW_HOME
          value: /tmp/defenseclaw
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: extproc
          containerPort: 9443
        - name: health
          containerPort: 9444
        readinessProbe:
          httpGet: {path: /readyz, port: health}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 10
          failureThreshold: 6
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: config
          mountPath: /etc/defenseclaw
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: ate
          mountPath: /var/run/ate
          readOnly: true
        - name: callout-config
          mountPath: /etc/defenseclaw-callout
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: defenseclaw-config
      - name: tmp
        emptyDir: {}
      - name: ate
        projected:
          sources:
          - serviceAccountToken:
              audience: api.ate-system.svc
              expirationSeconds: 3600
              path: token
      - name: callout-config
        configMap:
          name: defenseclaw-callout
