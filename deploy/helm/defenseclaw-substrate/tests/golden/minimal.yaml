  verbs: [get, update]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [defenseclaw-store-state, defenseclaw-policy-resets]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [configmaps]
