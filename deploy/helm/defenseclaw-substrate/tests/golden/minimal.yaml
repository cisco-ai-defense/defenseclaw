      restartPolicy: Never
      
      serviceAccountName: defenseclaw-hooks
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pre-delete
        image: ghcr.io/cisco-ai-defense/defenseclaw-gateway:1.0.11
        imagePullPolicy: IfNotPresent
        args:
        - substrate-chart
        - pre-delete
        - --plan=env:DEFENSECLAW_CHART_PLAN
        - --config=env:DEFENSECLAW_CHART_CONFIG
        env:
        # The plan and config ride in the Job itself: a hook ConfigMap would
        # outlive the release (Helm keeps hook resources), and each hook
        # must see its own release's plan (the target one in a rollback).
        - name: DEFENSECLAW_CHART_PLAN
          value: "{\n  \"actor_host\": \"defenseclaw-actor.defenseclaw-system.svc.cluster.local\",\n  \"api\": {\n    \"address\": \"api.ate-system.svc:443\",\n    \"audience\": \"api.ate-system.svc\"\n  },\n  \"app_version\": \"1.0.11\",\n  \"auth_delegator_binding\": \"defenseclaw-auth-delegator-defenseclaw-system-dc\",\n  \"chart_version\": \"1.0.11\",\n  \"controller_deployment\": \"defenseclaw-controller\",\n  \"credential_provider\": {\n    \"config_map\": \"k8s-credential-provider-namespace-policy\",\n    \"deployment\": \"k8s-credential-provider\",\n    \"grant\": false,\n    \"secrets_namespace\": \"defenseclaw-actor-secrets\",\n    \"user_secrets\": true,\n    \"user_secrets_namespace\": \"defenseclaw-user-secrets\"\n  },\n  \"delete_owner_token\": true,\n  \"editors\": [\n    \"system:serviceaccount:defenseclaw-system:defenseclaw-gateway\",\n    \"system:serviceaccount:defenseclaw-system:defenseclaw-controller\",\n    \"system:serviceaccount:defenseclaw-system:defenseclaw-hooks\"\n  ],\n  \"global_viewers\": [\n    \"system:serviceaccount:defenseclaw-system:defenseclaw-gateway\",\n    \"system:serviceaccount:defenseclaw-system:defenseclaw-controller\",\n    \"system:serviceaccount:defenseclaw-system:defenseclaw-callout\",\n    \"system:serviceaccount:defenseclaw-system:defenseclaw-hooks\"\n  ],\n  \"launcher_atespaces\": [],\n  \"namespace\": \"defenseclaw-system\",\n  \"owner_token_secret\": \"\",\n  \"relay_ca_secret\": \"defenseclaw-relay-ca\",\n  \"relay_session_secret\": \"defenseclaw-relay-session\",\n  \"release\": \"dc\",\n  \"schema\": 1,\n  \"store_schema\": 1,\n  \"store_state_config_map\": \"defenseclaw-store-state\",\n  \"substrate_namespace\": \"ate-system\",\n  \"supported_versions\": \"\\u003e=1.0.0 \\u003c1.1.0\",\n  \"writable_atespaces\": []\n}"
        - name: DEFENSECLAW_CHART_CONFIG
          value: "config_version: 9\nobservability:\n  defaults:\n    redaction_profile: sensitive\n  local:\n    max_store_mb: 1024\n  pricing:\n    models:\n    - cache_read_per_mtok: 0.1\n      cache_write_per_mtok: 1.25\n      input_per_mtok: 1\n      model: claude-haiku-4-5*\n      output_per_mtok: 5\n      provider: anthropic\n    - cache_read_per_mtok: 0.1\n      cache_write_per_mtok: 1.25\n      input_per_mtok: 1\n      model: claude-haiku-4-5*\n      output_per_mtok: 5\n      provider: bedrock\n    - cache_read_per_mtok: 0.3\n      cache_write_per_mtok: 3.75\n      input_per_mtok: 3\n      model: claude-sonnet-4-5*\n      output_per_mtok: 15\n      provider: anthropic\n    - cache_read_per_mtok: 0.3\n      cache_write_per_mtok: 3.75\n      input_per_mtok: 3\n      model: claude-sonnet-4-5*\n      output_per_mtok: 15\n      provider: bedrock\n    - cache_read_per_mtok: 0.5\n      cache_write_per_mtok: 6.25\n      input_per_mtok: 5\n      model: claude-opus-4-5*\n      output_per_mtok: 25\n      provider: anthropic\n    - cache_read_per_mtok: 0.5\n      cache_write_per_mtok: 6.25\n      input_per_mtok: 5\n      model: claude-opus-4-5*\n      output_per_mtok: 25\n      provider: bedrock\n    - cache_read_per_mtok: 0.125\n      input_per_mtok: 1.25\n      model: gpt-5\n      output_per_mtok: 10\n      provider: openai\n    - cache_read_per_mtok: 0.125\n      input_per_mtok: 1.25\n      model: gpt-5-20*\n      output_per_mtok: 10\n      provider: openai\n    - cache_read_per_mtok: 0.175\n      input_per_mtok: 1.75\n      model: gpt-5.2\n      output_per_mtok: 14\n      provider: openai\n    - cache_read_per_mtok: 0.175\n      input_per_mtok: 1.75\n      model: gpt-5.2-20*\n      output_per_mtok: 14\n      provider: openai\n    unknown_model: omit\n    version: 2026-11-21.1\n  tokenomics:\n    enabled: true\nsubstrate:\n  api:\n    address: api.ate-system.svc:443\n    auth: serviceaccount\n    ca_file: /var/run/ate/ca.crt\n    server_name: api.ate-system.svc\n    token_file: /var/run/ate/token\n  default_sandbox_class: gvisor\n  enabled: true\n  extproc:\n    body_inspection: auto\n    body_max_bytes: 1048576\n    enabled: true\n    failure_mode: closed\n  identity:\n    audience: defenseclaw\n    issuer: https://idp.ate-system.svc\n    revocation:\n      enabled: true\n      max_stale: 60s\n      max_tokens_per_person: 64\n      sync_interval: 5s\n    token_lifetime_seconds: 300\n  idle_suspend_after: 30m\n  launcher_atespaces: {}\n  require_attested_templates: true\n  services:\n    actor: defenseclaw-actor.defenseclaw-system.svc.cluster.local\n    admin: defenseclaw-admin.defenseclaw-system.svc.cluster.local\n  skills:\n    scan:\n      enabled: false\n  supported_versions: '>=1.0.0 <1.1.0'\n  unattended:\n    ask_timeout: 30m\n    asks: deny"
        - name: DEFENSECLAW_HOME
          value: /tmp/defenseclaw
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: ate
          mountPath: /var/run/ate
          readOnly: true
        - name: kube-api-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: ate
        projected:
          sources:
          - serviceAccountToken:
              audience: api.ate-system.svc
              expirationSeconds: 600
              path: token
      # The Kubernetes API token for the configmap and rollout steps.
      - name: kube-api-token
        projected:
          sources:
          - serviceAccountToken:
              expirationSeconds: 600
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - {key: ca.crt, path: ca.crt}
          - downwardAPI:
              items:
              - path: namespace
                fieldRef: {fieldPath: metadata.namespace}
