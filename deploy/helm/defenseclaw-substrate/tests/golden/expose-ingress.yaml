# Deny every ingress to this release's pods; the policies below open only
# what each listener needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: defenseclaw-default-deny
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.10
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: dc
      app.kubernetes.io/name: defenseclaw-substrate
  policyTypes: [Ingress]
