data:
  config.yaml: |
    config_version: 9
    substrate:
      api:
        address: api.ate-system.svc:443
        auth: serviceaccount
        ca_file: /var/run/ate/ca.crt
        server_name: api.ate-system.svc
        token_file: /var/run/ate/token
      default_sandbox_class: gvisor
      enabled: true
      extproc:
        body_inspection: auto
        body_max_bytes: 1048576
        enabled: true
        failure_mode: closed
      identity:
        audience: defenseclaw
        issuer: https://idp.ate-system.svc
        token_lifetime_seconds: 300
      idle_suspend_after: 30m
      launcher_atespaces: {}
      require_attested_templates: true
      services:
        actor: defenseclaw-actor.defenseclaw-system.svc.cluster.local
        admin: defenseclaw-admin.defenseclaw-system.svc.cluster.local
      supported_versions: '>=1.0.0 <1.1.0'
      unattended:
        ask_timeout: 30m
        asks: deny
