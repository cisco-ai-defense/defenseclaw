      app.kubernetes.io/instance: dc
      app.kubernetes.io/component: leader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: defenseclaw-substrate
        app.kubernetes.io/instance: dc
        app.kubernetes.io/component: leader
      annotations:
        checksum/config: ed8182da7be94dc0b471e6d3f44ae8f5e55aecffffd9a9a27054e52dbfa8becb
    spec:
      
      serviceAccountName: defenseclaw-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: leader
        image: ghcr.io/cisco-ai-defense/defenseclaw-gateway:1.0.10
        imagePullPolicy: IfNotPresent
        args:
        - serve
        - --substrate
        - --substrate-role=leader
        - --leader-listen=:7443
        - --metrics-listen=:9464
        - --lease=defenseclaw-gateway-leader
        - --store-dir=/var/lib/defenseclaw/store
        - --store-state-configmap=defenseclaw-store-state
        - --peer-bundle=/var/run/ate/credential-bundle.pem
        - --peer-trust=/var/run/ate/podidentity-ca.crt
        - --peer-id=spiffe://cluster.local/ns/defenseclaw-system/sa/defenseclaw-gateway
        - --callout-peer-id=spiffe://cluster.local/ns/defenseclaw-system/sa/defenseclaw-callout
        - --controller-peer-id=spiffe://cluster.local/ns/defenseclaw-system/sa/defenseclaw-controller
        env:
        - name: DEFENSECLAW_CONFIG
          value: /etc/defenseclaw/config.yaml
        - name: DEFENSECLAW_HOME
          value: /var/lib/defenseclaw/run/home
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: leader
          containerPort: 7443
        - name: metrics
          containerPort: 9464
        readinessProbe:
          httpGet: {path: /readyz, port: metrics}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: metrics}
          periodSeconds: 10
          failureThreshold: 6
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        
        - name: config
          mountPath: /etc/defenseclaw
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /var/lib/defenseclaw/run
        - name: ate
          mountPath: /var/run/ate
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        # The value-lineage key every replica shares (the chain-key hook creates it).
        - name: chain-key
          mountPath: /var/run/secrets/defenseclaw-chain-key
          readOnly: true
        - name: relay-session
          mountPath: /var/run/secrets/defenseclaw-relay-session
          readOnly: true
        - name: llm-credentials
          mountPath: /var/run/secrets/defenseclaw-llm
          readOnly: true
        - name: store
          mountPath: /var/lib/defenseclaw/store
        # The Kubernetes API token for the leader Lease and the store state
        # ConfigMap (the gateway's automount stays off).
        - name: kube-api-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: defenseclaw-config
          # Read-only for everyone (managed: the config trust check wants an
          # admin-owned file nobody else can write).
          defaultMode: 0444
      - name: tmp
        emptyDir: {}
      # DEFENSECLAW_HOME lives under a memory emptyDir: its root is root-owned and
      # sticky (3777), which the audit store's directory trust check accepts; a
      # disk emptyDir (2777) or a PVC root (0777 or 2775) is refused.
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: ate
        projected:
          sources:
          - serviceAccountToken:
