# Source: defenseclaw-substrate/templates/networkpolicy.yaml
# The pods that hold keys or dial out (gateway, leader: provider keys and the
# store; controller: template registries on 443, GAP-0131;
# callout: actor_secrets) may connect only where they need to (GAP-0084).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: defenseclaw-gateway-egress
  labels:
    app.kubernetes.io/name: defenseclaw-substrate
    app.kubernetes.io/instance: dc
    app.kubernetes.io/version: "1.0.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: defenseclaw
    helm.sh/chart: defenseclaw-substrate-1.0.10
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: defenseclaw-substrate
      app.kubernetes.io/instance: dc
      app.kubernetes.io/component: gateway
  policyTypes: [Egress]
  egress:
  # DNS.
  - ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  # This release's pods (leader RPC, admin listener for the callout judge).
  - to:
    -
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: dc
          app.kubernetes.io/name: defenseclaw-substrate
  # The Substrate namespace (ate-api-server, the actor JWT issuer's JWKS).
  # A NetworkPolicy matches the pod port after the Service is resolved,
  # so these are the pods' container ports (GAP-0139: idp serves 8443
  # behind Service port 443).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ate-system
    ports:
    - {protocol: TCP, port: 443}
    - {protocol: TCP, port: 8443}
    - {protocol: TCP, port: 8445}
  # Model providers (/llm) and template registries (controller), the
  # Kubernetes API (leader Lease, store state, resets;
  # 6443 is its usual endpoint port). The callout needs neither.
  - ports:
    - {protocol: TCP, port: 443}
    - {protocol: TCP, port: 6443}
  # OTLP export.
  - ports:
    - {protocol: TCP, port: 4317}
    - {protocol: TCP, port: 4318}
---
