# Kubernetes secret sources (GAP-0183): the gateway gets a Role in each
# source namespace, so the secrets admin API can write them. Shared sources
# are named; a per_person source with {person} in the Secret name covers the
# namespace (kept for per-person Secrets only).
config:
  substrate:
    identity:
      issuer: https://idp.cluster-p.example
    launcher_atespaces:
      engineering: [eng-web]
    secrets:
    - name: github-push
      source: ate-secret://k8s.io/default/defenseclaw-actor-secrets/github-app/token
      inject: {hosts: [github.com], header: Authorization, prefix: "Bearer ", placeholder: DC_SECRET_GITHUB}
      scope: shared
      profiles: [engineering]
    - name: pypi-upload
      source: ate-secret://k8s.io/default/defenseclaw-actor-secrets/pypi/token
      inject: {hosts: [upload.pypi.org], header: Authorization, prefix: "Bearer ", placeholder: DC_SECRET_PYPI}
      scope: shared
      profiles: [engineering]
    - name: npm-token
      source: ate-secret://k8s.io/default/dc-people/{person}-npm/token
      inject: {hosts: [registry.npmjs.org], header: Authorization, prefix: "Bearer ", placeholder: DC_SECRET_NPM}
      scope: per_person
      profiles: [engineering]
