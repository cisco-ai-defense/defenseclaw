# Fixed replicas, no NetworkPolicy, no pod certificates, no credential grant.
gateway:
  hpa: {enabled: false, minReplicas: 2, maxReplicas: 2}
  replicas: 3
callout:
  hpa: {enabled: false, minReplicas: 2, maxReplicas: 2}
networkPolicy:
  enabled: false
podCertificates:
  enabled: false
substrate:
  namespace: ate-system
  apiAddress: api.ate-system.svc:443
  apiAudience: api.ate-system.svc
  egressSpiffeId: spiffe://cluster.local/ns/ate-system/sa/atenet-egress
  egressPodLabels: {app: atenet-egress}
  credentialProvider:
    grant: false
