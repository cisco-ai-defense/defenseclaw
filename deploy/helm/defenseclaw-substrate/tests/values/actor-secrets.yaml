# The exposed actor_secrets Secret: mounted in the callout and the gateway
# (/llm exact-value DLP, F3), with config.substrate.extproc.actor_secrets_dir
# rendered for both.
callout:
  actorSecrets:
    secretName: defenseclaw-actor-secrets-dlp
config:
  substrate:
    admin:
      actor_secrets: [db-password]
