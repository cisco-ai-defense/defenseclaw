services:
  defenseclaw:
    build:
      context: ./defenseclaw
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DEFENSECLAW_MASTER_KEY=${DEFENSECLAW_MASTER_KEY:-sk-defenseclaw-poc}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_REGION_NAME=${AWS_REGION_NAME:-us-west-2}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LITELLM_VERBOSE=${LITELLM_VERBOSE:-false}
    volumes:
      - ./config:/app/config:ro
      - ./defenseclaw:/app/defenseclaw:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health/liveliness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-agent:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    environment:
      - DEFENSECLAW_URL=http://defenseclaw:4000
      - DEFENSECLAW_MASTER_KEY=${DEFENSECLAW_MASTER_KEY:-sk-defenseclaw-poc}
    depends_on:
      defenseclaw:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - hermes-data:/data/hermes

volumes:
  hermes-data:
