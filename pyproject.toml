[project]
name = "defenseclaw"
version = "1.0.0"
description = "Enterprise governance layer for OpenClaw — secures agentic AI deployments"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.txt"]
dependencies = [
    "click>=8.3.3,<9",
    "pyyaml==6.0.3",
    "requests==2.33.0",
    # uv overrides are resolver-only and are not emitted as Requires-Dist.
    # Keep every advisory-backed transitive floor direct and unmarked so plain
    # wheel installs enforce the same minimums on every supported Python line.
    # CVE-2026-69247 is fixed in 50.0.0; keep the next-major ceiling so
    # published wheels and managed installs share a reviewable upgrade line.
    "cryptography>=50.0.0,<51",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "urllib3>=2.8.0",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    # CVE-2026-59881 and CVE-2026-69243/69244 are fixed by 3.14.3.
    "aiohttp>=3.14.3,<4",
    # CVE-2026-104874 is fixed in 6.9.1 (aiohttp and yarl dependency).
    "multidict>=6.9.1,<7",
    "pyjwt>=2.15.0",
    "starlette>=1.3.1,<1.4",
    "fastapi>=0.137.1,<0.138",
    # The scanner/TUI runtime is one dependency set. DefenseClaw uses the
    # Textual 8.2 ANSI-theme and Tabs APIs, and Textual 8 requires Rich >=14.2.
    # Keep the tested 8.x bounds in wheel metadata so managed installs do not
    # depend on uv's development-only overrides or float to a future major.
    "rich>=14.2,<15",
    "textual>=8.2.8,<9",
    # PYSEC-2026-2987 is fixed in 2.20.0. Keep the floor in wheel metadata
    # because Rich renders untrusted scanner and gateway output through it.
    "pygments>=2.20,<3",
    # Runtime validation of config_version: 8 uses the schema bundled in the
    # wheel. The 0.8.4 bridge already carries this transitively; the hard-cut
    # controller verifies that exact pre-existing runtime before mutation.
    "jsonschema>=4.23.0,<5",
    # Used by `defenseclaw setup galileo test` to emit a real, minimal OTLP
    # protobuf canary span without starting the gateway.
    "opentelemetry-proto>=1.28.0,<2",
    # Skill scanner 2.2.1 ships only platform wheels (each bundles a CEL
    # helper; there is no py3-none-any wheel or Windows arm64/musl wheel) and
    # requires Python >=3.11, so Python 3.10 installs have no skill scanning.
    # Its metadata allows the secure LiteLLM floor and Textual 8. Keep the
    # audited PyPI wheel URLs and hashes explicit: PyPI's Simple API has
    # returned package-specific 503s while the file URLs stayed healthy.
    # Windows CPython reports AMD64; uv's windows install target reports x86_64.
    "cisco-ai-skill-scanner @ https://files.pythonhosted.org/packages/81/20/b0d6458007fbac82cb76f1f7dfe139eb2cd6df63ed2ae997459b57b91204/cisco_ai_skill_scanner-2.2.1-cp311.cp312.cp313.cp314-none-macosx_13_0_arm64.whl#sha256=233189ed423e343448d0e324979c521d65cfba69cf8a07f8f0207170161ed6fa ; python_version >= '3.11' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "cisco-ai-skill-scanner @ https://files.pythonhosted.org/packages/23/21/b52e8b105cdfb0b1f9f8c12ec49e90ceaee0c371180aa0a6e9e1a5bef2f3/cisco_ai_skill_scanner-2.2.1-cp311.cp312.cp313.cp314-none-macosx_13_0_x86_64.whl#sha256=e09940589bb93b7b49f131352b1581a030d180fa3775cee676442cf0aebffa59 ; python_version >= '3.11' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cisco-ai-skill-scanner @ https://files.pythonhosted.org/packages/8d/96/9386b30d14702d8a73616db100d5d2c8587a85848350b899ce916a6663e0/cisco_ai_skill_scanner-2.2.1-cp311.cp312.cp313.cp314-none-manylinux_2_17_aarch64.whl#sha256=e5e6a3d7f956afccae73c7326e3a1a2d43203a431b7cbd598333f6098b3190e6 ; python_version >= '3.11' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "cisco-ai-skill-scanner @ https://files.pythonhosted.org/packages/52/1a/843c79746aaf75efebc68a14c34112a426db74d167be165792060ad01992/cisco_ai_skill_scanner-2.2.1-cp311.cp312.cp313.cp314-none-manylinux_2_17_x86_64.whl#sha256=cd6ab22b72c4c8124c7a20f8d0b10582408336f17d340ace1fe7d9e3ba256680 ; python_version >= '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cisco-ai-skill-scanner @ https://files.pythonhosted.org/packages/4c/4c/ae046769e2e9dc051c8c0ecc93a0b1e8abd56493a6ba0f1a9a2ed349842e/cisco_ai_skill_scanner-2.2.1-cp311.cp312.cp313.cp314-none-win_amd64.whl#sha256=d1bf7bb295f314627c7f6a58d9debba05dce72e9251d65aaad48ca77736e8655 ; python_version >= '3.11' and sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    # Magika 1.0.2 removes its obsolete Windows onnxruntime<=1.20.1 cap and
    # selects a supported ONNX Runtime for each Python line. Keep that floor in
    # published-wheel metadata as well as the native installer's uv lock.
    "magika>=1.0.2,<2",
    # MCP scanner >=4.3.1 pins vulnerable LiteLLM releases exactly. 4.3.0 is
    # the newest trusted release whose METADATA permits the project's secure
    # LiteLLM floor. Pin its PyPI-attested wheel and hash until upstream ships
    # a release compatible with LiteLLM >=1.91.5.
    # TODO(mcp-scanner 4.8.x): every 4.8.x release (4.8.5 included) pins
    # litellm==1.93.0, which is vulnerable to CVE-2026-84377 (fixed on that
    # line in 1.93.2). Move to 4.8.x only when upstream publishes a release
    # that relaxes the LiteLLM pin (for example litellm>=1.91.5,<2).
    "cisco-ai-mcp-scanner @ https://files.pythonhosted.org/packages/af/40/d42943f9e3da40ee9b5f00439fda38b62fc379034383f85a6e06d7825796/cisco_ai_mcp_scanner-4.3.0-py3-none-any.whl#sha256=ea1a30d6bc282f2b4081bc4eced4287a20326891588624d5b2e07b388710b812 ; python_version>='3.11'",
    # CVE-2026-52869, CVE-2026-52870, and CVE-2026-59950 affect older MCP
    # SDK releases. DefenseClaw imports the SDK directly for stdio scanning,
    # so keep the fixed floor in published-wheel metadata as well as uv.lock.
    "mcp>=1.28.1,<2",
    # Declare MCP Scanner's YARA engine directly so uv can select the local,
    # Native Setup substitutes the repository-owned, YARA-X-backed compatibility
    # wheel and validates the exact MCP Scanner API; source installs use
    # VirusTotal's upstream yara-python distribution.
    "yara-python>=4.5.4; python_version>='3.11'",
    # CVE-2026-40217 is fixed in 1.83.10; CVE-2026-49468 is fixed in 1.84.0.
    # CVE-2026-84377 is fixed on the 1.91 line in 1.91.5. Stable LiteLLM
    # releases currently declare Python <3.14. Version 1.92.0 also dropped
    # the portable wheel required by Windows and macOS, so keep the latest
    # portable line until upstream restores cross-platform wheels.
    "litellm>=1.91.5,<1.92.0",
    # LiteLLM requires <9 and the development OpenTelemetry API requires
    # <8.8; retain the security floor while expressing their intersection.
    "importlib-metadata>=8.7.1,<8.8",
    # AWS Bedrock support is bundled. LiteLLM lazy-imports boto3 for
    # SigV4 (iam_credentials / profile / instance_role) and for the
    # Anthropic-on-Bedrock route used by ABSK bearer tokens. Bundling
    # it costs ~30 MB on top of the existing 428 MB base install
    # (~7%) and removes a recurring first-run failure for the largest
    # enterprise LLM provider in the matrix. Vertex AI's SDK is ~286
    # MB and kept as an opt-in extra (see ``[vertex]``) — flip there
    # if usage analytics ever justify the disk cost.
    "boto3>=1.34",
    # ``tomllib`` only entered the stdlib in 3.11; on 3.10 (allowed by
    # ``requires-python = ">=3.10,<3.14"``) the code falls back to ``tomli``,
    # so it must be installed there to parse TOML.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Vertex AI auth (service-account JSON, ADC, workload identity).
# LiteLLM lazy-imports ``google-cloud-aiplatform`` for this route, and
# the SDK pulls ~286 MB of transitive deps (BigQuery, Cloud Storage,
# Cloud Resource Manager, gRPC, protobuf). That nearly doubles the
# base install, so we keep it opt-in. Source checkouts enable it with
# ``uv sync --extra vertex``. Bedrock is bundled by
# default — see the ``boto3`` entry under ``[project].dependencies``.
vertex = ["google-cloud-aiplatform>=1.60", "google-auth>=2.30"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-asyncio==1.3.0",
    "hypothesis==6.140.4",
    "freezegun==1.5.5",
    "jsonschema>=4.23.0",
    "ruff==0.15.7",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.scripts]
defenseclaw = "defenseclaw.entry:main"
defenseclaw-observability = "defenseclaw.observability.local_stack:main"

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["cli"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
defenseclaw = [
    "_data/policies/*.yaml",
    "_data/policies/rego/*.rego",
    "_data/policies/rego/*.json",
    "_data/policies/yara/mcp-tools/*.yara",
    "_data/envvars/*.json",
    "_data/plugin/*.json",
    "_data/skills/codeguard/*.md",
    "_data/skills/codeguard/*.yaml",
    "_data/skills/codeguard/*.py",
    "_data/splunk_local_bridge/bin/*",
    "_data/splunk_local_bridge/compose/*",
    "_data/splunk_local_bridge/env/.env.example",
    "_data/splunk_local_bridge/s3_exporter/*",
    "_data/splunk_local_bridge/s3_exporter/tests/*",
    "_data/splunk_local_bridge/splunk/*",
    "_data/splunk_local_bridge/splunk/ansible/*",
    "_data/splunk_local_bridge/splunk/bin/*",
    "_data/splunk_local_bridge/splunk/apps/defenseclaw_local_mode/bin/*",
    "_data/splunk_local_bridge/splunk/apps/defenseclaw_local_mode/default/*",
    "_data/splunk_local_bridge/splunk/apps/defenseclaw_local_mode/default/data/ui/nav/*",
    "_data/splunk_local_bridge/splunk/apps/defenseclaw_local_mode/default/data/ui/views/*",
    "_data/splunk_local_bridge/splunk/apps/defenseclaw_local_mode/lookups/*",
    "_data/splunk_local_bridge/splunk/apps/defenseclaw_local_mode/metadata/*",
    "_data/llm/*.json",
    "_data/config/v8/*.json",
    "_data/config/v8/*.yaml",
    "_data/config/v8/*.md",
    "_data/telemetry/v8/telemetry.schema.json",
    "_data/telemetry/v8/catalog.json",
    "_data/telemetry/v8/v7-exporter-selection.json",
    "_data/telemetry/v8/galileo-rich-v2.json",
    "_data/telemetry/v8/local-observability-v1.json",
    "_data/telemetry/v8/openinference-v1.json",
    "inventory/ai_signatures.json",
    "inventory/acp_registry.json",
    "inventory/hook_contracts.json",
    "inventory/validated_versions.json",
    "_data/policies/guardrail/default/*.yaml",
    "_data/policies/guardrail/default/judge/*.yaml",
    "_data/policies/guardrail/default/rules/*.yaml",
    "_data/policies/guardrail/strict/*.yaml",
    "_data/policies/guardrail/strict/judge/*.yaml",
    "_data/policies/guardrail/strict/rules/*.yaml",
    "_data/policies/guardrail/permissive/*.yaml",
    "_data/policies/guardrail/permissive/judge/*.yaml",
    "_data/policies/guardrail/permissive/rules/*.yaml",
    "_data/policies/guardrail/tool-chains.json",
    "_data/policies/guardrail-use-cases/*/README.md",
    "_data/policies/guardrail-use-cases/*/*.yaml",
    "_data/policies/guardrail-use-cases/*/rules/*.yaml",
    "_data/local_observability_stack/*.md",
    "_data/local_observability_stack/*.yml",
    "_data/local_observability_stack/*.sh",
    "_data/local_observability_stack/.gitignore",
    "_data/local_observability_stack/bin/*",
    "_data/local_observability_stack/otel-collector/*.yaml",
    "_data/local_observability_stack/prometheus/*.yml",
    "_data/local_observability_stack/prometheus/rules/*.yml",
    "_data/local_observability_stack/loki/*.yaml",
    "_data/local_observability_stack/tempo/*.yaml",
    "_data/local_observability_stack/grafana/dashboards/*.json",
    "_data/local_observability_stack/grafana/provisioning/dashboards/*.yml",
    "_data/local_observability_stack/grafana/provisioning/datasources/*.yml",
    "_data/splunk_o11y_dashboards/*.md",
    "_data/splunk_o11y_dashboards/terraform/*.tf",
