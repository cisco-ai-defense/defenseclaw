[tool.uv]
default-groups = ["dev"]
override-dependencies = [
    "rich>=14.2,<15",
    # CVE-2026-39892 fixed in 46.0.7; GHSA-537c-gmf6-5ccf fixed in 48.0.1;
    # CVE-2026-69248/69249 fixed in 49.0.0; CVE-2026-69247 fixed in 50.0.0;
    # PYSEC-2026-3552 / -3553 / -3554 fixed in 50.0.0.
    "cryptography>=50.0.0,<51",
    # CVE-2026-40217 fixed in 1.83.10; CVE-2026-49468 fixed in 1.84.0;
    # CVE-2026-84377 fixed in 1.91.5.
    "litellm>=1.91.5,<1.92.0",
    # litellm pins exact transitive versions that conflict with what
    # the scanners (and our own pins) expect. We
    # override to a single compatible version per package — the newer
    # of the two — and rely on litellm's runtime API surface being
    # compatible with the bumped versions (verified via Python tests
    # in CI).
    "python-dotenv>=1.2.2",   # CVE-2026-28684 fixed in 1.2.2; scanner >=2.0.10 allows it.
    "openai==2.30.0",
    "importlib-metadata>=8.7.1,<8.8",
    "jsonschema>=4.26.0",
    # CVE-2026-40347/42561 fixed by 0.0.27; CVE-2026-53537..53540 fixed by 0.0.31.
    "python-multipart>=0.0.31",
    # CVE-2026-44431/44432 fixed in 2.7.0; CVE-2026-97687..97689 fixed in 2.8.0.
    "urllib3>=2.8.0",
    "idna>=3.15",               # CVE-2026-45409 fixed in 3.15
    "pydantic-settings>=2.14.2", # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    # aiohttp 3.13.4 fixes a batch of HTTP-parser CVEs (CVE-2026-22815,
    # CVE-2026-34513..34520, CVE-2026-34525); 3.14.0 additionally fixes
    # CVE-2026-34993 and CVE-2026-47265; 3.14.1 fixes CVE-2026-54273..54280;
    # 3.14.2 fixes PYSEC-2026-3546 and PYSEC-2026-3547; 3.14.3 fixes
    # CVE-2026-59881, CVE-2026-69243/69244, and PYSEC-2026-3545.
    # LiteLLM's transitive pin floats aiohttp downward without this override.
    "aiohttp>=3.14.3,<4",
    # CVE-2026-104874 fixed in 6.9.1. multidict comes in through aiohttp
    # and yarl, which accept older releases.
    "multidict>=6.9.1,<7",
    # pyjwt 2.13.0 fixes PYSEC-2026-175, PYSEC-2026-177, PYSEC-2026-178 and
    # PYSEC-2026-179; 2.14.0 fixes CVE-2026-101917, CVE-2026-102265..102273
    # and CVE-2026-102274; 2.15.0 fixes CVE-2026-101918. Pulled in
    # transitively; pin it forward so the audit stays clean.
    "pyjwt>=2.15.0",
    # PYSEC-2026-161 (GHSA-86qp-5c8j-p5mr): Host-header validation
    # fixed in starlette 1.0.1. fastapi pins starlette<0.51 until
    # 0.130.0, so we also force fastapi forward to a release whose
    # upper bound permits 1.x. Scanner 2.0.11 broadens its fastapi
    # pin to <1,>=0.115 so this override no longer conflicts with
    # upstream.
    #
    # IMPORTANT: fastapi==0.136.3 is flagged malicious in OSV
    # (MAL-2026-4750, published 2026-05-23) — it inserts a "fastar"
    # typosquat into its ``[standard]`` optional-dependencies group.
    # We don't install ``fastapi[standard]`` so we don't pull the
    # typosquat in practice, but we still skip that release to keep
    # the audit clean. FastAPI 0.137.x allows the Starlette 1.3.x line,
    # which carries CVE-2026-48817/48818 and CVE-2026-54282/54283 fixes.
    "starlette>=1.3.1,<1.4",
    "fastapi>=0.137.1,<0.138",
    "textual>=8.2.8,<9",
    "pygments>=2.20,<3",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test suites lean on conventions ruff dislikes by default: descriptive
# CapWords_Suffix class names, ``MockScanner`` / ``MockPE`` mock locals,
# short ``C`` aliases for credential modules, deliberately-unused
# binding placeholders, and ``sys.path``-bootstrap imports above
# top-of-file. None of these are bugs and rewriting them all carries
# no review benefit, so silence the ruff codes there.
"cli/tests/**" = ["E501", "E402", "E702", "F841", "N801", "N803", "N806", "N812"]
# The CLI entry module answers the installer identity probe before it imports
# the command tree, so its remaining imports follow that early exit.
"cli/defenseclaw/main.py" = ["E402"]
# Hand-written migrations occasionally need slightly-long error lines
# for grep-friendly messages.
"cli/defenseclaw/migrations.py" = ["E501"]
# TUI panels embed wide ASCII tables / banner strings that we want
# kept on one line for readability.
"cli/defenseclaw/tui/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
# Every `async def test_*` in the TUI suite needs `pytest-asyncio` to
# actually be awaited; ``auto`` mode lets us drop the per-test
# ``@pytest.mark.asyncio`` decorations the codebase has 100+ of today.
asyncio_mode = "auto"
markers = [
    "tui_pilot: full-app or modal Pilot tests driven through app.run_test",
    "allow_subprocess: opts test out of the autouse subprocess ban (use only for executor.py integration tests)",
    "supported_connector_host: runs platform-neutral connector behavior on an explicitly supported host",
]
filterwarnings = [
    "ignore::DeprecationWarning:textual.*",
]
