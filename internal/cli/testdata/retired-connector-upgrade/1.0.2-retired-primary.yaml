# A 1.0.2 host whose primary connector was OpenHands, with OmniGent and Codex
# also set up, and per-connector settings in every section that has them.
claw:
  mode: openhands
guardrail:
  connector: openhands
  enabled: true
  mode: action
  connectors:
    openhands:
      mode: action
    omnigent:
      mode: observe
    codex:
      mode: action
asset_policy:
  connectors:
    openhands: {}
    codex: {}
data_dir: '@HOME@'
config_version: 9
observability: {}
