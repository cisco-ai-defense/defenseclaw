id: defenseclaw-copilot-bedrock-mantle-eu-west-1
display_name: Amazon Bedrock Mantle (Anthropic route) for Copilot CLI BYOK (DefenseClaw)
description: Binds a Bedrock API key to the Mantle Anthropic Messages route (COPILOT_PROVIDER_BASE_URL=https://bedrock-mantle.eu-west-1.api.aws/anthropic) as x-api-key for a Copilot CLI custom provider; only the Copilot CLI binaries may use it
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Amazon Bedrock API key (short-term or long-term)
    env_vars: [COPILOT_PROVIDER_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
endpoints:
  - host: "bedrock-mantle.eu-west-1.api.aws"
    port: 443
    protocol: rest
    access: full
    enforcement: enforce
binaries: ["/opt/defenseclaw-harness/copilot/cache/pkg/linux-arm64/1.0.88/prebuilds/linux-arm64/copilot-runtime", "/opt/defenseclaw-harness/copilot/lib/node_modules/@github/copilot/node_modules/@github/copilot-linux-arm64/copilot"]
