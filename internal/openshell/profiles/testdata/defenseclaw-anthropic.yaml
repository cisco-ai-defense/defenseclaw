id: defenseclaw-anthropic
display_name: Anthropic API (DefenseClaw)
description: Binds ANTHROPIC_API_KEY to the Anthropic Messages API as x-api-key; only the pinned harness binaries may use it
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Anthropic API key
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: full
    enforcement: enforce
binaries: ["/opt/defenseclaw-harness/claudecode/bin/claude"]
