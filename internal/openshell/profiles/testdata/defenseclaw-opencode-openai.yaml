id: defenseclaw-opencode-openai
display_name: OpenAI API for OpenCode (DefenseClaw)
description: Binds OPENAI_API_KEY to the OpenAI API as a bearer for OpenCode's openai provider; only the OpenCode binary may use it
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: full
    enforcement: enforce
binaries: ["/opt/defenseclaw-harness/opencode/lib/node_modules/opencode-ai/bin/opencode.exe"]
