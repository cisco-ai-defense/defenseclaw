version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /dev/urandom
    - /etc
    - /lib
    - /opt
    - /proc
    - /usr
    - /var/log
  read_write:
    - /dev/null
    - /dev/ptmx
    - /dev/pts
    - /dev/tty
    - /sandbox
    - /tmp
    - /work/myapp
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  docs_python:
    endpoints:
      - host: docs.python.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
  host_port_5432:
    endpoints:
      - host: host.openshell.internal
        port: 5432
        protocol: tcp
        tls: skip
    binaries:
      - path: /**
