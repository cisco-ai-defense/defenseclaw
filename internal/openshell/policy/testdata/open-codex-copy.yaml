version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /dev/urandom
    - /etc
    - /lib
    - /opt
    - /proc
    - /usr
    - /var/log
  read_write:
    - /dev/full
    - /dev/null
    - /dev/ptmx
    - /dev/pts
    - /dev/random
    - /dev/shm
    - /dev/tty
    - /dev/zero
    - /sandbox
    - /tmp
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1001"
  run_as_group: "1001"
network_policies:
  defenseclaw_egress:
    endpoints:
      - host: host.openshell.internal
        port: 18972
        protocol: tcp
        tls: skip
    binaries:
      - path: /**
