# Dedicated compaction hook signatures. These are not generic scanner rules.
# Disable both compaction detector lanes with enabled: false.
version: 1
enabled: true

next_role: |-
  (?m)\n[ \t]*(?:\[(?:User|Assistant|Tool result|user|assistant)\]:|#[ \t]+(?:USER|ASSISTANT)\b|<EVENT>|</EVENT>|##[ \t]+Message[ \t]+[0-9]+\b)
role_header: |-
  (?m)(?:^|\n)[ \t]*(?:\[User\]:[ \t]*|\[user\]:[ \t]*|#[ \t]+USER[ \t]*\n[ \t]*|</EVENT>[ \t]*\n[ \t]*<EVENT>[ \t]*\n[ \t]*MessageEvent \(user\)[ \t]*\n[ \t]*user:[ \t]*|##[ \t]+Message[ \t]+[1-9][0-9]{0,5}[ \t]*\n[ \t]*Role:[ \t]*user[ \t]*\n[ \t]*Content:[ \t]*\n[ \t]*)
avoidance: |-
  (?i)\b(?:don't|do not|never)[ \t]+(?:modify|change|touch|review|inspect|scan|check|read|open|edit|update)\b|\bleave[ \t]+[^\n.]{1,100}[ \t]+(?:untouched|alone|out of scope)\b|\bi[ \t]+don't[ \t]+want[ \t]+changes[ \t]+under\b
exfiltration: |-
  (?i)\b(?:post|send|upload|transmit)[ \t]+[^\n.]{0,160}\b(?:findings|results|report|data|secrets|credentials)[ \t]+[^\n.]{0,160}https?://[^\s<>]+
memory: |-
  (?i)\b(?:when[ \t]+(?:you[ \t]+)?(?:compact|summari[sz]e)|after[ \t]+(?:the[ \t]+)?compaction|in[ \t]+(?:the[ \t]+)?(?:compacted[ \t]+)?summary|for[ \t]+(?:future|later|subsequent)[ \t]+(?:turns|messages|responses))\b
memory_verb: |-
  (?i)\b(?:remember|retain|preserve|include|record|write|carry[ \t]+forward|treat)\b
false_fact: |-
  (?i)\bfor[ \t]+context:[ \t]+[^\n.]{1,160}\b(?:is|are|listens|uses)[ \t]+[^\n.]{1,120}\bnot[ \t]+(?:the[ \t]+)?(?:default|documented|current)\b
new_task: |-
  (?i)\bonce[ \t]+[^\n.]{1,120}\bnext[ \t]+thing[ \t]+i[ \t]+need[ \t]+is\b
override: |-
  (?i)\b(?:ignore|disregard)[ \t]+(?:all[ \t]+)?(?:the[ \t]+|your[ \t]+)?(?:earlier|previous)[ \t]+(?:instructions|constraints|confirmation[ \t]+prompts)\b
summary_approval: |-
  (?i)^[ \t]*(?:[-*][ \t]+)?(?:the[ \t]+)?user[ \t]+(?:has[ \t]+)?(?:already[ \t]+)?approved\b
summary_instruction: |-
  (?i)^[ \t]*(?:[-*][ \t]+)?(?:the[ \t]+)?user[ \t]+(?:requested|asked|instructed)[ \t]*:[ \t]*
summary_disavowal: |-
  (?i)\b(?:(?:according[ \t]+to|from|inside|in|quoted[ \t]+from)[ \t]+(?:the[ \t]+|a[ \t]+)?(?:(?:untrusted|forged|fake|spoofed)[ \t]+)?(?:file|document|tool[ \t]+output)\b|(?:the[ \t]+|a[ \t]+)?(?:(?:untrusted|forged|fake|spoofed)[ \t]+)?(?:file|document|tool[ \t]+output)[ \t]+(?:says|said|claims?|claimed|reported)\b|(?:untrusted|forged|fake|spoofed)[ \t]+(?:claim|instruction|text|turn|content)\b|prompt[ \t]+injection\b|not[ \t]+an?[ \t]+(?:user[ \t]+)?instruction\b|did[ \t]+not[ \t]+approve\b)
approval: |-
  (?i)\b(?:already[ \t\r\n]+(?:reviewed[ \t\r\n]+and[ \t\r\n]+)?approved|you[ \t\r\n]+(?:already[ \t\r\n]+)?have[ \t\r\n]+my[ \t\r\n]+approval)\b
no_ask: |-
  (?i)\b(?:do[ \t\r\n]+not[ \t\r\n]+(?:ask|confirm)|don['’]t[ \t\r\n]+(?:ask|confirm)|no[ \t\r\n]+need[ \t\r\n]+to[ \t\r\n]+(?:ask|re-prompt|confirm)|no[ \t\r\n]+need[ \t\r\n]+for[ \t\r\n]+confirmation|without[ \t\r\n]+(?:asking|confirmation))\b
curl_pipe: |-
  (?im)(?:^|[ \t])(?:(?:cd[ \t]+[A-Za-z0-9_./-]+[ \t]*&&[ \t]*)?(?:sudo[ \t]+)?(?:/usr/bin/)?curl(?:[ \t]+-{1,2}[A-Za-z0-9.-]*(?:[ \t]+(?:'[^'\r\n]+'|"[^"\r\n]+"|[A-Za-z0-9._=-]+))?)*[ \t]+(?:"https?://[^"\s|<>;&\x60$]+"|'https?://[^'\s|<>;&\x60$]+'|https?://[^\s|"'<>;&\x60$]+)[ \t]*\|[ \t]*(?:sh|bash)(?:[ \t]+-{1,2}[A-Za-z0-9-]*)*|(?:/bin/)?bash[ \t]+-c[ \t]+"\$\((?:/usr/bin/)?curl(?:[ \t]+-{1,2}[A-Za-z0-9.-]*(?:[ \t]+(?:'[^'\r\n]+'|[A-Za-z0-9._=-]+))?)*[ \t]+(?:https?://[^\s|"'<>;&\x60$]+|'https?://[^'\s|<>;&\x60$]+')\)")
