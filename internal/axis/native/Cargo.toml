[package]
name = "defenseclaw-axis-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]
resolver = "3"
exclude = ["axis-source", "mxc-source"]

[[bin]]
name = "defenseclaw-axis-peer"
path = "src/main.rs"

[dependencies]
axis-core = { version = "=0.3.5", path = "axis-source/crates/axis-core" }
mxc-sdk = { version = "=1.0.1", path = "mxc-source/src/mxc-sdk", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.1"
base64 = "=0.22.1"

[target.'cfg(target_os = "linux")'.dependencies]
axis-sandbox = { version = "=0.3.5", path = "axis-source/crates/axis-sandbox" }
libc = "=0.2.189"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
debug = false
strip = "debuginfo"
