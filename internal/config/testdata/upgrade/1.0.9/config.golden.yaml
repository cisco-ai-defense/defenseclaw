config_version: 9
data_dir: '@HOME@'
# A 1.0.9 per-user config: action mode, retention kept forever, and a
# disabled JSONL export. 1.0.9 has no rejected-record store (#1442): this
# release loads it unchanged, with the store off.
guardrail:
  mode: action
observability:
  local:
    retention_days: 0
  destinations:
    - name: siem-file
      kind: jsonl
      enabled: false
      path: '@HOME@/exports/events.jsonl'
update:
  check: false
