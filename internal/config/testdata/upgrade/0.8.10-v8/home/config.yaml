config_version: 8
data_dir: '@HOME@'
# A 0.8.10 home after its own config v8 upgrade, with an operator rule pack,
# a skill-scanner policy file named custom (0.8.x read it relative to the
# working directory) and a hand-written provider overlay that names one
# provider twice.
update_check: false
guardrail:
  mode: action
  rule_pack_dir: '@HOME@/policies/guardrail/team'
scanners:
  skill_scanner:
    policy: custom
observability: {}
