# Test-only guardrail rules for the sandbox daemon E2E (daemon_e2e_test.go).
# The test copies the default rule pack into its own data directory and adds
# this file, so a harmless marker command is the one tool call a DefenseClaw
# verdict must deny, and another the one it only flags. Never install it in a
# real rule pack.
version: 1
category: e2e-marker
rules:
  - id: E2E-SANDBOX-MARKER
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.program == 'echo' && 'DCE2E-BLOCK-MARKER' in c.argv)
    pattern: 'DCE2E-BLOCK-MARKER'
    title: "E2E sandbox marker command"
    severity: CRITICAL
    confidence: 0.99
    tags: [e2e]
  # An advisory finding: the default profile answers HIGH with alert
  # (would_block false), so the hook shows a notice and the tool runs.
  - id: E2E-SANDBOX-ALERT
    tool_call_only: true
    expression: >-
      f.commands.exists(c, c.program == 'echo' && 'DCE2E-ALERT-MARKER' in c.argv)
    pattern: 'DCE2E-ALERT-MARKER'
    title: "E2E sandbox alert marker"
    severity: HIGH
    confidence: 0.99
    tags: [e2e]
