[package]
name = "defenseclaw-axis-mxc-macos-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]
resolver = "3"
exclude = ["axis-source", "mxc-source"]

# Fresh exact-commit checkouts are staged beside this manifest by the build job.
[dependencies]
axis-core = { version = "=0.3.5", path = "axis-source/crates/axis-core" }
mxc-sdk = { version = "=1.0.1", path = "mxc-source/src/mxc-sdk", default-features = false }
anyhow = "=1.0.104"
libc = "=0.2.189"
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[profile.release]
debug = false
strip = "debuginfo"
