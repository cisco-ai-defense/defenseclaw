[package]
name = "defenseclaw-axis-windows-psec-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "defenseclaw-axis-windows-psec-probe"
path = "src/main.rs"

[[bin]]
name = "defenseclaw-axis-windows-psec-loader-child"
path = "src/loader_child.rs"

[[bin]]
name = "defenseclaw-axis-windows-psec-boundary-child"
path = "src/boundary_child.rs"

[[bin]]
name = "defenseclaw-axis-windows-psec-dll-child"
path = "src/dll_startup_child.rs"

[features]
fixed-claude-create-control = []

[workspace]
resolver = "3"
exclude = ["axis-source", "mxc-source"]

[dependencies]
axis-core = { version = "=0.3.5", path = "axis-source/crates/axis-core" }
mxc-sdk = { version = "=1.0.1", path = "mxc-source/src/mxc-sdk", default-features = false }
anyhow = "=1.0.104"
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation",
    "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO",
    "Win32_System_Threading",
] }

[profile.release]
debug = false
strip = "debuginfo"
