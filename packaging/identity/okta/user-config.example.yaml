#
# Guardrail profiles chosen by Okta group, for a per-user (OSS) DefenseClaw
# install. Merge the guardrail keys into ~/.defenseclaw/config.yaml of the Okta
# user, then check it. The running gateway applies the change on its next reload
# (no restart in the default hot mode):
#
#   defenseclaw config validate
#   defenseclaw guardrail profile explain --connector claudecode
#
# A per-user install keeps its config in the user's own home, so the user can
# change their own profile. To enforce a policy, deliver admin-config.example.yaml
# to the standalone enterprise profile instead.
#
# Group names are the names `id -Gn` prints. SSSD serves only Okta groups that
# have a gidNumber. Profiles are not supported with the Secure Client integration.

guardrail:
  mode: observe
  profiles:
    okta-strict:
      description: Contractors - block at MEDIUM and above
      mode: action
      block_at: MEDIUM
    okta-standard:
      description: Everyone else - block at HIGH and above
      mode: action
      block_at: HIGH
  profile_assignments:
    - profile: okta-strict
      match:
        groups: ["contractors"]
  default_profile: okta-standard
