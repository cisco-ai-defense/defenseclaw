# tmpfiles.d for the DefenseClaw managed enterprise layout. The lifecycle
# creates the same tree at install time; this file restores the directory
# modes and owners at boot. Secrets are managed by the lifecycle, not here.
d /opt/defenseclaw 0755 root root -
d /opt/defenseclaw/bin 0755 root root -
d /etc/defenseclaw 0755 root root -
d /etc/defenseclaw/policies 0750 root defenseclaw -
d /etc/defenseclaw/hook-guardian 0750 root defenseclaw -
d /var/lib/defenseclaw 0700 defenseclaw defenseclaw -
d /var/lib/defenseclaw-hook-guardian 0750 root defenseclaw -
d /var/lib/defenseclaw-enterprise 0700 root root -
d /var/log/defenseclaw 0750 defenseclaw defenseclaw -
# The hook socket directory: the gateway-hook socket unit binds hook.sock
# here; without socket activation the gateway binds it itself.
d /run/defenseclaw-hook 0755 defenseclaw defenseclaw -
